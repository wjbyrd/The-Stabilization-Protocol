{"id":327,"q":"Refer to the SRPC graph. At inflation I3, comparing SRPC1 and SRPC2 shows:","options":["SRPC2 has higher unemployment","SRPC2 has lower unemployment","Both curves have U3","Both curves have U1"],"a":0,"tag":"supply_shock_pc","type":"graph_interpretation","objective":"LO36.3","difficulty":"elite","conceptCluster":"pc_graphs","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Missing the worse tradeoff after SRPC shifts upward.","feedback":"At the same inflation rate, the higher SRPC shows higher unemployment." ,"image":"srpc.webp"},
{"id":328,"q":"A central bank unexpectedly expands AD. Later, workers build the higher inflation into wage demands. Which sequence is most accurate?","options":["Move along SRPC, then SRPC shifts up","SRPC shifts down, then move along LRPC","LRPC shifts left, then AD falls","Move along LRAS, then M1 falls"],"a":0,"tag":"expectations","type":"integration","objective":"LO36.3","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Confusing immediate inflation surprise with later expectation adjustment.","feedback":"Unexpected AD expansion first moves along the SRPC; later expected inflation rises and shifts SRPC upward."},
{"id":329,"q":"The Fed announces disinflation, but workers doubt it and expected inflation stays high. What happens to the sacrifice ratio?","options":["It is likely higher","It is automatically zero","It becomes the MPC","It shifts LRAS right"],"a":0,"tag":"sacrifice_ratio","type":"interpretation","objective":"LO36.5","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Assuming announcements alone make policy credible.","feedback":"If expected inflation does not fall quickly, reducing actual inflation tends to require more output loss."},
{"id":330,"q":"If inflation falls from 12 percent to 7 percent and the sacrifice ratio is 3.5, output loss equals:","options":["17.5 percent of one year's output","15.5 percent of one year's output","8.5 percent of one year's output","5 percent of one year's output"],"a":0,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Adding the sacrifice ratio to the inflation reduction.","feedback":"Inflation falls by 5 points, so output loss is 3.5 x 5 = 17.5 percent of one year's output."},
{"id":331,"q":"If output loss is 14 percent and inflation falls by 4 percentage points, the sacrifice ratio is:","options":["3.5","4","10","18"],"a":0,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Multiplying instead of dividing.","feedback":"Sacrifice ratio equals output loss divided by inflation reduction, so 14/4 = 3.5."},
{"id":332,"q":"Which statement best connects a negative AD shock across AD-AS and Phillips curve models?","options":["AD shifts left; output falls; unemployment rises; inflation falls","SRAS shifts left; output falls; unemployment falls; inflation rises","AD shifts right; output rises; unemployment rises; inflation falls","LRAS shifts right; output falls; unemployment rises; inflation rises"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.2","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Confusing demand shocks with supply shocks across models.","feedback":"A negative AD shock lowers output and inflation, which maps to higher unemployment and lower inflation on the SRPC."},
{"id":333,"q":"Which statement best connects an adverse supply shock across AD-AS and Phillips curve models?","options":["SRAS shifts left; output falls; inflation and unemployment rise","AD shifts left; output falls; inflation and unemployment fall","SRAS shifts right; output rises; inflation and unemployment rise","AD shifts right; output rises; inflation falls and unemployment rises"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.3","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Missing stagflation across both models.","feedback":"An adverse supply shock lowers output and raises prices, mapping to higher unemployment and higher inflation."},
{"id":334,"q":"The Custodian sees inflation rising, output below potential, and unemployment rising. Which diagnosis fits best?","options":["Adverse supply shock","Positive demand shock","Expansionary fiscal policy","Favorable productivity shock"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.3","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Treating all inflation as excess demand.","feedback":"Rising inflation with falling output and rising unemployment is classic adverse supply shock logic."},
{"id":335,"q":"The Custodian sees inflation rising, output above potential, and unemployment below natural. Which diagnosis fits best?","options":["Positive demand shock","Adverse supply shock","Contractionary monetary policy","Negative productivity shock"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.2","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Confusing demand-driven inflation with supply-driven inflation.","feedback":"A positive demand shock raises output and inflation while lowering unemployment in the short run."},
{"id":336,"q":"A student sees inflation rising and immediately recommends contractionary policy. What missing diagnosis matters most?","options":["Whether inflation comes from AD growth or a supply shock","Whether M1 includes checkable deposits","Whether currency is fiat or commodity money","Whether the FOMC has seven governors"],"a":0,"tag":"ad_as_pc_integration","type":"trap","objective":"LO36.4","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Treating all inflation as excess demand.","feedback":"Inflation from excess AD and inflation from an adverse supply shock create different policy tradeoffs."},
{"id":337,"q":"An economy begins at natural output. AD rises unexpectedly, then expected prices rise. Which sequence is most likely?","options":["Output rises first, then SRAS shifts left","Output falls first, then SRAS shifts right","Prices fall first, then AD shifts left","LRAS shifts right, then output falls"],"a":0,"tag":"long_run_adjustment","type":"integration","objective":"LO34.5","difficulty":"elite","conceptCluster":"ad_as","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Skipping the short-run expansion before long-run adjustment.","feedback":"An unexpected AD increase raises output in the short run, but higher expected prices later shift SRAS left."},

{"id":340,"q":"Refer to the graph with LRAS. Starting at AD1-AS2, which shock creates stagflation before any policy response?","options":["AS2 shifts to AS1","AD1 shifts to AD2","AS1 shifts to AS2","LRAS shifts to Y2"],"a":0,"tag":"supply_shocks","type":"graph_interpretation","objective":"LO34.4","difficulty":"elite","conceptCluster":"ad_as_graphs","primarySkill":"trace_supply_shock","repairSkill":"trace_supply_shock","commonError":"Calling stagflation an AD movement.","feedback":"AS2 shifting left to AS1 lowers output to Y3 and raises the price level to P2.","image":"adaslras.webp"},
{"id":341,"q":"Refer to the graph. Starting at AD2-AS2, which movement could reduce output without lowering the price level?","options":["AS2 shifts to AS1","AD2 shifts to AD1","AS1 shifts to AS2","AD1 shifts to AD2"],"a":0,"tag":"supply_shocks","type":"graph_interpretation","objective":"LO34.4","difficulty":"elite","conceptCluster":"ad_as_graphs","primarySkill":"trace_supply_shock","repairSkill":"trace_supply_shock","commonError":"Assuming lower output always lowers prices.","feedback":"A leftward SRAS shift from AS2 to AS1 moves from Y2-P2 to Y1-P3: output falls while prices rise.","image":"adas1.webp"},
{"id":342,"q":"Refer to the money-market graph. If income rises and the Fed prevents interest rates from rising, what policy shift is needed?","options":["Increase money supply as money demand rises","Decrease money supply as money demand rises","Increase money demand as money supply falls","Decrease money demand as interest rates rise"],"a":0,"tag":"liquidity_preference","type":"integration","objective":"LO35.1","difficulty":"elite","conceptCluster":"policy_graphs","primarySkill":"money_demand_interest_rate","repairSkill":"money_demand_interest_rate","commonError":"Forgetting the Fed must offset higher money demand.","feedback":"Higher income raises money demand; to hold rates down, the Fed must increase money supply.","image":"moneyd2_moneys2.webp"},

{"id":345,"q":"A tax cut occurs while households expect future taxes to rise and save much of the extra income. What happens to the tax multiplier?","options":["It is weaker than simple models predict","It becomes infinite automatically","It shifts SRAS instead of AD","It eliminates crowding out"],"a":0,"tag":"fiscal_policy","type":"integration","objective":"LO35.3","difficulty":"elite","conceptCluster":"policy_transmission","primarySkill":"tax_cut_ad","repairSkill":"tax_cut_ad","commonError":"Assuming every tax cut creates the same consumption response.","feedback":"If households save much of the tax cut, the increase in consumption and AD is weaker."},
{"id":346,"q":"If government spending rises, MPC is high, and interest rates do not rise, which effect dominates?","options":["Multiplier effect","Crowding out","Monetary neutrality","Adverse supply shock"],"a":0,"tag":"multiplier_effect","type":"integration","objective":"LO35.4","difficulty":"elite","conceptCluster":"policy_transmission","primarySkill":"multiplier_effect","repairSkill":"multiplier_effect","commonError":"Assuming crowding out always dominates fiscal policy.","feedback":"A high MPC strengthens the multiplier, and little interest-rate increase means crowding out is weak."},

{"id":350,"q":"Refer to the SRPC graph. If the economy moves from SRPC1 to SRPC2, which statement should the Custodian reject?","options":["The tradeoff improved at every unemployment rate","Inflation is higher at the same unemployment rate","Expected inflation may have increased","A supply shock may have worsened the tradeoff"],"a":0,"tag":"supply_shock_pc","type":"trap","objective":"LO36.3","difficulty":"elite","conceptCluster":"pc_graphs","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Calling an upward SRPC shift an improvement.","feedback":"An upward SRPC shift worsens the tradeoff: inflation is higher at each unemployment rate.","image":"srpc.webp"},

{"id":354,"q":"A disinflation plan is credible, wage contracts adjust quickly, and expected inflation falls fast. Which path is most likely?","options":["Smaller unemployment increase for the same inflation reduction","Larger unemployment increase for the same inflation reduction","No change in expected inflation despite credibility","Permanent unemployment below natural"],"a":0,"tag":"sacrifice_ratio","type":"integration","objective":"LO36.5","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Ignoring expectations in sacrifice-ratio logic.","feedback":"Credibility and fast expectation adjustment reduce the output and unemployment cost of lowering inflation."},
{"id":355,"q":"A disinflation plan lacks credibility, wage contracts are slow, and expected inflation remains high. Which path is most likely?","options":["Larger output loss for the same inflation reduction","Smaller output loss for the same inflation reduction","Immediate movement to lower unemployment","LRPC becomes downward sloping"],"a":0,"tag":"sacrifice_ratio","type":"integration","objective":"LO36.5","difficulty":"elite","conceptCluster":"phillips_curve","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Assuming disinflation costs vanish without credibility.","feedback":"If expected inflation stays high, lowering actual inflation usually requires a larger output loss."}

// Legendary mode uses dedicated legendary and legendaryBoss pools.
// Keep these guards only as emergency protection in case a future edit accidentally empties a pool.
if(!questionBanks.legendary || questionBanks.legendary.length === 0){
    console.warn("Legendary pool is empty. Falling back to hard questions.");

function shuffleOptions(question){
    let q = {
        id: question.id,
        q: question.q,
        options: [...question.options],
        a: question.a,
        feedback: question.feedback,
        hint: question.hint,
        tag: question.tag,
        type: question.type,
        objective: question.objective,
        image: question.image,
        difficulty: question.difficulty,
        conceptCluster: question.conceptCluster,
        primarySkill: question.primarySkill,
        secondarySkills: question.secondarySkills ? [...question.secondarySkills] : [],
        repairSkill: question.repairSkill,
        commonError: question.commonError
    };

    let correct = q.options[q.a];

    for(let i = q.options.length - 1; i > 0; i--){
        let j = Math.floor(Math.random() * (i + 1));
        [q.options[i], q.options[j]] = [q.options[j], q.options[i]];
    }

    q.a = q.options.indexOf(correct);
    return q;
}

    }

    // Avoid three identical question types in a row
    let filtered = available;
    if (lastTypes.length >= 2) {

        if (last1 === last2) {

    let question = filtered[Math.floor(Math.random() * filtered.length)];

usedQuestions[poolName].push(question.id)

// Track types
lastTypes.push(question.type)
if(lastTypes.length > 3){
lastTypes.shift()
}

    return question;
}

function updateMazeTrack() {

    for (let i = 1; i <= 30; i++) {
        const box = document.createElement("div");
        box.setAttribute("role","img");
        box.setAttribute("aria-label",`Room ${i} of 30`);
        box.className = "maze-box";

        if (i < room) {
            box.innerText = "🟩";
            box.style.opacity = "0.6";

            else box.innerText = "⬛";
        }
        
        track.appendChild(box);
    }
}

// RANDOMIZATION SYSTEM — DO NOT MODIFY CORE LOGIC
// =============================================
// Controls fair, non-repeating selection of:
// - calculation generators
// - question pools
//
// Uses "shuffle + bag" system to ensure:
// - no immediate repeats
// - full coverage before reuse
//
// ---------------------------------------------
// SAFE TO EDIT:
// - adding new generators (calculationGenerators)
// - modifying pool content
//
// DO NOT MODIFY:
// - shuffle logic
// - bag system (calcBag, _remaining)
// - pop() usage
//
// Breaking this WILL cause:
// - repeated questions
// - uneven distribution
// - predictable patterns
//
// This ensures randomness WITHOUT repetition.
// =============================================     

// Fisher-Yates shuffle (uniform random order)
// Do not modify — ensures unbiased randomness     
function shuffle(arr){
    for(let i = arr.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// Bag system for calculation generators
// Ensures all generators are used before repeating
let calcBag = [];

// Pulls one calculation generator from the bag
// Refills bag when empty (reshuffled)
function pickCalcGenerator(){
    if(calcBag.length === 0){
        calcBag = shuffle([...calculationGenerators]);
    }
    return calcBag.pop();
}

// Generic bag-based random picker for any pool
// Prevents repeats until pool is exhausted
function pickRandom(pool){
    if(!pool._remaining || pool._remaining.length === 0){
        pool._remaining = shuffle([...pool]);
    }
    return pool._remaining.pop();
}

        return;
    }

        closeGraphLightbox();
    }

function checkRapidGuessing(isCorrect, responseTime){
    rapidGuessHistory.push({
        correct: isCorrect ? 1 : 0,
        responseTime: responseTime
    });

    if(rapidGuessHistory.length > RAPID_GUESS_CONFIG.windowSize){
        rapidGuessHistory.shift();
    }

    if(rapidGuessHistory.length < RAPID_GUESS_CONFIG.minAttempts){
        return {
            triggered: false,
            avgTime: responseTime,
            accuracy: isCorrect ? 1 : 0
        };
    }

    const recent = rapidGuessHistory.slice(-RAPID_GUESS_CONFIG.windowSize);

    const avgTime = recent.reduce((sum, item) => sum + item.responseTime, 0) / recent.length;
    const accuracy = recent.reduce((sum, item) => sum + item.correct, 0) / recent.length;

    return {
        triggered: avgTime < RAPID_GUESS_CONFIG.avgTimeMs && accuracy < RAPID_GUESS_CONFIG.maxAccuracy,
        avgTime,
        accuracy
    };
}

// =============================================
// COMPLETION CODE GENERATOR — DO NOT MODIFY
// =============================================
// This function creates a unique verification code
// based on player performance:
//
// Inputs:
// - name (player)
// - accuracy (% correct)
// - streak (max streak)
// - total (questions answered)
//
// It generates a deterministic hash so that:
// - codes are reproducible
// - codes cannot be easily faked manually
//
// ---------------------------------------------
// DO NOT CHANGE:
// - string structure (name|acc|streak|total|ARCHIVE42)
// - hashing logic
// - return format ("ARCH-...")
//
// Changing this WILL:
// - invalidate all existing completion codes
// - break verification consistency
//
// ---------------------------------------------
// SAFE TO EDIT (if absolutely necessary):
// - "ARCHIVE42" → change only if rebranding ALL codes
// - "ARCH-" prefix → cosmetic only
//
// This is NOT encryption.
// It is a lightweight integrity check.
// =============================================
function generateCode(name, acc, streak, total){
    let str = `${name}|${acc}|${streak}|${total}|PROTOCOL36`;
    let hash = 0;

    for(let i = 0; i < str.length; i++){
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
    }

    return "LDGR-" + Math.abs(hash).toString(36).toUpperCase();
}

// =============================================
// ARRAY SHUFFLE UTILITY — SAFE TO USE, DO NOT MODIFY
// =============================================
// Fisher-Yates shuffle algorithm.
//
// Used to randomize:
// - question order
// - calculation generators
// - any randomized sequences
//
// DO NOT MODIFY unless you understand:
// - uniform randomness
// - bias in random selection
//
// Breaking this = predictable patterns in questions
// =============================================     
function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    return arr;
}

// - Keeps top 5 results only

// SAFE TO EDIT:

//
// WARNING:
// Clearing browser data will erase scores.
// =============================================
function updateHighScores(newTimeMs) {
    let scores = JSON.parse(localStorage.getItem("stabilizationProtocolHighScores")) || [];
    scores.push({ name: username, time: newTimeMs, date: new Date().toLocaleDateString() });
    
    // Sort by time (lowest/fastest first) and keep top 5
    scores.sort((a, b) => a.time - b.time);
    scores = scores.slice(0, 5);
    
    localStorage.setItem("stabilizationProtocolHighScores", JSON.stringify(scores));
    return scores;
}

// TIME FORMATTER — SAFE UTILITY
// =============================================
// Converts milliseconds → readable format (Xm Ys)
//
// Used for:
// - victory screen
// - performance tracking
//
// Safe to modify format if desired.
// =============================================     
function formatTime(ms) {
    let mins = Math.floor(ms / 60000);
    let secs = Math.floor((ms / 1000) % 60);
    return `${mins}m ${secs}s`;
}

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

function titleCase(value){
    return String(value || "")
        .replace(/_/g, " ")
        .replace(/-/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/\b\w/g, letter => letter.toUpperCase());
}

function formatMasteryLabel(key){
    if(!key) return "Unlabeled Concept";

    const text = String(key);
    const objectiveMatch = text.match(/^(LO\d+\.\d+)/);

    if(objectiveMatch && STABILIZATION_PROTOCOL_OBJECTIVE_LABELS[objectiveMatch[1]]){
        const suffix = text
            .replace(objectiveMatch[1], "")
            .replace(/^_+/, "")
            .replace(/_/g, " ")
            .trim();

        return suffix
            ? `${STABILIZATION_PROTOCOL_OBJECTIVE_LABELS[objectiveMatch[1]]}: ${titleCase(suffix)}`
            : STABILIZATION_PROTOCOL_OBJECTIVE_LABELS[objectiveMatch[1]];
    }

    return titleCase(text);
}

function formatPercent(value){
    if(value === null || value === undefined || !Number.isFinite(Number(value))) return "—";
    return `${Math.round(Number(value) * 100)}%`;
}

function formatSeconds(ms){
    const numeric = Number(ms || 0);
    if(!Number.isFinite(numeric) || numeric <= 0) return "—";
    return `${Math.round(numeric / 1000)}s`;
}

function getBucketEntry(key, bucket, category = "concept"){
    if(!bucket || !bucket.attempts){
        return null;
    }

    const attempts = Number(bucket.attempts || 0);
    const correct = Number(bucket.correct || 0);
    const accuracy = attempts ? correct / attempts : null;
    const typeForTiming = category === "type" ? key : "default";
    const target = getTypeTargetMs(typeForTiming);
    const avgTime = Number(bucket.avgTime || 0);
    const timeRatio = avgTime && target ? avgTime / target : 1;
    const fluency = accuracy === null
        ? 0
        : accuracy - clamp((timeRatio - 1) * 0.25, 0, 0.35);

    return {
        key,
        label: formatMasteryLabel(key),
        category,
        attempts,
        correct,
        accuracy,
        avgTime,
        timeRatio,
        fluency
    };
}

function getEntriesFromBuckets(source, category = "concept"){
    return Object.entries(source || {})
        .map(([key, bucket]) => getBucketEntry(key, bucket, category))
        .filter(Boolean);
}

function getTypeMasteryEntries(){
    const typeBuckets = {};

    Object.values(masteryState.byTag || {}).forEach(tagBucket => {
        Object.entries(tagBucket.byType || {}).forEach(([type, bucket]) => {
            if(!typeBuckets[type]){
                typeBuckets[type] = { attempts: 0, correct: 0, avgTime: 0 };
            }

            const oldAttempts = typeBuckets[type].attempts;
            const newAttempts = oldAttempts + Number(bucket.attempts || 0);

            typeBuckets[type].correct += Number(bucket.correct || 0);
            typeBuckets[type].avgTime = newAttempts
                ? ((typeBuckets[type].avgTime * oldAttempts) + (Number(bucket.avgTime || 0) * Number(bucket.attempts || 0))) / newAttempts
                : 0;
            typeBuckets[type].attempts = newAttempts;
        });
    });

    return getEntriesFromBuckets(typeBuckets, "type");
}

function sortStrongest(entries){
    return [...entries]
        .filter(entry => entry.attempts >= 2)
        .sort((a,b) => (b.accuracy - a.accuracy) || (b.fluency - a.fluency) || (b.attempts - a.attempts));
}

function sortWeakest(entries){
    const enoughData = entries.filter(entry => entry.attempts >= 2);
    const pool = enoughData.length ? enoughData : entries;

    return [...pool]
        .sort((a,b) => (a.accuracy - b.accuracy) || (a.fluency - b.fluency) || (b.avgTime - a.avgTime));
}

function getMeaningfulWeakEntries(entries, accuracyThreshold = 0.85){
    return sortWeakest(entries)
        .filter(entry => entry && entry.attempts >= 2)
        .filter(entry => {
            const accuracy = entry.accuracy === null || entry.accuracy === undefined
                ? 1
                : Number(entry.accuracy);

            return accuracy < accuracyThreshold || entry.timeRatio > 1.35;
        });
}

function hasMeaningfulWeakness(entries, accuracyThreshold = 0.85){
    return (entries || []).some(entry => {
        if(!entry || entry.attempts < 2) return false;

        const accuracy = entry.accuracy === null || entry.accuracy === undefined
            ? 1
            : Number(entry.accuracy);

        return accuracy < accuracyThreshold || entry.timeRatio > 1.35;
    });
}

function renderMasteryRows(entries, emptyText){
    if(!entries || entries.length === 0){
        return `<p class="mastery-empty">${escapeHTML(emptyText)}</p>`;
    }

    return entries.map(entry => {
        const pct = Math.max(0, Math.min(100, Math.round((entry.accuracy || 0) * 100)));
        const pace = entry.timeRatio > 1.25
            ? "Slow response pattern"
            : entry.timeRatio < 0.65
                ? "Fast response pattern"
                : "Stable pace";

        return `
            <div class="mastery-row">
                <div class="mastery-row-main">
                    <span class="mastery-row-name">${escapeHTML(entry.label)}</span>
                    <span class="mastery-row-score">${formatPercent(entry.accuracy)} · ${entry.correct}/${entry.attempts}</span>
                </div>
                <span class="mastery-row-meta">Average response: ${formatSeconds(entry.avgTime)} · ${pace}</span>
                <div class="mastery-bar"><div class="mastery-bar-fill" style="width:${pct}%"></div></div>
            </div>
        `;
    }).join("");
}

function renderMasteryDiagnosticSection({
    weaknessTitle,
    signalTitle,
    entries,
    hasWeakness,
    weaknessEmptyText,
    cleanText
}){
    const title = hasWeakness ? weaknessTitle : signalTitle;
    const body = hasWeakness
        ? renderMasteryRows(entries, weaknessEmptyText)
        : `<p class="mastery-empty">${escapeHTML(cleanText)}</p>`;

    return `
        <div class="mastery-section">
            <h3>${escapeHTML(title)}</h3>
            ${body}
        </div>
    `;
}

function getRecentBehaviorSignals(){
    const recent = masteryState.recent || [];
    let fastMisses = 0;
    let slowCorrects = 0;
    let recentCorrect = 0;
    let recentTimeTotal = 0;

    recent.forEach(item => {
        const target = getTypeTargetMs(item.type || "default");
        const responseTime = Number(item.responseTime || 0);

        if(item.correct) recentCorrect++;
        if(responseTime) recentTimeTotal += responseTime;

        if(!item.correct && responseTime > 0 && responseTime < target * 0.55){
            fastMisses++;
        }

        if(item.correct && responseTime > target * 1.20){
            slowCorrects++;
        }
    });

    return {
        count: recent.length,
        accuracy: recent.length ? recentCorrect / recent.length : null,
        avgTime: recent.length ? recentTimeTotal / recent.length : 0,
        fastMisses,
        slowCorrects
    };
}

function getInstructionalResourceCatalog(){return window.STABILIZATION_PROTOCOL_INSTRUCTIONAL_RESOURCES||window.INSTRUCTIONAL_RESOURCES||null;}
function normalizeLearningObjective(value){const match=String(value||"").match(/LO\s?(\d+)\.(\d+)/i);return match?"LO"+match[1]+"."+match[2]:"";}
function getRecommendedResources(report){
const catalog=getInstructionalResourceCatalog();if(!catalog)return [];
const byId={};Object.values(catalog.chapters||{}).forEach(chapter=>(chapter.resources||[]).forEach(resource=>{byId[resource.id]=resource;}));
const candidates=(report.weakestObjectives&&report.weakestObjectives.length?report.weakestObjectives:report.strongest||[]);const selected=[];
function add(resource){if(resource&&!selected.some(item=>item.id===resource.id)&&selected.length<3)selected.push(resource);}
candidates.forEach(entry=>{if(selected.length>=3)return;const objective=(catalog.objectives||{})[normalizeLearningObjective(entry.key)];if(!objective)return;(objective.resourceIds||[]).forEach(id=>add(byId[id]));if(selected.length<3&&catalog.settings&&catalog.settings.enableChapterFallback){const chapter=(catalog.chapters||{})[String(objective.chapter)];((chapter&&chapter.fallbackResourceIds)||[]).forEach(id=>add(byId[id]));}});
if(!selected.length){const chapter=Object.values(catalog.chapters||{})[0];((chapter&&chapter.fallbackResourceIds)||[]).forEach(id=>add(byId[id]));}
return selected;
}

if(!recommendations.length)return '<div class="mastery-section"><h3>Recommended Review</h3><p class="mastery-empty">No local review resource is available for this report yet.</p></div>';
return '<div class="mastery-section recommendation-section"><h3>Recommended Review</h3><div class="resource-card-grid">'+recommendations.map(resource=>'<a class="resource-card" href="'+escapeHTML(resource.url)+'" target="'+(resource.external?"_blank":"_self")+'" rel="noopener noreferrer"><span class="resource-type">'+escapeHTML(resource.type.replace(/-/g," "))+'</span><span class="resource-title">'+escapeHTML(resource.title)+'</span><span class="resource-description">'+escapeHTML(resource.description)+'</span><span class="resource-action">'+escapeHTML(resource.actionLabel||"Open Resource")+' →</span></a>').join("")+'</div></div>';
}

function getMasteryReportData(){
    const totalTimeMs = getElapsedTimeMs();
    const accuracy = totalAttempts > 0 ? correctAnswers / totalAttempts : 0;
    const tagEntries = getEntriesFromBuckets(masteryState.byTag || {}, "tag");
    const objectiveEntries = getEntriesFromBuckets(masteryState.byObjective || {}, "objective");
    const skillEntries = getEntriesFromBuckets(masteryState.bySkill || {}, "skill");
    const typeEntries = getTypeMasteryEntries();
    const behavior = getRecentBehaviorSignals();

    const strongest = sortStrongest([...objectiveEntries, ...tagEntries]).slice(0, 4);
    const weakestObjectives = getMeaningfulWeakEntries(objectiveEntries, 0.85).slice(0, 4);
    const weakestTypes = getMeaningfulWeakEntries(typeEntries, 0.85).slice(0, 3);
    const weakestSkills = getMeaningfulWeakEntries(skillEntries, 0.85).slice(0, 3);

    const hasObjectiveWeakness = hasMeaningfulWeakness(objectiveEntries, 0.85);
    const hasTypeWeakness = hasMeaningfulWeakness(typeEntries, 0.85);
    const hasSkillWeakness = hasMeaningfulWeakness(skillEntries, 0.85);
    const hasBehaviorWeakness = behavior.fastMisses >= 2 || behavior.slowCorrects >= 3;
    const noMajorWeakness = totalAttempts >= 8
        && accuracy >= 0.85
        && !hasObjectiveWeakness
        && !hasTypeWeakness
        && !hasSkillWeakness
        && !hasBehaviorWeakness;

    let verdict = "The Custodian found enough signal to build a report. Use it. Ignoring it would be malpractice with extra steps.";

    if(totalAttempts < 5){
        verdict = "The report is limited because this run has very few attempts. The Protocol needs more evidence before it can judge mastery with confidence.";
    } else if(noMajorWeakness){
        verdict = "No major weakness detected. That does not mean the Protocol is done with you. It means the next useful signal comes from harder pressure: Legendary Mode first, Score Attack after that.";
    } else if(accuracy >= 0.90){
        verdict = "Strong command. You cleared the Protocol with high accuracy. The weak signals below show where the next pressure test should focus.";
    } else if(accuracy >= 0.75){
        verdict = "Battle-ready, but not bulletproof. The weak areas below are where points will leak on an exam.";
    } else {
        verdict = "Unstable command. You finished, but the Protocol exposed weak signals. Hit the listed areas before chasing speed or Legendary Mode.";
    }

    const nextSteps = [];

    if(noMajorWeakness){
        nextSteps.push("Enter Legendary Mode next. The current run did not expose a major weak point, so harder multi-step and trap-heavy questions are the right next test.");
        nextSteps.push("Use Score Attack after Legendary Mode feels stable. Speed pressure is useful only after mastery survives harder questions.");
    } else {
        if(hasObjectiveWeakness && weakestObjectives[0]){
            nextSteps.push(`Review ${weakestObjectives[0].label}. That objective showed the weakest mastery signal.`);
        }

        if(hasTypeWeakness && weakestTypes[0]){
            nextSteps.push(`Practice ${weakestTypes[0].label} questions. That question form caused the most trouble.`);
        }

        if(hasSkillWeakness && weakestSkills[0]){
            nextSteps.push(`Drill ${weakestSkills[0].label}. That skill needs cleaner repetition.`);
        }

        if(behavior.fastMisses >= 2){
            nextSteps.push("Slow down on traps and graph-style items. Fast misses are not fluency. They are just wrong answers with confidence.");
        } else if(behavior.slowCorrects >= 3){
            nextSteps.push("You can get answers right, but some correct responses were slow. Build speed only after the reasoning is automatic.");
        }
    }

    if(nextSteps.length === 0){
        nextSteps.push("Run a harder mode next. The current evidence does not show a major weak point. Make the Protocol earn its paycheck.");
    }

    return {
        mode: getMasteryReportModeName(),
        accuracy,
        totalTimeMs,
        timeString: formatTime(totalTimeMs),
        totalAttempts,
        correctAnswers,
        maxStreak,
        score: modeUsesScoreAttack() ? scoreAttackScore : null,
        strongest,
        weakestObjectives,
        weakestTypes,
        weakestSkills,
        hasObjectiveWeakness,
        hasTypeWeakness,
        hasSkillWeakness,
        noMajorWeakness,
        behavior,
        verdict,
        nextSteps,
        recommendations: getRecommendedResources({ weakestObjectives, strongest })
    };
}

        "",
        "Strongest Signals:",
        ...(report.strongest.length ? report.strongest.map(item => `- ${item.label}: ${formatPercent(item.accuracy)} (${item.correct}/${item.attempts})`) : ["- No clear strength signal yet."]),
        "",
        report.hasObjectiveWeakness ? "Weakest Learning Objectives:" : "Objective Signals:",
        ...(report.hasObjectiveWeakness && report.weakestObjectives.length ? report.weakestObjectives.map(item => `- ${item.label}: ${formatPercent(item.accuracy)} (${item.correct}/${item.attempts})`) : ["- No major objective weakness detected. Try Legendary Mode next."]),
        "",
        report.hasTypeWeakness ? "Weakest Question Types:" : "Question Type Signals:",
        ...(report.hasTypeWeakness && report.weakestTypes.length ? report.weakestTypes.map(item => `- ${item.label}: ${formatPercent(item.accuracy)} (${item.correct}/${item.attempts})`) : ["- No major question-form weakness detected."]),
        "",
        report.hasSkillWeakness ? "Weakest Skills:" : "Skill Signals:",
        ...(report.hasSkillWeakness && report.weakestSkills.length ? report.weakestSkills.map(item => `- ${item.label}: ${formatPercent(item.accuracy)} (${item.correct}/${item.attempts})`) : ["- No major skill weakness detected."]),
        "",
        "Next Moves:",
        ...report.nextSteps.map(step => "- " + step),
        "",
        "Recommended Review:",
        ...(report.recommendations.length ? report.recommendations.map(resource => "- " + resource.title + " | " + resource.type + " | " + resource.url) : ["- No local review resource available."])
    ].filter(line => line !== null);

    const text = lines.join("\n");

    function markCopied(){
        const btn = Array.from(document.querySelectorAll("button"))
            .find(button => button.innerText === "Copy Report" || button.innerText === "Copied!");

        if(!btn) return;
        const original = btn.innerText;
        btn.innerText = "Copied!";
        setTimeout(() => { btn.innerText = original; }, 1800);
    }

    if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(text).then(markCopied);
        return;
    }

    const temp = document.createElement("textarea");
    temp.value = text;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    temp.remove();
    markCopied();
}

</script>
</body>
</html>
