{"id":144,"q":"Refer to the money-market graph. Which point shows MS2 and MD2 in equilibrium?","options":["a","b","d","g"],"a":2,"tag":"liquidity_preference","type":"graph_interpretation","objective":"LO35.1","difficulty":"medium","conceptCluster":"policy_graphs","primarySkill":"read_money_market_equilibrium","repairSkill":"read_money_market_equilibrium","commonError":"Reading a non-intersection point as equilibrium.","feedback":"MS2 and MD2 intersect at point d.","image":"moneyd2_moneys2.webp"},
{"id":145,"q":"If real income rises, money demand increases. In the liquidity preference model, this tends to:","options":["Raise the interest rate","Lower the interest rate","Reduce money supply automatically","Shift AD left directly"],"a":0,"tag":"liquidity_preference","type":"interpretation","objective":"LO35.1","difficulty":"medium","conceptCluster":"policy_transmission","primarySkill":"money_demand_interest_rate","repairSkill":"money_demand_interest_rate","commonError":"Thinking more money demand lowers interest rates.","feedback":"Higher money demand pushes the interest rate up when money supply is fixed."},
{"id":146,"q":"If the government raises spending by $50 billion and the multiplier is 3, the first-pass AD increase before crowding out is:","options":["$50 billion","$100 billion","$150 billion","$200 billion"],"a":2,"tag":"multiplier_effect","type":"calculation","objective":"LO35.4","difficulty":"medium","conceptCluster":"policy_transmission","primarySkill":"calculate_spending_multiplier","repairSkill":"calculate_spending_multiplier","commonError":"Using the spending change instead of multiplying it.","feedback":"The initial multiplier effect is $50 billion x 3 = $150 billion."},
{"id":147,"q":"If fiscal expansion raises interest rates and reduces investment, the final AD shift is likely:","options":["Larger because crowding out amplifies it","Smaller because crowding out offsets it","Zero because fiscal policy cannot affect AD","Negative because taxes always rise"],"a":1,"tag":"crowding_out","type":"interpretation","objective":"LO35.4","difficulty":"medium","conceptCluster":"policy_transmission","primarySkill":"crowding_out_effect","repairSkill":"crowding_out_effect","commonError":"Thinking the multiplier is never offset.","feedback":"Crowding out weakens the final effect of fiscal expansion on AD."},
{"id":148,"q":"Which policy pair is expansionary for aggregate demand?","options":["Higher taxes and lower money supply","Lower taxes and higher money supply","Lower spending and higher taxes","Higher reserve requirements and lower spending"],"a":1,"tag":"stabilization_policy","type":"interpretation","objective":"LO35.5","difficulty":"medium","conceptCluster":"policy_transmission","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Mixing expansionary and contractionary tools.","feedback":"Lower taxes and higher money supply both tend to shift AD right."},
{"id":149,"q":"A recession begins, but Congress passes stimulus after the economy has already recovered. This illustrates:","options":["Policy lag risk","Monetary neutrality","A reserve multiplier","Commodity money"],"a":0,"tag":"policy_lags","type":"interpretation","objective":"LO35.5","difficulty":"medium","conceptCluster":"policy_transmission","primarySkill":"policy_lags","repairSkill":"policy_lags","commonError":"Ignoring timing problems.","feedback":"Policy lags can make stabilization arrive after conditions have changed."},
{"id":150,"q":"If the economy is in a liquidity trap, a traditional money-supply increase may fail because:","options":["Interest rates cannot fall much further","LRAS slopes downward","Taxes must rise automatically","M1 no longer includes currency"],"a":0,"tag":"liquidity_trap","type":"interpretation","objective":"LO35.5","difficulty":"medium","conceptCluster":"policy_transmission","primarySkill":"liquidity_trap","repairSkill":"liquidity_trap","commonError":"Thinking monetary policy works the same at zero rates.","feedback":"When rates are near zero, traditional monetary policy may not lower rates enough to boost spending."},
{"id":151,"q":"Refer to the AD graph with constant price level P. Moving from AD1 to AD2 changes output from:","options":["Y1 to Y2","Y2 to Y1","Y2 to Y3","Y3 to Y1"],"a":0,"tag":"aggregate_demand","type":"graph_interpretation","objective":"LO35.3","difficulty":"medium","conceptCluster":"policy_graphs","primarySkill":"read_ad_shift","repairSkill":"read_ad_shift","commonError":"Reading the graph backward.","feedback":"At the same price level, output rises from Y1 to Y2 when AD shifts from AD1 to AD2.","image":"moneymultiplier.webp"},
{"id":152,"q":"Refer to the AD graph with constant price level P. Which curve shows the largest aggregate demand level?","options":["AD1","AD2","AD3","P"],"a":2,"tag":"aggregate_demand","type":"graph_interpretation","objective":"LO35.3","difficulty":"medium","conceptCluster":"policy_graphs","primarySkill":"read_ad_shift","repairSkill":"read_ad_shift","commonError":"Confusing curve position with label order.","feedback":"AD3 is farthest to the right, so it shows the largest AD at price level P.","image":"moneymultiplier.webp"},
{"id":153,"q":"The short-run Phillips curve slopes downward because higher AD tends to:","options":["Raise output, lower unemployment, and raise inflation","Lower output, lower unemployment, and lower inflation","Raise unemployment while lowering inflation forever","Shift LRPC left immediately"],"a":0,"tag":"phillips_curve","type":"interpretation","objective":"LO36.1","difficulty":"medium","conceptCluster":"phillips_curve","primarySkill":"define_phillips_curve","repairSkill":"define_phillips_curve","commonError":"Missing the AD-to-unemployment channel.","feedback":"Higher AD raises output and prices, which maps to lower unemployment and higher inflation."},
{"id":154,"q":"Why is there no permanent Phillips-curve tradeoff?","options":["Expectations adjust; unemployment returns to normal","Money demand becomes zero","AD stops affecting the short run","Inflation cannot change wages"],"a":0,"tag":"natural_rate_hypothesis","type":"interpretation","objective":"LO36.1","difficulty":"medium","conceptCluster":"phillips_curve","primarySkill":"natural_rate_hypothesis","repairSkill":"natural_rate_hypothesis","commonError":"Treating the short-run tradeoff as permanent.","feedback":"Once expectations adjust, unemployment returns to the natural rate."},
{"id":155,"q":"Refer to the LRPC graph. Starting at point c, expansionary policy that raises inflation above expectations moves the economy to:","options":["a","b","c","d"],"a":0,"tag":"policy_phillips","type":"graph_interpretation","objective":"LO36.1","difficulty":"medium","conceptCluster":"pc_graphs","primarySkill":"move_along_srpc","repairSkill":"move_along_srpc","commonError":"Moving to the long-run point immediately.","feedback":"Expansionary policy moves the economy along SRPC1 from c to a: higher inflation and lower unemployment.","image":"lrpc.webp"},

{"id":157,"q":"Refer to the LRPC graph. Starting at point b, contractionary policy that lowers inflation below expectations moves the economy in the short run to:","options":["a","c","d","U1"],"a":2,"tag":"policy_phillips","type":"graph_interpretation","objective":"LO36.4","difficulty":"medium","conceptCluster":"pc_graphs","primarySkill":"monetary_policy_pc_transition","repairSkill":"monetary_policy_pc_transition","commonError":"Moving directly to lower expected inflation.","feedback":"Contractionary policy moves along SRPC2 from b to d: lower inflation and higher unemployment.","image":"lrpc.webp"},
{"id":158,"q":"Refer to the LRPC graph. Moving from d to c most likely reflects:","options":["Expected inflation falling","Expected inflation rising","Natural unemployment rising","AD shifting right"],"a":0,"tag":"expectations","type":"graph_interpretation","objective":"LO36.3","difficulty":"medium","conceptCluster":"pc_graphs","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Missing downward expectations adjustment.","feedback":"As expected inflation falls, the SRPC shifts downward and unemployment returns to U2 at point c.","image":"lrpc.webp"},
{"id":159,"q":"Refer to the LRPC graph. Which pair of points are long-run equilibria?","options":["a and d","b and c","a and b","c and d"],"a":1,"tag":"lrpc","type":"graph_interpretation","objective":"LO36.2","difficulty":"medium","conceptCluster":"pc_graphs","primarySkill":"identify_lrpc","repairSkill":"identify_lrpc","commonError":"Treating all SRPC points as long-run equilibria.","feedback":"Points b and c lie on the vertical LRPC at U2." ,"image":"lrpc.webp"},
{"id":160,"q":"Refer to the SRPC graph. A move along SRPC1 from c toward b means:","options":["Inflation rises and unemployment falls","Inflation falls and unemployment rises","Both inflation and unemployment rise","Both inflation and unemployment fall"],"a":0,"tag":"policy_phillips","type":"graph_interpretation","objective":"LO36.1","difficulty":"medium","conceptCluster":"pc_graphs","primarySkill":"move_along_srpc","repairSkill":"move_along_srpc","commonError":"Reading movement along the curve backward.","feedback":"Moving up-left along SRPC1 raises inflation and lowers unemployment.","image":"srpc.webp"},
{"id":161,"q":"Refer to the SRPC graph. Moving from SRPC1 to SRPC2 at the same unemployment rate means:","options":["Inflation is higher at the same unemployment rate","Inflation is lower at the same unemployment rate","Unemployment disappears","LRPC shifts right"],"a":0,"tag":"expectations","type":"graph_interpretation","objective":"LO36.3","difficulty":"medium","conceptCluster":"pc_graphs","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Missing the upward SRPC shift.","feedback":"SRPC2 is above SRPC1, so inflation is higher for a given unemployment rate.","image":"srpc.webp"},
{"id":162,"q":"Refer to the SRPC graph. If the economy moves from c on SRPC1 to the upper point at the same unemployment rate, the likely cause is:","options":["Higher expected inflation","Lower expected inflation","A fall in actual inflation only","A lower natural rate"],"a":0,"tag":"expectations","type":"graph_interpretation","objective":"LO36.3","difficulty":"medium","conceptCluster":"pc_graphs","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Confusing a curve shift with movement along one curve.","feedback":"At the same unemployment rate, a higher SRPC reflects higher expected inflation or a worse tradeoff.","image":"srpc.webp"},
{"id":163,"q":"An adverse supply shock affects the Phillips curve by:","options":["Shifting SRPC up and right","Moving down along the same SRPC","Shifting LRPC to zero unemployment","Eliminating expected inflation"],"a":0,"tag":"supply_shock_pc","type":"interpretation","objective":"LO36.3","difficulty":"medium","conceptCluster":"phillips_curve","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Treating supply shocks as normal AD movements.","feedback":"An adverse supply shock worsens the inflation-unemployment tradeoff."},
{"id":164,"q":"If policymakers expand AD to reduce unemployment below the natural rate, what happens after expectations adjust?","options":["Unemployment returns to natural and inflation stays higher","Unemployment stays permanently lower","Inflation falls below expected inflation","LRPC becomes downward sloping"],"a":0,"tag":"expectations","type":"multi-step","objective":"LO36.3","difficulty":"medium","conceptCluster":"phillips_curve","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Believing in a permanent policy tradeoff.","feedback":"Higher expected inflation shifts the SRPC up, returning unemployment to natural at higher inflation."},
{"id":165,"q":"If the Fed reduces money growth to lower inflation, the short-run Phillips curve predicts:","options":["Lower inflation and temporarily higher unemployment","Higher inflation and lower unemployment","Lower inflation and lower unemployment immediately","No short-run cost at all"],"a":0,"tag":"disinflation","type":"interpretation","objective":"LO36.4","difficulty":"medium","conceptCluster":"phillips_curve","primarySkill":"disinflation_unemployment_cost","repairSkill":"disinflation_unemployment_cost","commonError":"Ignoring the short-run unemployment cost.","feedback":"Disinflation usually moves the economy toward lower inflation and higher unemployment in the short run."},
{"id":166,"q":"If expected inflation falls quickly after a credible policy announcement, the sacrifice ratio is likely to be:","options":["Lower","Higher","Unchanged by expectations","Equal to M1"],"a":0,"tag":"sacrifice_ratio","type":"interpretation","objective":"LO36.5","difficulty":"medium","conceptCluster":"phillips_curve","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Ignoring credibility and expectations.","feedback":"Faster adjustment of expected inflation reduces the output cost of disinflation."},
{"id":167,"q":"If the sacrifice ratio is 3 and inflation falls from 8 percent to 5 percent, the output cost is:","options":["3 percent of one year's output","6 percent of one year's output","9 percent of one year's output","15 percent of one year's output"],"a":2,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"medium","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Adding instead of multiplying.","feedback":"Inflation falls by 3 percentage points, so output loss is 3 x 3 = 9 percent of one year's output."},
{"id":168,"q":"Which statement best maps AD-AS to the Phillips curve?","options":["Higher output in AD-AS usually maps to lower unemployment on the SRPC","Higher output in AD-AS always maps to higher unemployment","Lower price level always maps to higher inflation","LRAS movements are the same as SRPC movements"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.2","difficulty":"medium","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Failing to connect output and unemployment.","feedback":"When output rises above potential, unemployment tends to fall below natural, which maps onto the SRPC."},
{"id":169,"q":"An adverse supply shock in AD-AS and the Phillips curve should be described as:","options":["SRAS shifts left and SRPC shifts up-right","AD shifts right and SRPC shifts down-left","LRAS shifts right and LRPC shifts left","Money supply rises and inflation falls"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.3","difficulty":"medium","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Missing the shared supply-shock logic across models.","feedback":"A negative supply shock raises costs, shifting SRAS left and worsening the Phillips curve tradeoff."}

hard: [
{"id":200,"q":"A student says M2 is smaller than M1 because M2 excludes currency. What is the best correction?","options":["M2 includes M1 plus near monies","M2 includes only bank reserves","M1 includes savings deposits only","M1 equals credit card balances"],"a":0,"tag":"m1_m2","type":"trap","objective":"LO30.1","difficulty":"hard","conceptCluster":"money_banking","primarySkill":"distinguish_m1_m2","repairSkill":"distinguish_m1_m2","commonError":"Reversing the relationship between M1 and M2.","feedback":"M2 is broader than M1 because it includes M1 plus near monies such as savings deposits."},
{"id":201,"q":"A bank receives $5,000 in new deposits, holds 15 percent required reserves, and lends the rest. What is the maximum first-round loan?","options":["$750","$4,250","$5,000","$33,333"],"a":1,"tag":"fractional_reserve","type":"calculation","objective":"LO30.3","difficulty":"hard","conceptCluster":"money_banking","primarySkill":"calculate_excess_reserves","repairSkill":"calculate_excess_reserves","commonError":"Lending required reserves or using the multiplier too early.","feedback":"Required reserves are $750, so the bank can lend $4,250 in the first round."},
{"id":202,"q":"If the reserve requirement is 12.5 percent, the simple money multiplier is:","options":["4","6","8","12.5"],"a":2,"tag":"money_multiplier","type":"calculation","objective":"LO30.3","difficulty":"hard","conceptCluster":"money_banking","primarySkill":"calculate_money_multiplier_effect","repairSkill":"calculate_money_multiplier_effect","commonError":"Using the reserve requirement instead of its reciprocal.","feedback":"The multiplier is 1/0.125 = 8."},
{"id":203,"q":"The Fed buys bonds, but banks hold the new reserves instead of lending them. What happens to the money multiplier process?","options":["It weakens despite higher reserves","It strengthens despite no lending","It becomes unrelated to banks","It eliminates currency from M1"],"a":0,"tag":"limits_monetary_control","type":"multi-step","objective":"LO30.5","difficulty":"hard","conceptCluster":"money_banking","primarySkill":"limits_of_monetary_control","repairSkill":"limits_of_monetary_control","commonError":"Assuming Fed purchases always create full deposit expansion.","feedback":"Fed purchases raise reserves, but deposit expansion is weaker if banks do not lend those reserves."},
{"id":204,"q":"A bank has $2 million in assets and $120,000 in capital. If asset values fall by 4 percent, capital falls to:","options":["$40,000","$80,000","$120,000","$200,000"],"a":0,"tag":"bank_capital","type":"calculation","objective":"LO30.5","difficulty":"hard","conceptCluster":"money_banking","primarySkill":"bank_leverage_risk","repairSkill":"bank_leverage_risk","commonError":"Applying the loss percentage to capital instead of assets.","feedback":"A 4 percent asset loss is $80,000, so capital falls from $120,000 to $40,000."},
{"id":205,"q":"Which sequence best describes a contractionary open-market operation?","options":["Sell bonds, reserves fall, lending weakens","Buy bonds, reserves fall, lending weakens","Sell bonds, reserves rise, lending expands","Buy bonds, reserves rise, lending contracts"],"a":0,"tag":"open_market_operations","type":"multi-step","objective":"LO30.4","difficulty":"hard","conceptCluster":"money_banking","primarySkill":"choose_fed_tool_effect","repairSkill":"choose_fed_tool_effect","commonError":"Reversing bond sales and purchases.","feedback":"Selling bonds drains reserves, weakens lending, and reduces money creation."},
{"id":206,"q":"If M grows 8 percent, V grows 1 percent, and Y grows 3 percent, predicted inflation is approximately:","options":["4 percent","6 percent","9 percent","12 percent"],"a":1,"tag":"quantity_theory","type":"calculation","objective":"LO31.1","difficulty":"hard","conceptCluster":"inflation_money_growth","primarySkill":"quantity_equation","repairSkill":"quantity_equation","commonError":"Ignoring output growth or velocity growth.","feedback":"Inflation is approximately money growth plus velocity growth minus output growth: 8 + 1 - 3 = 6 percent."},
{"id":207,"q":"If nominal wages double, prices double, and real output is unchanged, the result best illustrates:","options":["Monetary neutrality","Crowding out","Sticky prices","Fiscal stimulus"],"a":0,"tag":"monetary_neutrality","type":"interpretation","objective":"LO31.2","difficulty":"hard","conceptCluster":"inflation_money_growth","primarySkill":"monetary_neutrality","repairSkill":"monetary_neutrality","commonError":"Treating nominal changes as real changes.","feedback":"If nominal variables double while real variables stay unchanged, that is monetary neutrality."},
{"id":208,"q":"A borrower signs a loan expecting 2 percent inflation, but actual inflation is 7 percent. Who is helped?","options":["The borrower","The lender","Both equally","Neither side"],"a":0,"tag":"inflation_redistribution","type":"interpretation","objective":"LO31.4","difficulty":"hard","conceptCluster":"inflation_money_growth","primarySkill":"inflation_redistribution","repairSkill":"inflation_redistribution","commonError":"Reversing unexpected inflation redistribution.","feedback":"Unexpected inflation helps borrowers because they repay in dollars worth less than expected."},
{"id":209,"q":"If the real interest rate is 3 percent and expected inflation rises from 4 percent to 9 percent, the Fisher effect predicts the nominal rate rises by:","options":["3 points","4 points","5 points","9 points"],"a":2,"tag":"fisher_effect","type":"calculation","objective":"LO31.3","difficulty":"hard","conceptCluster":"inflation_money_growth","primarySkill":"fisher_effect","repairSkill":"fisher_effect","commonError":"Using the final inflation rate instead of the change.","feedback":"Expected inflation rises by 5 percentage points, so the nominal rate rises by 5 points."},
{"id":210,"q":"A country prints money to cover deficits, prices rise rapidly, and people rush to spend cash before it loses value. Which idea is most central?","options":["Inflation tax and falling money value","Crowding out and rising investment","LRAS growth and lower inflation","Commodity money and stable prices"],"a":0,"tag":"inflation_tax","type":"multi-step","objective":"LO31.5","difficulty":"hard","conceptCluster":"inflation_money_growth","primarySkill":"inflation_tax","repairSkill":"inflation_tax","commonError":"Treating money printing as costless financing.","feedback":"Printing money can finance spending through an inflation tax, reducing the value of money."},
{"id":211,"q":"Refer to the graph. If the economy moves from AD1-AS1 to AD1-AS2, what happens?","options":["Output rises and prices fall","Output falls and prices rise","Output rises and prices rise","Output falls and prices fall"],"a":0,"tag":"sras_shifts","type":"graph_interpretation","objective":"LO34.4","difficulty":"hard","conceptCluster":"ad_as_graphs","primarySkill":"trace_supply_shock","repairSkill":"trace_supply_shock","commonError":"Reading a positive SRAS shift backward.","feedback":"Moving from AS1 to AS2 along AD1 raises output from Y3 to Y1 and lowers the price level from P2 to P1.","image":"adas1.webp"},
{"id":212,"q":"Refer to the graph. If the economy starts at AD1-AS2 and both AD and SRAS increase, where does it end?","options":["Y2 and P2","Y1 and P3","Y3 and P2","Y1 and P1"],"a":0,"tag":"ad_as_graph_interpretation","type":"graph_interpretation","objective":"LO34.4","difficulty":"hard","conceptCluster":"ad_as_graphs","primarySkill":"trace_combined_shocks","repairSkill":"trace_combined_shocks","commonError":"Tracking only one curve shift.","feedback":"AD2 and AS2 intersect at Y2 and P2." ,"image":"adas1.webp"},
{"id":213,"q":"Refer to the graph. Starting at AD1-AS1, which change gets the economy to Y2 and P2?","options":["AD rises and SRAS rises","AD falls and SRAS rises","AD rises and SRAS falls","AD falls and SRAS falls"],"a":0,"tag":"ad_as_graph_interpretation","type":"graph_interpretation","objective":"LO34.4","difficulty":"hard","conceptCluster":"ad_as_graphs","primarySkill":"trace_combined_shocks","repairSkill":"trace_combined_shocks","commonError":"Forgetting both curves must change.","feedback":"Starting from AD1-AS1 at Y3-P2, moving to AD2-AS2 requires AD to rise and SRAS to rise." ,"image":"adas1.webp"},
{"id":214,"q":"Refer to the graph with LRAS. If the economy starts at AD1-AS2 and AD shifts to AD2, what gap appears?","options":["Expansionary gap","Recessionary gap","No output gap","Supply gap"],"a":0,"tag":"output_gaps","type":"graph_interpretation","objective":"LO34.5","difficulty":"hard","conceptCluster":"ad_as_graphs","primarySkill":"classify_output_gap","repairSkill":"classify_output_gap","commonError":"Ignoring LRAS after an AD shift.","feedback":"The economy moves to Y2, which is above natural output, so it creates an expansionary gap.","image":"adaslras.webp"},
{"id":215,"q":"Refer to the graph with LRAS. Starting at AD1-AS2, an adverse supply shock moves the economy to:","options":["Y3 and P2","Y2 and P2","Y1 and P3","Y1 and P1"],"a":0,"tag":"supply_shocks","type":"graph_interpretation","objective":"LO34.4","difficulty":"hard","conceptCluster":"ad_as_graphs","primarySkill":"trace_supply_shock","repairSkill":"trace_supply_shock","commonError":"Treating a supply shock as an AD shift.","feedback":"An adverse supply shock shifts SRAS from AS2 to AS1, moving the economy to Y3 and P2.","image":"adaslras.webp"},
{"id":216,"q":"Refer to the graph with LRAS. Starting at AD2-AS2, long-run self-correction most likely shifts:","options":["SRAS left toward AS1","SRAS right toward AS2","AD left toward AD1","LRAS right toward Y2"],"a":0,"tag":"long_run_adjustment","type":"graph_interpretation","objective":"LO34.5","difficulty":"hard","conceptCluster":"ad_as_graphs","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Missing expected price adjustment after an expansionary gap.","feedback":"At Y2 output is above potential, so rising wages and expected prices shift SRAS left." ,"image":"adaslras.webp"},
{"id":217,"q":"Refer to the graph with LRAS. Starting at AD1-AS1, long-run self-correction most likely shifts:","options":["SRAS right toward AS2","SRAS left toward AS1","AD right toward AD2","LRAS left toward Y3"],"a":0,"tag":"long_run_adjustment","type":"graph_interpretation","objective":"LO34.5","difficulty":"hard","conceptCluster":"ad_as_graphs","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Missing expected price adjustment after a recessionary gap.","feedback":"At Y3 output is below potential, so wages and expected prices tend to fall, shifting SRAS right." ,"image":"adaslras.webp"},
{"id":218,"q":"A tax hike reduces consumption and output falls below natural output. Which graph movement fits best?","image":"adaslras.webp","options":["AD shifts left, creating a recessionary gap","AD shifts right, creating an expansionary gap","SRAS shifts left, raising output","LRAS shifts right, lowering prices"],"a":0,"tag":"demand_shocks","type":"multi-step","objective":"LO34.4","difficulty":"hard","conceptCluster":"ad_as","primarySkill":"trace_demand_shock","repairSkill":"trace_demand_shock","commonError":"Confusing fiscal demand effects with supply shocks.","feedback":"A tax hike reduces aggregate demand and can create a recessionary gap."},
{"id":219,"q":"A productivity improvement lowers production costs and raises potential output over time. Which curves are most likely affected?","options":["SRAS right and LRAS right","AD left and SRAS left","SRPC up and AD left","MD right and MS left"],"a":0,"tag":"lras","type":"multi-step","objective":"LO34.2","difficulty":"hard","conceptCluster":"ad_as","primarySkill":"identify_lras","repairSkill":"identify_lras","commonError":"Treating productivity only as demand.","feedback":"Higher productivity can shift SRAS right and increase long-run aggregate supply."},
{"id":220,"q":"An economy faces higher oil prices and falling output. Why is aggressive AD stimulus risky?","options":["It may restore output but add inflation pressure","It must lower prices and raise unemployment","It shifts SRAS right without cost","It removes the natural rate"],"a":0,"tag":"supply_shocks","type":"trap","objective":"LO34.4","difficulty":"hard","conceptCluster":"ad_as","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Thinking supply-shock policy has no tradeoff.","feedback":"Stimulating AD can support output but may worsen inflation after an adverse supply shock."},
{"id":221,"q":"A negative AD shock lowers output and prices. What long-run adjustment restores output if no policy responds?","options":["Wages and expected prices fall","Wages and expected prices rise","Money demand rises permanently","LRPC shifts right"],"a":0,"tag":"long_run_adjustment","type":"multi-step","objective":"LO34.5","difficulty":"hard","conceptCluster":"ad_as","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Thinking recessionary gaps cannot self-correct.","feedback":"Lower wages and expected prices shift SRAS right and help output return to natural."},
{"id":222,"q":"A positive AD shock pushes output above potential. What long-run adjustment restores output if no policy responds?","options":["Wages and expected prices rise","Wages and expected prices fall","SRAS shifts right immediately","LRAS shifts to AD2"],"a":0,"tag":"long_run_adjustment","type":"multi-step","objective":"LO34.5","difficulty":"hard","conceptCluster":"ad_as","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Thinking booms above potential persist forever.","feedback":"Higher wages and expected prices shift SRAS left and return output to potential."},
{"id":223,"q":"Which shock produces higher prices and lower output without first changing AD?","options":["Adverse supply shock","Positive demand shock","Expansionary fiscal policy","Open-market purchase"],"a":0,"tag":"supply_shocks","type":"trap","objective":"LO34.4","difficulty":"hard","conceptCluster":"ad_as","primarySkill":"classify_supply_shock","repairSkill":"classify_supply_shock","commonError":"Treating stagflation as a demand shock.","feedback":"An adverse supply shock shifts SRAS left, raising prices and lowering output."},
{"id":224,"q":"Refer to the money-market graph. If money demand shifts from MD1 to MD2 while money supply stays MS2, equilibrium moves from:","options":["g to d","d to g","e to a","f to b"],"a":0,"tag":"liquidity_preference","type":"graph_interpretation","objective":"LO35.1","difficulty":"hard","conceptCluster":"policy_graphs","primarySkill":"money_demand_interest_rate","repairSkill":"money_demand_interest_rate","commonError":"Using MS1 instead of MS2.","feedback":"At MS2, MD1 intersects at g and MD2 intersects at d, so the interest rate rises from r1 to r3.","image":"moneyd2_moneys2.webp"},
{"id":225,"q":"Refer to the money-market graph. Which movement shows contractionary monetary policy with MD1 unchanged?","options":["g to e","e to g","a to d","d to a"],"a":0,"tag":"monetary_policy","type":"graph_interpretation","objective":"LO35.2","difficulty":"hard","conceptCluster":"policy_graphs","primarySkill":"read_money_market_shift","repairSkill":"read_money_market_shift","commonError":"Reversing a leftward money supply shift.","feedback":"Contractionary policy shifts MS left from MS2 to MS1, moving from g to e on MD1." ,"image":"moneyd2_moneys2.webp"},
{"id":226,"q":"Refer to the money-market graph. Which point is not an equilibrium but shows excess money supply at r4 with MS2 and MD2?","options":["b","d","g","a"],"a":0,"tag":"liquidity_preference","type":"graph_interpretation","objective":"LO35.1","difficulty":"hard","conceptCluster":"policy_graphs","primarySkill":"read_money_market_equilibrium","repairSkill":"read_money_market_equilibrium","commonError":"Treating any point on MS as equilibrium.","feedback":"With MS2 and MD2, equilibrium is d. Point b is above equilibrium at the same money supply." ,"image":"moneyd2_moneys2.webp"},

{"id":228,"q":"Refer to the AD multiplier graph. If government spending first shifts AD from AD1 to AD2, the multiplier effect is best shown by:","options":["AD2 to AD3","AD2 to AD1","AD3 to AD1","Y3 to Y1"],"a":0,"tag":"multiplier_effect","type":"graph_interpretation","objective":"LO35.4","difficulty":"hard","conceptCluster":"policy_graphs","primarySkill":"read_multiplier_graph","repairSkill":"read_multiplier_graph","commonError":"Confusing the initial shift with the multiplied shift.","feedback":"The multiplier effect expands the initial AD shift farther right, from AD2 to AD3.","image":"moneymultiplier.webp"},
{"id":229,"q":"Refer to the AD multiplier graph. If crowding out occurs after AD reaches AD3, the final AD position may move back toward:","options":["AD2","AD4","SRAS","LRPC"],"a":0,"tag":"crowding_out","type":"graph_interpretation","objective":"LO35.4","difficulty":"hard","conceptCluster":"policy_graphs","primarySkill":"crowding_out_effect","repairSkill":"crowding_out_effect","commonError":"Thinking crowding out amplifies AD.","feedback":"Crowding out offsets part of fiscal expansion, pulling the final effect back from AD3 toward AD2.","image":"moneymultiplier.webp"},
{"id":230,"q":"If government spending rises by $80 billion, MPC is 0.75, and crowding out offsets $100 billion, final AD rises by:","options":["$220 billion","$300 billion","$320 billion","$420 billion"],"a":0,"tag":"crowding_out","type":"calculation","objective":"LO35.4","difficulty":"hard","conceptCluster":"policy_transmission","primarySkill":"calculate_spending_multiplier","repairSkill":"calculate_spending_multiplier","commonError":"Ignoring crowding out after applying the multiplier.","feedback":"Multiplier is 4, so $80 billion x 4 = $320 billion; minus $100 billion gives $220 billion."},
{"id":231,"q":"If MPC rises from 0.5 to 0.8, the government purchases multiplier changes from:","options":["2 to 5","5 to 2","0.5 to 0.8","1.5 to 1.8"],"a":0,"tag":"multiplier_effect","type":"calculation","objective":"LO35.4","difficulty":"hard","conceptCluster":"policy_transmission","primarySkill":"calculate_spending_multiplier","repairSkill":"calculate_spending_multiplier","commonError":"Using MPC itself as the multiplier.","feedback":"The multiplier is 1/(1-MPC), so it rises from 2 to 5."},
{"id":232,"q":"A central bank wants to close a recessionary AD gap without fiscal policy. Which chain is most accurate?","options":["Buy bonds, lower rates, raise investment, shift AD right","Sell bonds, lower rates, raise investment, shift AD right","Buy bonds, raise rates, reduce investment, shift AD left","Sell bonds, raise rates, raise investment, shift AD left"],"a":0,"tag":"monetary_policy","type":"multi-step","objective":"LO35.2","difficulty":"hard","conceptCluster":"policy_transmission","primarySkill":"monetary_policy_transmission","repairSkill":"monetary_policy_transmission","commonError":"Reversing the monetary transmission chain.","feedback":"Expansionary monetary policy buys bonds, increases money supply, lowers rates, raises investment, and shifts AD right."},
{"id":233,"q":"Congress cuts spending to reduce deficits during a recession. What policy concern is most direct?","options":["AD may fall further before recovery","SRAS must shift right instantly","Inflation must rise immediately","LRPC must become horizontal"],"a":0,"tag":"stabilization_policy","type":"trap","objective":"LO35.5","difficulty":"hard","conceptCluster":"policy_transmission","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Ignoring demand effects of spending cuts.","feedback":"Cutting spending during a recession can reduce AD further and deepen the downturn."},
{"id":234,"q":"If interest rates are near zero and output is below potential, why may monetary policy struggle?","options":["Rates have little room to fall","Money demand becomes vertical forever","LRAS shifts left automatically","Taxes cannot change AD"],"a":0,"tag":"liquidity_trap","type":"interpretation","objective":"LO35.5","difficulty":"hard","conceptCluster":"policy_transmission","primarySkill":"liquidity_trap","repairSkill":"liquidity_trap","commonError":"Treating monetary policy as equally strong at all rates.","feedback":"At near-zero nominal rates, standard rate-cut channels have little room to stimulate spending."},
{"id":235,"q":"A policy takes six months to pass and another year to affect spending. The main risk is:","options":["The shock may reverse before policy hits","The money multiplier must equal zero","LRAS becomes horizontal","M2 stops including near money"],"a":0,"tag":"policy_lags","type":"interpretation","objective":"LO35.5","difficulty":"hard","conceptCluster":"policy_transmission","primarySkill":"policy_lags","repairSkill":"policy_lags","commonError":"Ignoring timing in stabilization policy.","feedback":"Inside and outside lags can make policy arrive after conditions have changed."},
{"id":236,"q":"Refer to the LRPC graph. Starting at c, which sequence matches expansionary policy and expectations adjustment?","options":["c to a to b","c to b to a","c to d to b","c to a to d"],"a":0,"tag":"expectations","type":"graph_interpretation","objective":"LO36.3","difficulty":"hard","conceptCluster":"pc_graphs","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Skipping the short-run movement along SRPC.","feedback":"Expansion moves from c to a in the short run; expected inflation rises and moves the economy to b." ,"image":"lrpc.webp"},
{"id":237,"q":"Refer to the LRPC graph. Starting at b, which sequence matches disinflation and expectations adjustment?","options":["b to d to c","b to c to d","b to a to c","b to d to a"],"a":0,"tag":"disinflation","type":"graph_interpretation","objective":"LO36.4","difficulty":"hard","conceptCluster":"pc_graphs","primarySkill":"monetary_policy_pc_transition","repairSkill":"monetary_policy_pc_transition","commonError":"Skipping the temporary unemployment cost.","feedback":"Disinflation moves from b to d in the short run; expected inflation falls and the economy moves to c." ,"image":"lrpc.webp"},
{"id":238,"q":"Refer to the LRPC graph. Which point reflects unemployment below the natural rate with inflation above I1?","options":["a","b","c","d"],"a":0,"tag":"phillips_curve","type":"graph_interpretation","objective":"LO36.1","difficulty":"hard","conceptCluster":"pc_graphs","primarySkill":"read_pc_points","repairSkill":"read_pc_points","commonError":"Ignoring the LRPC natural rate.","feedback":"Point a is at U1 and I2, so unemployment is below the natural rate U2 and inflation is above I1.","image":"lrpc.webp"},
{"id":239,"q":"Refer to the LRPC graph. Which point reflects high inflation with unemployment at the natural rate?","options":["a","b","c","d"],"a":1,"tag":"lrpc","type":"graph_interpretation","objective":"LO36.2","difficulty":"hard","conceptCluster":"pc_graphs","primarySkill":"identify_lrpc","repairSkill":"identify_lrpc","commonError":"Confusing short-run and long-run points.","feedback":"Point b lies on the LRPC at U2 and inflation I2." ,"image":"lrpc.webp"},
{"id":240,"q":"Refer to the LRPC graph. Which movement shows expectations falling after contractionary policy?","options":["d to c","c to a","a to b","b to a"],"a":0,"tag":"expectations","type":"graph_interpretation","objective":"LO36.3","difficulty":"hard","conceptCluster":"pc_graphs","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Reversing expectation shifts.","feedback":"Moving from d to c reflects lower expected inflation and return to the natural unemployment rate." ,"image":"lrpc.webp"},
{"id":241,"q":"Refer to the SRPC graph. Moving from b to c along SRPC1 means:","options":["Inflation falls and unemployment rises","Inflation rises and unemployment falls","Both inflation and unemployment rise","Both inflation and unemployment fall"],"a":0,"tag":"policy_phillips","type":"graph_interpretation","objective":"LO36.1","difficulty":"hard","conceptCluster":"pc_graphs","primarySkill":"move_along_srpc","repairSkill":"move_along_srpc","commonError":"Reading movement along SRPC backward.","feedback":"Moving down-right along SRPC1 lowers inflation and raises unemployment.","image":"srpc.webp"},
{"id":242,"q":"Refer to the SRPC graph. At U3, moving from SRPC1 to SRPC2 changes inflation from:","options":["I2 to I4","I4 to I2","I1 to I3","I3 to I1"],"a":0,"tag":"expectations","type":"graph_interpretation","objective":"LO36.3","difficulty":"hard","conceptCluster":"pc_graphs","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Reading the wrong inflation level at U3.","feedback":"At U3, the lower curve is at I2 and the upper curve is at I4." ,"image":"srpc.webp"},
{"id":243,"q":"Refer to the SRPC graph. At inflation I3, the move from SRPC1 to SRPC2 implies unemployment is:","options":["Higher on SRPC2","Lower on SRPC2","The same on both curves","Zero on both curves"],"a":0,"tag":"expectations","type":"graph_interpretation","objective":"LO36.3","difficulty":"hard","conceptCluster":"pc_graphs","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Missing worse tradeoff at the same inflation rate.","feedback":"At a given inflation rate, the higher SRPC implies a higher unemployment rate." ,"image":"srpc.webp"},
{"id":244,"q":"Refer to the SRPC graph. A shift from SRPC1 to SRPC2 is most consistent with:","options":["Higher expected inflation or adverse supply shock","Lower expected inflation or favorable supply shock","Higher money supply with expectations fixed","Lower unemployment at every inflation rate"],"a":0,"tag":"supply_shock_pc","type":"graph_interpretation","objective":"LO36.3","difficulty":"hard","conceptCluster":"pc_graphs","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Treating SRPC shifts as ordinary movement along a curve.","feedback":"The upward SRPC shift reflects higher expected inflation or a worsened supply-side tradeoff." ,"image":"srpc.webp"},
{"id":245,"q":"If the Fed unexpectedly increases inflation while expected inflation is fixed, unemployment moves:","options":["Below the natural rate temporarily","Above the natural rate permanently","To zero permanently","Unchanged in every period"],"a":0,"tag":"expectations","type":"interpretation","objective":"LO36.3","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Ignoring the gap between actual and expected inflation.","feedback":"When actual inflation exceeds expected inflation, unemployment can temporarily fall below the natural rate."},
{"id":246,"q":"If actual inflation equals expected inflation, the Phillips curve equation implies unemployment is:","options":["At the natural rate","Below the natural rate","Above the natural rate","Equal to zero"],"a":0,"tag":"natural_rate_hypothesis","type":"interpretation","objective":"LO36.2","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"natural_rate_hypothesis","repairSkill":"natural_rate_hypothesis","commonError":"Missing the role of inflation surprises.","feedback":"With no inflation surprise, unemployment equals the natural rate."},
{"id":247,"q":"If actual inflation is less than expected inflation, unemployment is likely:","options":["Above the natural rate","Below the natural rate","Equal to zero","Equal to inflation"],"a":0,"tag":"policy_phillips","type":"interpretation","objective":"LO36.4","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"monetary_policy_pc_transition","repairSkill":"monetary_policy_pc_transition","commonError":"Reversing the effect of unexpectedly low inflation.","feedback":"When actual inflation is below expected inflation, unemployment tends to rise above the natural rate."},
{"id":248,"q":"A credible disinflation lowers expected inflation before unemployment rises much. What happens to the sacrifice ratio?","options":["It falls","It rises","It becomes infinite","It equals MPC"],"a":0,"tag":"sacrifice_ratio","type":"interpretation","objective":"LO36.5","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Ignoring credibility in disinflation costs.","feedback":"Credibility lowers expected inflation faster and can reduce the output cost of disinflation."},
{"id":249,"q":"If the sacrifice ratio is 2.5 and inflation falls from 10 percent to 6 percent, output loss equals:","options":["4 percent","6.5 percent","10 percent","25 percent"],"a":2,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Adding the ratio and inflation change.","feedback":"Inflation falls by 4 points, so output loss is 2.5 x 4 = 10 percent of one year's output."},
{"id":250,"q":"If inflation falls by 3 points and the output loss is 12 percent of one year's GDP, the sacrifice ratio is:","options":["3","4","9","12"],"a":1,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Multiplying instead of dividing.","feedback":"Sacrifice ratio equals output loss divided by inflation reduction, so 12/3 = 4."},
{"id":251,"q":"Which statement best links an AD expansion to the Phillips curve in the short run?","options":["AD rises, output rises, unemployment falls, inflation rises","AD rises, output falls, unemployment rises, inflation falls","AD falls, output rises, unemployment falls, inflation rises","AD falls, output falls, unemployment falls, inflation rises"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.2","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Breaking the AD-AS to Phillips curve mapping.","feedback":"Expansionary AD raises output and inflation, which maps to lower unemployment and higher inflation on SRPC."},
{"id":252,"q":"Which statement best links an adverse supply shock across models?","options":["SRAS shifts left and SRPC shifts up-right","SRAS shifts right and SRPC shifts down-left","AD shifts right and SRPC shifts down-left","LRAS shifts right and LRPC shifts right"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.3","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Missing the supply-shock connection across graphs.","feedback":"An adverse supply shock raises prices, lowers output, and worsens the Phillips curve tradeoff."},
{"id":253,"q":"A central bank accommodates an adverse supply shock with more AD. What is the likely tradeoff?","options":["Output loss may shrink but inflation rises more","Inflation falls and unemployment rises less","SRAS shifts right and prices fall","LRPC shifts left and inflation vanishes"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.4","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Thinking accommodation has no inflation cost.","feedback":"Accommodation can support output but usually worsens inflation pressure."},
{"id":254,"q":"A central bank refuses to accommodate an adverse supply shock. What is the likely tradeoff?","options":["Inflation pressure is restrained but output loss remains","Output rises and inflation disappears","Unemployment falls and prices fall","SRAS shifts right immediately"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.4","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Thinking non-accommodation avoids all costs.","feedback":"Not accommodating helps restrain inflation, but the economy still suffers lower output and higher unemployment."},
{"id":255,"q":"A policymaker claims higher inflation can permanently hold unemployment below natural. What is the flaw?","options":["Expected inflation adjusts over time","Money demand is always zero","LRAS shifts right automatically","M1 excludes currency"],"a":0,"tag":"natural_rate_hypothesis","type":"trap","objective":"LO36.1","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"natural_rate_hypothesis","repairSkill":"natural_rate_hypothesis","commonError":"Believing in a permanent Phillips curve menu.","feedback":"Once expected inflation adjusts, unemployment returns to the natural rate."},
{"id":256,"q":"A policymaker wants lower inflation but ignores unemployment during transition. What model warns about this cost?","options":["Short-run Phillips curve","Money multiplier only","M1 definition only","Classical dichotomy only"],"a":0,"tag":"disinflation","type":"interpretation","objective":"LO36.4","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"disinflation_unemployment_cost","repairSkill":"disinflation_unemployment_cost","commonError":"Ignoring short-run disinflation costs.","feedback":"The short-run Phillips curve shows that reducing inflation can temporarily raise unemployment."},
{"id":257,"q":"Which event shifts both SRAS left and SRPC up-right?","options":["Oil price surge","Tax cut","Open-market purchase","Consumer confidence boom"],"a":0,"tag":"supply_shock_pc","type":"integration","objective":"LO36.3","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Confusing supply shocks with AD shocks.","feedback":"An oil price surge raises production costs and worsens the inflation-unemployment tradeoff."},
{"id":258,"q":"Which event moves along SRPC rather than shifting SRPC?","options":["Unexpected AD expansion","Higher expected inflation","Adverse oil shock","Rising natural unemployment"],"a":0,"tag":"policy_phillips","type":"trap","objective":"LO36.1","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"move_along_srpc","repairSkill":"move_along_srpc","commonError":"Confusing movement along SRPC with shifts of SRPC.","feedback":"Unexpected AD expansion moves the economy along the existing SRPC in the short run."},
{"id":259,"q":"Which event is most likely to shift the LRPC right?","options":["Higher natural unemployment","Lower actual inflation","Temporary AD expansion","Unexpected money growth"],"a":0,"tag":"lrpc","type":"interpretation","objective":"LO36.2","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"identify_lrpc","repairSkill":"identify_lrpc","commonError":"Confusing inflation changes with natural-rate changes.","feedback":"The LRPC shifts when the natural rate of unemployment changes."},
{"id":260,"q":"Which event is most likely to shift the LRPC left?","options":["Better labor-market matching","Higher expected inflation","Unexpected AD expansion","Higher oil prices only"],"a":0,"tag":"lrpc","type":"interpretation","objective":"LO36.2","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"identify_lrpc","repairSkill":"identify_lrpc","commonError":"Treating expected inflation as a natural-rate change.","feedback":"Better labor-market matching can lower the natural rate and shift the LRPC left."},
{"id":261,"q":"A recession lowers output below potential and inflation also falls. Which model pairing fits?","options":["AD shifts left and movement down-right on SRPC","SRAS shifts left and SRPC shifts up-right","AD shifts right and movement up-left on SRPC","LRAS shifts right and LRPC shifts right"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.2","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Confusing demand recessions with supply shocks.","feedback":"A negative AD shock lowers output and prices, mapping to higher unemployment and lower inflation."},
{"id":262,"q":"A boom raises output above potential and inflation rises. Which model pairing fits?","options":["AD shifts right and movement up-left on SRPC","SRAS shifts left and SRPC shifts up-right","AD shifts left and movement down-right on SRPC","LRAS shifts left and LRPC shifts right"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.2","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Missing the short-run AD-to-PC connection.","feedback":"A positive AD shock raises output and inflation, mapping to lower unemployment and higher inflation."},
{"id":263,"q":"If expected inflation rises but actual inflation does not rise with it, unemployment tends to:","options":["Rise above natural","Fall below natural","Stay zero","Become inflation"],"a":0,"tag":"expectations","type":"interpretation","objective":"LO36.3","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Ignoring expected inflation in the Phillips curve equation.","feedback":"Higher expected inflation shifts SRPC up, so unchanged actual inflation corresponds to higher unemployment."},
{"id":264,"q":"If expected inflation falls while actual inflation is held steady, unemployment tends to:","options":["Fall below natural","Rise above natural","Stay at zero","Equal the price level"],"a":0,"tag":"expectations","type":"interpretation","objective":"LO36.3","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Reversing the effect of lower expected inflation.","feedback":"Lower expected inflation shifts SRPC down, so the same actual inflation can mean lower unemployment."},
{"id":265,"q":"A student says an oil shock causes only movement along the SRPC. What is the correction?","options":["It shifts SRPC because costs and prices change directly","It shifts only AD because spending changes directly","It shifts only LRPC because inflation changes","It moves only along LRAS because output changes"],"a":0,"tag":"supply_shock_pc","type":"trap","objective":"LO36.3","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Treating supply shocks as AD movements.","feedback":"A supply shock shifts the SRPC because it directly changes firms' costs and inflation pressure."},
{"id":266,"q":"A student says disinflation has no cost if the Fed announces it. What is the correction?","options":["Credibility can lower the cost, not guarantee zero cost","Announcements always raise inflation first","The sacrifice ratio ignores expectations","Unemployment must fall during disinflation"],"a":0,"tag":"sacrifice_ratio","type":"trap","objective":"LO36.5","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Overstating credibility effects.","feedback":"Credibility can reduce the sacrifice ratio, but it does not automatically make disinflation costless."},
{"id":267,"q":"A student says higher expected inflation lowers unemployment permanently. What is the correction?","options":["It shifts SRPC upward and worsens the short-run tradeoff","It shifts LRPC left and improves the long-run tradeoff","It shifts AD right and lowers prices","It raises money demand and lowers rates"],"a":0,"tag":"expectations","type":"trap","objective":"LO36.3","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Treating expected inflation as beneficial stimulus.","feedback":"Higher expected inflation shifts the SRPC upward, giving higher inflation at each unemployment rate."},
{"id":268,"q":"Which answer best separates short-run and long-run Phillips curve logic?","options":["Policy can move unemployment temporarily, but expectations restore the natural rate","Policy cannot affect unemployment even briefly, because money is neutral in every period","Policy permanently lowers unemployment whenever inflation rises above zero","Policy shifts LRPC whenever actual inflation changes"],"a":0,"tag":"natural_rate_hypothesis","type":"integration","objective":"LO36.1","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"natural_rate_hypothesis","repairSkill":"natural_rate_hypothesis","commonError":"Confusing short-run effects with long-run neutrality.","feedback":"Demand policy can move unemployment in the short run, but expectations adjust and unemployment returns to natural."},
{"id":269,"q":"Which answer best connects Chapters 34 and 36 during a demand expansion?","options":["AD shifts right; output rises; unemployment falls; inflation rises","AD shifts left; output rises; unemployment falls; inflation falls","SRAS shifts left; output rises; unemployment falls; inflation falls","LRAS shifts right; unemployment rises; inflation rises"],"a":0,"tag":"ad_as_pc_integration","type":"integration","objective":"LO36.2","difficulty":"hard","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Breaking the AD-AS and Phillips curve connection.","feedback":"A demand expansion raises output and inflation in AD-AS, which maps to lower unemployment and higher inflation on the SRPC."}
],
	
elite: [
{"id":300,"q":"A bank receives new deposits, the Fed pays higher interest on reserves, and banks choose to hold more excess reserves. What is the likely result?","options":["Money creation weakens because lending falls","Money creation strengthens because deposits rose","The multiplier becomes unrelated to reserves","M1 falls because deposits are excluded"],"a":0,"tag":"limits_monetary_control","type":"integration","objective":"LO30.5","difficulty":"elite","conceptCluster":"money_banking","primarySkill":"limits_of_monetary_control","repairSkill":"limits_of_monetary_control","commonError":"Assuming deposits automatically create full lending expansion.","feedback":"Deposits increase lending potential, but higher interest on reserves can make banks hold reserves instead of lending them."},
{"id":301,"q":"The Fed buys bonds during a banking panic, but households increase currency holdings and banks increase excess reserves. What should students infer?","options":["Fed control is limited by depositor and bank behavior","The money multiplier must rise to its maximum","Open-market purchases cannot affect reserves","Currency holdings are excluded from M1"],"a":0,"tag":"limits_monetary_control","type":"integration","objective":"LO30.5","difficulty":"elite","conceptCluster":"money_banking","primarySkill":"limits_of_monetary_control","repairSkill":"limits_of_monetary_control","commonError":"Ignoring leakage from currency holdings and excess reserves.","feedback":"Fed purchases add reserves, but currency withdrawals and excess reserve holdings can weaken money creation."},
{"id":302,"q":"If banks become more cautious while the Fed is trying to expand the money supply, which link in the chain is most likely to weaken?","options":["Reserves to loans and deposits","Currency to fiat money","Prices to real output in the long run","Expected inflation to nominal rates"],"a":0,"tag":"money_creation","type":"integration","objective":"LO30.3","difficulty":"elite","conceptCluster":"money_banking","primarySkill":"deposit_creation","repairSkill":"deposit_creation","commonError":"Thinking reserves and loans always move one-for-one.","feedback":"The money creation chain weakens when banks do not convert excess reserves into new loans and deposits."},
{"id":303,"q":"A central bank doubles the money supply, output is unchanged, and all nominal wages and prices double. Which claim is strongest?","options":["Real wages and relative prices are unchanged","Real wages double with nominal wages","Relative prices double with prices","Output must double with money"],"a":0,"tag":"monetary_neutrality","type":"integration","objective":"LO31.2","difficulty":"elite","conceptCluster":"inflation_money_growth","primarySkill":"monetary_neutrality","repairSkill":"monetary_neutrality","commonError":"Confusing nominal doubling with real doubling.","feedback":"If wages and prices double together, real wages and relative prices remain unchanged."},
{"id":304,"q":"Money growth rises, velocity falls, and output rises. Which statement is safest?","options":["Inflation depends on all three changes","Inflation must equal money growth","Inflation must be zero","Inflation must exceed output growth"],"a":0,"tag":"quantity_theory","type":"integration","objective":"LO31.1","difficulty":"elite","conceptCluster":"inflation_money_growth","primarySkill":"quantity_equation","repairSkill":"quantity_equation","commonError":"Using money growth alone when V and Y change.","feedback":"The quantity equation connects money, velocity, prices, and output, so inflation depends on changes in all of them."},
{"id":305,"q":"A worker’s nominal wage rises 6 percent while the price level rises 9 percent. What happens to the real wage?","options":["It falls by about 3 percent","It rises by about 3 percent","It rises by about 15 percent","It stays unchanged"],"a":0,"tag":"real_nominal_variables","type":"calculation","objective":"LO31.2","difficulty":"elite","conceptCluster":"inflation_money_growth","primarySkill":"nominal_vs_real_variables","repairSkill":"nominal_vs_real_variables","commonError":"Treating nominal wage growth as real wage growth.","feedback":"Real wage growth is approximately nominal wage growth minus inflation, so 6 - 9 = -3 percent."},
{"id":306,"q":"A lender expected 4 percent inflation and charged 9 percent nominal interest. Actual inflation was 8 percent. What happened to the realized real return?","options":["It was lower than expected","It was higher than expected","It was unchanged","It became nominal GDP"],"a":0,"tag":"fisher_effect","type":"calculation","objective":"LO31.3","difficulty":"elite","conceptCluster":"inflation_money_growth","primarySkill":"nominal_real_interest_rate","repairSkill":"nominal_real_interest_rate","commonError":"Ignoring unexpected inflation after a loan is written.","feedback":"Higher-than-expected inflation lowers the realized real return to lenders."},
{"id":307,"q":"A country uses money creation to finance deficits, inflation rises, and nominal interest rates rise with expected inflation. Which two ideas are linked?","options":["Inflation tax and Fisher effect","Crowding out and SRAS","Multiplier and LRPC","M1 and sacrifice ratio"],"a":0,"tag":"inflation_policy","type":"integration","objective":"LO31.5","difficulty":"elite","conceptCluster":"inflation_money_growth","primarySkill":"inflation_tax","repairSkill":"inflation_tax","commonError":"Separating deficit money creation from expected inflation effects.","feedback":"Printing money can act as an inflation tax, and higher expected inflation raises nominal interest rates through the Fisher effect."},
{"id":308,"q":"Refer to the graph. Starting at AD1-AS2, AD rises to AD2 while SRAS falls to AS1. What is the final point?","options":["Y1 and P3","Y2 and P2","Y3 and P2","Y1 and P1"],"a":0,"tag":"ad_as_graph_interpretation","type":"graph_interpretation","objective":"LO34.4","difficulty":"elite","conceptCluster":"ad_as_graphs","primarySkill":"trace_combined_shocks","repairSkill":"trace_combined_shocks","commonError":"Following only AD or only SRAS.","feedback":"AD2 and AS1 intersect at Y1 and P3, so output returns to Y1 while the price level rises.","image":"adas1.webp"},
{"id":309,"q":"Refer to the graph. Starting at AD2-AS1, AD falls to AD1 while SRAS rises to AS2. What is the final point?","options":["Y1 and P1","Y2 and P2","Y3 and P2","Y1 and P3"],"a":0,"tag":"ad_as_graph_interpretation","type":"graph_interpretation","objective":"LO34.4","difficulty":"elite","conceptCluster":"ad_as_graphs","primarySkill":"trace_combined_shocks","repairSkill":"trace_combined_shocks","commonError":"Tracking the starting point but not both curve shifts.","feedback":"AD1 and AS2 intersect at Y1 and P1.","image":"adas1.webp"},
{"id":310,"q":"Refer to the graph with LRAS. Starting at AD2-AS2, which long-run adjustment is most consistent with self-correction?","options":["SRAS shifts left until output returns to Y1","SRAS shifts right until output reaches Y3","AD shifts right until output reaches Y2","LRAS shifts right until it reaches Y2"],"a":0,"tag":"long_run_adjustment","type":"graph_interpretation","objective":"LO34.5","difficulty":"elite","conceptCluster":"ad_as_graphs","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Moving LRAS instead of SRAS during short-run self-correction.","feedback":"At Y2, output is above natural output, so rising wages and expected prices shift SRAS left toward long-run equilibrium." ,"image":"adaslras.webp"},
{"id":311,"q":"Refer to the graph with LRAS. Starting at AD1-AS1, which long-run adjustment is most consistent with self-correction?","options":["SRAS shifts right until output returns to Y1","SRAS shifts left until output returns to Y3","AD shifts left until output returns to Y3","LRAS shifts left until it reaches Y3"],"a":0,"tag":"long_run_adjustment","type":"graph_interpretation","objective":"LO34.5","difficulty":"elite","conceptCluster":"ad_as_graphs","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Moving AD or LRAS instead of SRAS during self-correction.","feedback":"At Y3, output is below natural output, so falling wages and expected prices shift SRAS right toward long-run equilibrium.","image":"adaslras.webp"},
{"id":312,"q":"Refer to the graph with LRAS. Starting at AD1-AS2, an oil shock shifts AS2 to AS1, then policymakers shift AD1 to AD2. What happens?","options":["Output returns to Y1 but prices rise to P3","Output rises to Y2 while prices stay P2","Output falls to Y3 while prices fall P1","Output returns to Y1 while prices fall P1"],"a":0,"tag":"ad_as_policy","type":"integration","objective":"LO34.4","difficulty":"elite","conceptCluster":"ad_as_graphs","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Missing the inflation cost of accommodating a supply shock.","feedback":"Accommodation restores output from Y3 to Y1, but the price level rises to P3.","image":"adaslras.webp"},
{"id":313,"q":"A supply shock raises prices and lowers output. The central bank tightens policy to fight inflation. What is the likely short-run danger?","options":["Output falls further below potential","Inflation rises because AD expands","Unemployment falls below natural","SRAS shifts right immediately"],"a":0,"tag":"supply_shocks","type":"trap","objective":"LO34.4","difficulty":"elite","conceptCluster":"ad_as","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Ignoring output costs of tightening after a supply shock.","feedback":"Tightening reduces AD and may lower inflation pressure, but it can worsen the output decline."},
{"id":314,"q":"An economy is above potential because of a demand boom. Which policy and long-run force push in the same direction?","options":["Contractionary policy and rising expected prices","Expansionary policy and falling expected prices","Contractionary policy and falling expected prices","Expansionary policy and rising expected prices"],"a":0,"tag":"long_run_adjustment","type":"integration","objective":"LO34.5","difficulty":"elite","conceptCluster":"ad_as","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Pairing the wrong policy with the wrong output gap.","feedback":"Contractionary policy shifts AD left, while rising expected prices shift SRAS left; both reduce output toward potential."},
{"id":315,"q":"An economy is below potential because AD collapsed. Which policy and long-run force push in the same direction?","options":["Expansionary policy and falling expected prices","Contractionary policy and rising expected prices","Expansionary policy and rising expected prices","Contractionary policy and falling expected prices"],"a":0,"tag":"long_run_adjustment","type":"integration","objective":"LO34.5","difficulty":"elite","conceptCluster":"ad_as","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Pairing recessionary gaps with contractionary policy.","feedback":"Expansionary policy shifts AD right, while falling expected prices shift SRAS right; both raise output toward potential."},
{"id":316,"q":"Refer to the money-market graph. Money demand rises from MD1 to MD2 while the Fed also increases money supply from MS1 to MS2. What is the final equilibrium?","options":["d","a","e","g"],"a":0,"tag":"liquidity_preference","type":"graph_interpretation","objective":"LO35.1","difficulty":"elite","conceptCluster":"policy_graphs","primarySkill":"read_money_market_equilibrium","repairSkill":"read_money_market_equilibrium","commonError":"Tracking only money demand or money supply.","feedback":"MD2 and MS2 intersect at point d.","image":"moneyd2_moneys2.webp"},

{"id":320,"q":"Refer to the multiplier graph. Government spending initially moves AD1 to AD2, the multiplier moves AD2 to AD3, and crowding out offsets part of it. The final effect is likely:","options":["Between AD2 and AD3","Left of AD1","Exactly at AD3","Exactly at SRPC2"],"a":0,"tag":"crowding_out","type":"graph_interpretation","objective":"LO35.4","difficulty":"elite","conceptCluster":"policy_graphs","primarySkill":"crowding_out_effect","repairSkill":"crowding_out_effect","commonError":"Ignoring crowding out after multiplier expansion.","feedback":"Crowding out offsets part of the multiplied AD increase, so the final shift may land between AD2 and AD3.","image":"moneymultiplier.webp"},
{"id":321,"q":"A recessionary demand shock hits, but the Fed is at the zero lower bound. Which option best describes the policy problem?","options":["AD needs support, but rate cuts have limited room","AD is too high, and rate cuts work too strongly","SRAS needs support, but wages rise instantly","LRPC must shift, but M2 is too small"],"a":0,"tag":"liquidity_trap","type":"integration","objective":"LO35.5","difficulty":"elite","conceptCluster":"policy_transmission","primarySkill":"liquidity_trap","repairSkill":"liquidity_trap","commonError":"Ignoring why zero rates weaken monetary stimulus.","feedback":"When rates are near zero, traditional monetary policy may struggle to shift AD right enough."},
{"id":322,"q":"A government passes stimulus after a recession has ended, and the economy is already above potential. What is the risk?","options":["The stimulus may worsen inflation pressure","The stimulus must lower output below potential","The stimulus shifts SRAS right automatically","The stimulus lowers expected prices instantly"],"a":0,"tag":"policy_lags","type":"integration","objective":"LO35.5","difficulty":"elite","conceptCluster":"policy_transmission","primarySkill":"policy_lags","repairSkill":"policy_lags","commonError":"Ignoring policy timing after recovery.","feedback":"Because of lags, stimulus can hit after recovery and add excess demand."},
{"id":323,"q":"Refer to the LRPC graph. Starting at c, which sequence best shows an attempted permanent unemployment reduction through expansionary policy?","options":["c to a to b","c to b to d","c to d to c","c to a to c"],"a":0,"tag":"natural_rate_hypothesis","type":"graph_interpretation","objective":"LO36.1","difficulty":"elite","conceptCluster":"pc_graphs","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Thinking point a can be held permanently.","feedback":"Expansion lowers unemployment at a temporarily, but expectations adjust and unemployment returns to natural at b.","image":"lrpc.webp"},
{"id":324,"q":"Refer to the LRPC graph. Starting at b, which sequence best shows disinflation with temporary unemployment costs?","options":["b to d to c","b to a to c","b to c to d","b to d to b"],"a":0,"tag":"disinflation","type":"graph_interpretation","objective":"LO36.4","difficulty":"elite","conceptCluster":"pc_graphs","primarySkill":"monetary_policy_pc_transition","repairSkill":"monetary_policy_pc_transition","commonError":"Skipping the temporary move above natural unemployment.","feedback":"Disinflation lowers actual inflation first, moving to d, then expectations fall and the economy returns to c.","image":"lrpc.webp"},
{"id":325,"q":"Refer to the LRPC graph. Which comparison best captures the long-run result of higher expected inflation?","options":["b and c have same unemployment but different inflation","a and b have same unemployment but different inflation","c and d have same inflation but different unemployment","a and d have same inflation but different unemployment"],"a":0,"tag":"lrpc","type":"graph_interpretation","objective":"LO36.2","difficulty":"elite","conceptCluster":"pc_graphs","primarySkill":"identify_lrpc","repairSkill":"identify_lrpc","commonError":"Missing vertical long-run logic.","feedback":"Both b and c lie on the LRPC at U2, but b has higher inflation.","image":"lrpc.webp"},
