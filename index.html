{"id":4011,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_phillips_expansion","primarySkill":"natural_rate_hypothesis","secondarySkills":["choose_stabilization_response","expected_inflation_shift"],"repairSkill":"natural_rate_hypothesis","commonError":"Believing inflation can permanently buy lower unemployment.","q":"The Custodian asks whether higher inflation can permanently hold unemployment below natural. Which ruling survives?","options":["No; expected inflation adjusts and unemployment returns to the natural rate","Yes; higher actual inflation permanently shifts LRPC left","Yes; the SRPC becomes permanent when inflation rises","No; monetary policy cannot affect unemployment even temporarily"],"a":0,"tag":"natural_rate_hypothesis","type":"final_boss_policy_memo","objective":"LO36.1","boss":"The Custodian","feedback":"The short-run Phillips curve tradeoff is temporary. The long-run Phillips curve is vertical at the natural rate."},
{"id":4012,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_disinflation","primarySkill":"monetary_policy_pc_transition","secondarySkills":["disinflation_unemployment_cost","read_pc_points"],"repairSkill":"monetary_policy_pc_transition","commonError":"Ignoring the short-run unemployment cost of disinflation.","q":"Refer to the LRPC graph. Starting at point b, the Fed reduces inflation below expectations. Where does the economy move first?","options":["d","c","a","b"],"a":0,"tag":"disinflation","type":"final_boss_graph_diagnosis","objective":"LO36.4","boss":"The Custodian","feedback":"Disinflation moves the economy from b to d in the short run: lower inflation and higher unemployment.","image":"lrpc.webp"},
{"id":4013,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_disinflation","primarySkill":"trace_expectations_adjustment","secondarySkills":["expected_inflation_shift","disinflation"],"repairSkill":"trace_expectations_adjustment","commonError":"Assuming disinflation permanently raises unemployment.","q":"Refer to the LRPC graph. After the economy reaches point d, expected inflation falls. What happens next?","options":["SRPC shifts downward and the economy moves toward c","SRPC shifts upward and the economy moves toward b","LRPC shifts right and the economy remains at d","AD shifts right and inflation rises to I2"],"a":0,"tag":"disinflation","type":"final_boss_graph_mechanism","objective":"LO36.4","boss":"The Custodian","feedback":"Expected inflation falling shifts the SRPC downward, returning unemployment toward the natural rate at lower inflation.","image":"lrpc.webp"},
{"id":4014,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_disinflation","primarySkill":"interpret_sacrifice_ratio","secondarySkills":["credibility","expectations"],"repairSkill":"interpret_sacrifice_ratio","commonError":"Ignoring credibility in disinflation costs.","q":"The Custodian asks why credibility matters during disinflation. Which ruling survives?","options":["Credibility lowers expected inflation faster and can reduce the sacrifice ratio","Credibility raises expected inflation and makes disinflation more costly","Credibility shifts LRPC right because actual inflation falls","Credibility removes the short-run Phillips curve entirely"],"a":0,"tag":"sacrifice_ratio","type":"final_boss_policy_memo","objective":"LO36.5","boss":"The Custodian","feedback":"Credible anti-inflation policy can reduce output losses by making expected inflation adjust faster."},
{"id":4015,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_fiscal_crowding","primarySkill":"fiscal_policy_ad_shift","secondarySkills":["multiplier_effect","crowding_out_effect"],"repairSkill":"fiscal_policy_ad_shift","commonError":"Ignoring that fiscal expansion first shifts AD right.","q":"The economy is below potential. Congress increases government spending. What is the first direct effect?","options":["Aggregate demand shifts right","Short-run aggregate supply shifts left","LRPC shifts right","Money demand disappears"],"a":0,"tag":"fiscal_policy","type":"final_boss_diagnosis","objective":"LO35.3","boss":"The Custodian","feedback":"Higher government spending directly raises aggregate demand."},
{"id":4016,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_fiscal_crowding","primarySkill":"crowding_out_effect","secondarySkills":["interest_rate_investment_channel","fiscal_policy_magnitude"],"repairSkill":"crowding_out_effect","commonError":"Treating the multiplier as the guaranteed final effect.","q":"The Custodian sees interest rates rise after the spending increase and private investment weaken. What mechanism is this?","options":["Crowding out","Money neutrality","Supply-shock accommodation","Expected inflation falling"],"a":0,"tag":"crowding_out","type":"final_boss_mechanism","objective":"LO35.4","boss":"The Custodian","feedback":"Crowding out occurs when fiscal expansion raises interest rates and reduces private investment."},
{"id":4017,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_fiscal_crowding","primarySkill":"choose_stabilization_response","secondarySkills":["crowding_out_effect","policy_lags"],"repairSkill":"choose_stabilization_response","commonError":"Ignoring side effects of fiscal policy.","q":"The Custodian must rule on fiscal expansion during the recession. Which memo should survive?","options":["It may help close the gap, but crowding out and timing can weaken the final gain","It must fully close the gap because the multiplier cannot be offset","It shifts SRAS right because government spending lowers production costs","It has no effect because fiscal policy cannot shift aggregate demand"],"a":0,"tag":"stabilization_policy","type":"final_boss_policy_memo","objective":"LO35.5","boss":"The Custodian","feedback":"Fiscal policy can help weak AD, but crowding out and policy lags can weaken or complicate the final result."},
{"id":4018,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_money_inflation","primarySkill":"quantity_equation","secondarySkills":["money_growth_to_inflation","monetary_neutrality"],"repairSkill":"quantity_equation","commonError":"Using money growth alone without output and velocity.","q":"The Custodian sees money growth rise 9 percent, velocity fall 2 percent, and real output rise 3 percent. Approximate inflation is:","options":["4 percent","6 percent","8 percent","14 percent"],"a":0,"tag":"quantity_theory","type":"final_boss_calculation","objective":"LO31.1","boss":"The Custodian","feedback":"Inflation is approximately money growth plus velocity growth minus output growth: 9 - 2 - 3 = 4 percent."},
{"id":4019,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_money_inflation","primarySkill":"fisher_effect","secondarySkills":["expected_inflation","nominal_real_interest_rate"],"repairSkill":"fisher_effect","commonError":"Forgetting that expected inflation changes nominal rates.","q":"Expected inflation rises from 3 percent to 7 percent while the real interest rate stays fixed. What should happen to the nominal interest rate?","options":["It rises by 4 percentage points","It falls by 4 percentage points","It rises by 7 percentage points","It stays unchanged"],"a":0,"tag":"fisher_effect","type":"final_boss_mechanism","objective":"LO31.3","boss":"The Custodian","feedback":"The Fisher effect predicts that nominal rates rise when expected inflation rises."},
{"id":4020,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_money_inflation","primarySkill":"inflation_tax","secondarySkills":["fisher_effect","value_of_money"],"repairSkill":"inflation_tax","commonError":"Treating money-financed spending as painless.","q":"The Custodian asks why printing money to finance spending is not free. Which memo should survive?","options":["It creates an inflation tax, lowers money value, and can raise nominal rates through expectations","It raises real output permanently, lowers inflation, and reduces nominal rates automatically","It increases bank capital directly, lowers prices, and shifts SRAS right without cost","It changes only M1, leaves prices fixed, and has no effect on purchasing power"],"a":0,"tag":"inflation_policy","type":"final_boss_policy_memo","objective":"LO31.5","boss":"The Custodian","feedback":"Money-financed spending can reduce money's value through inflation and raise nominal rates when expected inflation increases."},
{"id":4021,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_banking_policy","primarySkill":"choose_fed_tool_effect","secondarySkills":["deposit_creation","limits_of_monetary_control"],"repairSkill":"choose_fed_tool_effect","commonError":"Assuming Fed tools create full money expansion automatically.","q":"The Custodian asks how the Fed can initially expand bank reserves. Which action fits?","options":["Buy bonds in open-market operations","Sell bonds in open-market operations","Raise reserve requirements","Raise interest paid on reserves"],"a":0,"tag":"open_market_operations","type":"final_boss_diagnosis","objective":"LO30.4","boss":"The Custodian","feedback":"Fed bond purchases add reserves to the banking system."},
{"id":4022,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_banking_policy","primarySkill":"limits_of_monetary_control","secondarySkills":["excess_reserves","deposit_creation"],"repairSkill":"limits_of_monetary_control","commonError":"Ignoring bank behavior after reserve injections.","q":"The Fed buys bonds, but banks hold the added reserves and borrowers stay cautious. What happens to the money-creation channel?","options":["It weakens because reserves do not become loans and deposits","It strengthens because reserves always become full new lending","It disappears because currency is excluded from M1","It shifts LRAS because reserves are real capital"],"a":0,"tag":"limits_monetary_control","type":"final_boss_mechanism","objective":"LO30.5","boss":"The Custodian","feedback":"The Fed can add reserves, but actual money creation depends on bank lending and borrower behavior."},
{"id":4023,"difficulty":"finalBoss","conceptCluster":"chancellor_chain_banking_policy","primarySkill":"choose_stabilization_response","secondarySkills":["liquidity_trap","monetary_policy_transmission"],"repairSkill":"choose_stabilization_response","commonError":"Treating monetary policy as equally powerful in every environment.","q":"The Custodian asks why reserve injections may fail to stabilize demand during panic conditions. Which memo survives?","options":["Banks may hoard reserves, borrowers may retreat, and low rates may limit the AD response","Banks must lend all reserves, borrowers must expand demand, and AD must fully recover","Reserve injections shift SRAS right directly, so demand conditions do not matter","Reserve injections lower expected inflation instantly, so unemployment must fall"],"a":0,"tag":"stabilization_policy","type":"final_boss_policy_memo","objective":"LO35.5","boss":"The Custodian","feedback":"Monetary policy can weaken when reserves do not become lending and demand does not respond. The model has plumbing. Ignore it and you get wrecked."}
],
	
easy: [
{"id":1,"q":"Which function of money is being used when dollars are accepted to buy groceries?","options":["Store of value","Medium of exchange","Unit of account","Reserve requirement"],"a":1,"tag":"money_functions","type":"definition","objective":"LO30.1","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"identify_money_functions","repairSkill":"identify_money_functions","commonError":"Confusing the functions of money.","feedback":"Money is a medium of exchange when it is used to buy goods and services."},
{"id":2,"q":"Which function of money is being used when a store lists a phone price as $900?","options":["Unit of account","Store of value","Medium of exchange","Money multiplier"],"a":0,"tag":"money_functions","type":"definition","objective":"LO30.1","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"identify_money_functions","repairSkill":"identify_money_functions","commonError":"Confusing pricing with payment.","feedback":"Money is a unit of account when it measures and compares prices."},
{"id":3,"q":"Which function of money is being used when someone saves cash for a future purchase?","options":["Open-market operation","Unit of account","Store of value","Reserve ratio"],"a":2,"tag":"money_functions","type":"definition","objective":"LO30.1","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"identify_money_functions","repairSkill":"identify_money_functions","commonError":"Treating saving cash as medium of exchange.","feedback":"Money is a store of value when it transfers purchasing power into the future."},
{"id":4,"q":"Which item is counted in M1?","options":["Large time deposits","Currency held by the public","Credit card balances","Money market mutual funds held by businesses"],"a":1,"tag":"m1_m2","type":"definition","objective":"LO30.1","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"distinguish_m1_m2","repairSkill":"distinguish_m1_m2","commonError":"Counting credit cards as money.","feedback":"M1 includes currency held by the public and checkable deposits."},
{"id":5,"q":"Which item is included in M2 but not M1?","options":["Checkable deposits","Coins held by households","Savings deposits","Currency held by the public"],"a":2,"tag":"m1_m2","type":"definition","objective":"LO30.1","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"distinguish_m1_m2","repairSkill":"distinguish_m1_m2","commonError":"Treating M1 and M2 as identical.","feedback":"M2 includes M1 plus near monies such as savings deposits."},
{"id":6,"q":"What is fiat money?","options":["Money backed fully by gold","Accepted money with no intrinsic value","Money used only by banks","Money that cannot lose value"],"a":1,"tag":"forms_of_money","type":"definition","objective":"LO30.1","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"commodity_vs_fiat_money","repairSkill":"commodity_vs_fiat_money","commonError":"Thinking fiat money must be backed by gold.","feedback":"Fiat money has value because people accept it, not because it has intrinsic value."},
{"id":7,"q":"What is the central bank of the United States?","options":["The Treasury Department","Congress","The Federal Reserve","The FDIC"],"a":2,"tag":"federal_reserve","type":"definition","objective":"LO30.2","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"central_bank_role","repairSkill":"central_bank_role","commonError":"Confusing the Fed with fiscal agencies.","feedback":"The Federal Reserve is the central bank of the United States."},
{"id":8,"q":"Which group directs open-market operations?","options":["Federal Open Market Committee","Congressional Budget Office","Bureau of Labor Statistics","Internal Revenue Service"],"a":0,"tag":"fomc","type":"definition","objective":"LO30.2","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"fomc_role","repairSkill":"fomc_role","commonError":"Confusing monetary policy agencies with data or tax agencies.","feedback":"The FOMC directs open-market operations as part of monetary policy."},
{"id":9,"q":"If the reserve requirement is 10 percent, the simple money multiplier is:","options":["0.10","1","10","100"],"a":2,"tag":"money_multiplier","type":"calculation","objective":"LO30.3","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"calculate_money_multiplier_effect","repairSkill":"calculate_money_multiplier_effect","commonError":"Using the reserve ratio instead of its reciprocal.","feedback":"The simple money multiplier is 1 divided by the reserve requirement, so 1/0.10 = 10."},
{"id":10,"q":"If a bank receives a $1,000 deposit and the reserve requirement is 20 percent, required reserves are:","options":["$200","$20","$800","$1,200"],"a":0,"tag":"required_reserves","type":"calculation","objective":"LO30.3","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"calculate_required_reserves","repairSkill":"calculate_required_reserves","commonError":"Subtracting instead of multiplying by the reserve requirement.","feedback":"Required reserves equal deposits times the reserve requirement, so $1,000 x 0.20 = $200."},
{"id":11,"q":"If the Fed buys bonds in open-market operations, what happens first?","options":["Bank reserves tend to fall","Bank reserves tend to rise","SRAS shifts left","The natural rate falls"],"a":1,"tag":"open_market_operations","type":"interpretation","objective":"LO30.4","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"choose_fed_tool_effect","repairSkill":"choose_fed_tool_effect","commonError":"Reversing bond purchases and bond sales.","feedback":"Fed bond purchases inject reserves into the banking system."},
{"id":12,"q":"Why is the Fed's control over the money supply not perfect?","options":["M1 and M2 are always equal","Currency is not money","The Fed cannot buy bonds","Banks and depositors also influence lending"],"a":3,"tag":"limits_monetary_control","type":"definition","objective":"LO30.5","difficulty":"easy","conceptCluster":"money_banking","primarySkill":"limits_of_monetary_control","repairSkill":"limits_of_monetary_control","commonError":"Assuming the Fed controls every dollar directly.","feedback":"The Fed influences the money supply, but banks and depositors affect reserves, lending, and deposits."},
{"id":13,"q":"In the quantity equation MV = PY, what does PY represent?","options":["Real GDP","Nominal GDP","Money demand","Bank reserves"],"a":1,"tag":"quantity_theory","type":"definition","objective":"LO31.1","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"quantity_equation","repairSkill":"quantity_equation","commonError":"Confusing nominal GDP with real GDP.","feedback":"P times Y is nominal GDP."},
{"id":14,"q":"If M = 500, V = 2, and Y = 1,000, then P equals:","options":["2","250","1","1,500"],"a":2,"tag":"quantity_theory","type":"calculation","objective":"LO31.1","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"quantity_equation","repairSkill":"quantity_equation","commonError":"Forgetting to divide by output.","feedback":"MV = PY, so 500 x 2 = P x 1,000, which gives P = 1."},
{"id":15,"q":"If the money supply rises while velocity and output are unchanged, the quantity theory predicts that:","options":["Real output doubles","The price level rises","Velocity becomes zero","The price level falls"],"a":1,"tag":"money_growth_inflation","type":"interpretation","objective":"LO31.1","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"money_growth_to_inflation","repairSkill":"money_growth_to_inflation","commonError":"Thinking money growth must raise real output in the long run.","feedback":"With velocity and output fixed, more money means a higher price level."},
{"id":16,"q":"If the price level rises, what happens to the value of money?","options":["It rises","It stays fixed","It falls","It becomes real GDP"],"a":2,"tag":"value_of_money","type":"interpretation","objective":"LO31.1","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"value_of_money","repairSkill":"value_of_money","commonError":"Thinking a higher price level means money is more valuable.","feedback":"The value of money is 1/P, so a higher price level lowers the value of money."},
{"id":17,"q":"Which variable is nominal?","options":["Real GDP","Nominal wage","Relative price","Quantity of labor"],"a":1,"tag":"real_nominal_variables","type":"definition","objective":"LO31.2","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"nominal_vs_real_variables","repairSkill":"nominal_vs_real_variables","commonError":"Confusing money-measured variables with real variables.","feedback":"A nominal wage is measured in dollars."},
{"id":18,"q":"Which variable is real?","options":["Nominal GDP","Dollar wage","Relative price","Price level"],"a":2,"tag":"real_nominal_variables","type":"definition","objective":"LO31.2","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"nominal_vs_real_variables","repairSkill":"nominal_vs_real_variables","commonError":"Treating all prices as nominal variables.","feedback":"A relative price compares one good to another, so it is a real variable."},
{"id":19,"q":"Monetary neutrality says that in the long run, a change in the money supply affects:","options":["Nominal variables, not real variables","Real output only","The natural rate only","Technology only"],"a":0,"tag":"monetary_neutrality","type":"definition","objective":"LO31.2","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"monetary_neutrality","repairSkill":"monetary_neutrality","commonError":"Thinking money changes real variables permanently in the long run.","feedback":"Monetary neutrality means money affects nominal variables in the long run, not real output or employment."},
{"id":20,"q":"The Fisher effect links expected inflation to:","options":["Reserve requirements","Nominal interest rates","Labor productivity","Government purchases"],"a":1,"tag":"fisher_effect","type":"definition","objective":"LO31.3","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"fisher_effect","repairSkill":"fisher_effect","commonError":"Confusing Fisher effect with fiscal policy.","feedback":"The Fisher effect says higher expected inflation raises nominal interest rates one-for-one in the long run."},
{"id":21,"q":"If expected inflation rises and the real interest rate is unchanged, the nominal interest rate should:","options":["Fall","Rise","Become zero","Equal real GDP"],"a":1,"tag":"fisher_effect","type":"interpretation","objective":"LO31.3","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"nominal_real_interest_rate","repairSkill":"nominal_real_interest_rate","commonError":"Reversing the Fisher effect.","feedback":"Nominal interest rates include expected inflation, so they rise when expected inflation rises."},
{"id":22,"q":"Shoeleather costs of inflation come from:","options":["Changing menus often","Holding less cash and making more transactions","Higher unemployment benefits","Falling expected prices"],"a":1,"tag":"inflation_costs","type":"definition","objective":"LO31.4","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"shoeleather_costs","repairSkill":"shoeleather_costs","commonError":"Confusing shoeleather costs with menu costs.","feedback":"Shoeleather costs come from efforts to reduce money holdings when inflation is high."},
{"id":23,"q":"Menu costs of inflation refer to the cost of:","options":["Printing more money","Changing posted prices","Measuring real GDP","Buying bonds"],"a":1,"tag":"inflation_costs","type":"definition","objective":"LO31.4","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"menu_costs","repairSkill":"menu_costs","commonError":"Confusing menu costs with restaurant spending.","feedback":"Menu costs are the costs firms face when changing listed prices."},
{"id":24,"q":"When a government finances spending by printing money, it is using:","options":["An inflation tax","A reserve requirement","The Fisher effect","A supply shock"],"a":0,"tag":"inflation_tax","type":"definition","objective":"LO31.5","difficulty":"easy","conceptCluster":"inflation_money_growth","primarySkill":"inflation_tax","repairSkill":"inflation_tax","commonError":"Confusing money creation with ordinary taxation only.","feedback":"Printing money to finance spending creates an inflation tax by reducing the value of existing money."},
{"id":25,"q":"In an AD-AS graph, the vertical axis measures:","image":"adaslras.webp","options":["Real GDP","The price level","Unemployment","Money supply"],"a":1,"tag":"ad_as_basics","type":"definition","objective":"LO34.1","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"read_ad_as_axes","repairSkill":"read_ad_as_axes","commonError":"Confusing output with the price level.","feedback":"The vertical axis in the AD-AS model measures the price level."},
{"id":26,"q":"In an AD-AS graph, the horizontal axis measures:","image":"adaslras.webp","options":["The price level","Inflation expectations","Real GDP","Nominal interest rates"],"a":2,"tag":"ad_as_basics","type":"definition","objective":"LO34.1","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"read_ad_as_axes","repairSkill":"read_ad_as_axes","commonError":"Confusing the AD-AS axes.","feedback":"The horizontal axis in the AD-AS model measures real GDP or output."},
{"id":27,"q":"Which change shifts aggregate demand to the right?","options":["A decrease in government spending","An increase in consumer confidence","A negative supply shock","A rise in production costs"],"a":1,"tag":"aggregate_demand","type":"interpretation","objective":"LO34.1","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"identify_ad_shifters","repairSkill":"identify_ad_shifters","commonError":"Confusing AD shifters with SRAS shifters.","feedback":"Higher consumer confidence increases consumption and shifts AD to the right."},
{"id":28,"q":"Which change shifts aggregate demand to the left?","options":["A tax increase","A stock market boom","Higher government purchases","Improved consumer confidence"],"a":0,"tag":"aggregate_demand","type":"interpretation","objective":"LO34.1","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"identify_ad_shifters","repairSkill":"identify_ad_shifters","commonError":"Thinking every policy shifts AD right.","feedback":"A tax increase reduces spending and shifts aggregate demand left."},
{"id":29,"q":"Which curve is vertical in the long run?","options":["AD","SRAS","LRAS","Money demand"],"a":2,"tag":"lras","type":"definition","objective":"LO34.2","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"identify_lras","repairSkill":"identify_lras","commonError":"Confusing SRAS and LRAS.","feedback":"LRAS is vertical because long-run output depends on resources, capital, technology, and institutions."},
{"id":30,"q":"The short-run aggregate supply curve slopes upward mainly because:","options":["Wages, prices, or perceptions do not adjust instantly","Money is neutral in every period","Taxes cannot change","Output is fixed forever"],"a":0,"tag":"sras","type":"definition","objective":"LO34.2","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"explain_sras_upward","repairSkill":"explain_sras_upward","commonError":"Applying long-run neutrality to the short run.","feedback":"SRAS slopes upward because sticky wages, sticky prices, and misperceptions allow price-level changes to affect output."},
{"id":31,"q":"A decrease in oil prices would most likely shift:","options":["SRAS right","AD left","LRPC right","Money demand left"],"a":0,"tag":"sras_shifts","type":"interpretation","objective":"LO34.2","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"identify_sras_shifters","repairSkill":"identify_sras_shifters","commonError":"Treating production cost changes as AD shifts.","feedback":"Lower production costs shift short-run aggregate supply to the right."},
{"id":32,"q":"A sudden increase in oil prices is best treated as:","options":["A positive demand shock","An adverse supply shock","A movement along AD","A rightward LRAS shift"],"a":1,"tag":"supply_shocks","type":"interpretation","objective":"LO34.4","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"classify_supply_shock","repairSkill":"classify_supply_shock","commonError":"Calling an oil shock a demand shock.","feedback":"Higher oil prices raise production costs and shift SRAS left."},
{"id":33,"q":"A negative demand shock usually causes which short-run outcome?","options":["Higher output and higher prices","Lower output and lower prices","Lower output and higher prices","Higher output and lower prices"],"a":1,"tag":"demand_shocks","type":"interpretation","objective":"LO34.4","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"trace_demand_shock","repairSkill":"trace_demand_shock","commonError":"Confusing demand shocks with supply shocks.","feedback":"A leftward AD shift lowers output and the price level in the short run."},
{"id":34,"q":"An adverse supply shock usually causes which short-run outcome?","options":["Higher output and lower prices","Lower output and higher prices","Higher output and higher prices","Lower output and lower prices"],"a":1,"tag":"supply_shocks","type":"interpretation","objective":"LO34.4","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"trace_supply_shock","repairSkill":"trace_supply_shock","commonError":"Thinking all recessions lower inflation.","feedback":"An adverse supply shock lowers output and raises the price level."},
{"id":35,"q":"Stagflation means:","options":["Falling output with rising prices","Rising output with falling prices","Rising output with stable prices","Falling inflation with falling unemployment"],"a":0,"tag":"supply_shocks","type":"definition","objective":"LO34.4","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"define_stagflation","repairSkill":"define_stagflation","commonError":"Treating stagflation as any recession.","feedback":"Stagflation is the ugly combination of falling output and rising prices."},
{"id":36,"q":"Refer to the graph. Moving from AD1 to AD2 represents:","options":["A decrease in aggregate demand","An increase in aggregate demand","A decrease in SRAS","A shift of LRAS"],"a":1,"tag":"aggregate_demand","type":"interpretation","objective":"LO34.1","difficulty":"easy","conceptCluster":"ad_as_graphs","primarySkill":"read_ad_shift","repairSkill":"read_ad_shift","commonError":"Reversing left and right shifts of AD.","feedback":"AD2 lies to the right of AD1, so the graph shows an increase in aggregate demand.","image":"adas1.webp"},
{"id":37,"q":"Refer to the graph. Moving from AS2 to AS1 represents:","options":["A decrease in short-run aggregate supply","An increase in short-run aggregate supply","An increase in aggregate demand","A fall in money demand"],"a":0,"tag":"sras_shifts","type":"interpretation","objective":"LO34.2","difficulty":"easy","conceptCluster":"ad_as_graphs","primarySkill":"read_sras_shift","repairSkill":"read_sras_shift","commonError":"Reversing AS1 and AS2.","feedback":"AS1 is up and left of AS2, so moving from AS2 to AS1 is a decrease in SRAS.","image":"adas1.webp"},
{"id":38,"q":"Refer to the graph. At AD1 and AS2, the economy is at:","options":["Y2 and P2","Y1 and P1","Y3 and P2","Y1 and P3"],"a":1,"tag":"ad_as_graph_interpretation","type":"interpretation","objective":"LO34.4","difficulty":"easy","conceptCluster":"ad_as_graphs","primarySkill":"read_ad_as_equilibrium","repairSkill":"read_ad_as_equilibrium","commonError":"Reading the wrong intersection.","feedback":"AD1 and AS2 intersect at Y1 and P1.","image":"adas1.webp"},
{"id":39,"q":"Refer to the graph. At AD2 and AS2, the economy is at:","options":["Y1 and P3","Y3 and P2","Y2 and P2","Y1 and P1"],"a":2,"tag":"ad_as_graph_interpretation","type":"interpretation","objective":"LO34.4","difficulty":"easy","conceptCluster":"ad_as_graphs","primarySkill":"read_ad_as_equilibrium","repairSkill":"read_ad_as_equilibrium","commonError":"Ignoring the curve labels.","feedback":"AD2 and AS2 intersect at Y2 and P2.","image":"adas1.webp"},
{"id":40,"q":"Refer to the graph with LRAS. Which output level is natural output?","options":["Y3","Y2","P1","Y1"],"a":3,"tag":"lras","type":"interpretation","objective":"LO34.5","difficulty":"easy","conceptCluster":"ad_as_graphs","primarySkill":"identify_natural_output","repairSkill":"identify_natural_output","commonError":"Confusing natural output with the highest output shown.","feedback":"Natural output is where LRAS is located, which is Y1.","image":"adaslras.webp"},
{"id":41,"q":"Refer to the graph with LRAS. Output level Y2 is:","options":["Above natural output","Below natural output","Equal to natural output","A price level"],"a":0,"tag":"lras","type":"interpretation","objective":"LO34.5","difficulty":"easy","conceptCluster":"ad_as_graphs","primarySkill":"classify_output_gap","repairSkill":"classify_output_gap","commonError":"Ignoring LRAS when judging output gaps.","feedback":"Y2 is to the right of LRAS, so output is above natural output.","image":"adaslras.webp"},
{"id":42,"q":"Refer to the graph with LRAS. Output level Y3 is:","options":["Above natural output","Equal to natural output","Below natural output","A price level"],"a":2,"tag":"lras","type":"interpretation","objective":"LO34.5","difficulty":"easy","conceptCluster":"ad_as_graphs","primarySkill":"classify_output_gap","repairSkill":"classify_output_gap","commonError":"Ignoring LRAS when judging output gaps.","feedback":"Y3 is to the left of LRAS, so output is below natural output.","image":"adaslras.webp"},
{"id":43,"q":"If the economy is below natural output, unemployment is usually:","options":["Below the natural rate","Above the natural rate","Zero","Unrelated to output"],"a":1,"tag":"economic_fluctuations","type":"interpretation","objective":"LO34.4","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"connect_output_unemployment","repairSkill":"connect_output_unemployment","commonError":"Missing the link between output and unemployment.","feedback":"When output is below potential, unemployment is usually above the natural rate."},
{"id":44,"q":"In the long run, an economy returns to natural output because:","options":["Nominal wages and expectations adjust","AD becomes vertical","Money demand disappears","Taxes must equal zero"],"a":0,"tag":"long_run_adjustment","type":"definition","objective":"LO34.5","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Thinking short-run gaps last forever.","feedback":"Over time, wages, prices, and expectations adjust, moving output back toward natural output."},
{"id":45,"q":"A recessionary gap means output is:","options":["Above natural output","Below natural output","Equal to the price level","Always at Y2"],"a":1,"tag":"output_gaps","type":"definition","objective":"LO34.5","difficulty":"easy","conceptCluster":"ad_as","primarySkill":"classify_output_gap","repairSkill":"classify_output_gap","commonError":"Reversing recessionary and expansionary gaps.","feedback":"A recessionary gap occurs when output is below natural output."},
{"id":46,"q":"In liquidity preference theory, the interest rate adjusts to balance:","options":["Money supply and money demand","Taxes and spending","Imports and exports","Inflation and unemployment"],"a":0,"tag":"liquidity_preference","type":"definition","objective":"LO35.1","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"liquidity_preference_theory","repairSkill":"liquidity_preference_theory","commonError":"Confusing money-market equilibrium with fiscal balance.","feedback":"Liquidity preference theory says the interest rate adjusts to balance money supply and money demand."},
{"id":47,"q":"If the Fed increases the money supply, the interest rate usually:","options":["Rises","Falls","Becomes the price level","Equals unemployment"],"a":1,"tag":"monetary_policy","type":"interpretation","objective":"LO35.2","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"monetary_policy_transmission","repairSkill":"monetary_policy_transmission","commonError":"Reversing expansionary monetary policy.","feedback":"Increasing the money supply lowers the interest rate in the liquidity-preference model."},
{"id":48,"q":"If the Fed decreases the money supply, aggregate demand usually:","options":["Shifts right","Shifts left","Becomes vertical","Turns into SRAS"],"a":1,"tag":"monetary_policy","type":"interpretation","objective":"LO35.2","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"monetary_policy_ad_shift","repairSkill":"monetary_policy_ad_shift","commonError":"Reversing contractionary monetary policy.","feedback":"A lower money supply raises interest rates, reduces investment, and shifts AD left."},
{"id":49,"q":"Refer to the graph. Moving from MS1 to MS2 causes the interest rate to:","options":["Rise from r1 to r2","Fall from r2 to r1","Stay at r1","Become the price level"],"a":0,"tag":"money_supply_interest_rate","type":"interpretation","objective":"LO35.2","difficulty":"easy","conceptCluster":"policy_graphs","primarySkill":"read_money_market_shift","repairSkill":"read_money_market_shift","commonError":"Reversing money supply shifts and interest rates.","feedback":"MS2 is left of MS1, so the money supply falls and the interest rate rises from r1 to r2.","image":"ad_ms_md.webp"},
{"id":50,"q":"Refer to the graph. The move from AD1 to AD2 shows aggregate demand:","options":["Shifting right","Shifting left","Becoming SRAS","Becoming LRAS"],"a":1,"tag":"monetary_policy","type":"interpretation","objective":"LO35.2","difficulty":"easy","conceptCluster":"policy_graphs","primarySkill":"read_ad_shift","repairSkill":"read_ad_shift","commonError":"Reversing AD shifts.","feedback":"AD2 is to the left of AD1, so aggregate demand decreases.","image":"ad_ms_md.webp"},
{"id":51,"q":"Higher government spending usually shifts aggregate demand:","options":["Right","Left","Nowhere","Into LRAS"],"a":0,"tag":"fiscal_policy","type":"interpretation","objective":"LO35.3","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"fiscal_policy_ad_shift","repairSkill":"fiscal_policy_ad_shift","commonError":"Reversing expansionary fiscal policy.","feedback":"Higher government spending raises aggregate demand."},
{"id":52,"q":"A tax cut usually shifts aggregate demand:","options":["Left","Right","Down the SRPC only","Into money demand"],"a":1,"tag":"tax_policy","type":"interpretation","objective":"LO35.3","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"tax_cut_ad","repairSkill":"tax_cut_ad","commonError":"Confusing tax cuts and tax increases.","feedback":"A tax cut raises disposable income and consumption, shifting AD right."},
{"id":53,"q":"The multiplier effect means that government spending can shift AD by:","options":["Less than the initial spending only","More than the initial spending","Exactly zero","Only changing LRAS"],"a":1,"tag":"multiplier_effect","type":"definition","objective":"LO35.4","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"multiplier_effect","repairSkill":"multiplier_effect","commonError":"Ignoring induced consumption.","feedback":"The multiplier effect occurs when initial spending creates additional rounds of income and consumption."},
{"id":54,"q":"Crowding out occurs when fiscal expansion raises interest rates and reduces:","options":["Private investment","The price level","Money demand","The natural rate instantly"],"a":0,"tag":"crowding_out","type":"definition","objective":"LO35.4","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"crowding_out_effect","repairSkill":"crowding_out_effect","commonError":"Missing the interest-rate channel.","feedback":"Crowding out reduces private investment when fiscal expansion raises interest rates."},
{"id":55,"q":"If the MPC is 0.75, the simple government purchases multiplier is:","options":["4","0.75","1.33","7.5"],"a":0,"tag":"multiplier_effect","type":"calculation","objective":"LO35.4","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"calculate_spending_multiplier","repairSkill":"calculate_spending_multiplier","commonError":"Using MPC as the multiplier.","feedback":"The multiplier is 1/(1-MPC), so 1/(1-0.75)=4."},
{"id":56,"q":"A liquidity trap occurs when monetary policy has trouble stimulating AD because:","options":["Interest rates are near zero","Taxes are too low","LRAS is horizontal","M1 equals M2"],"a":0,"tag":"liquidity_trap","type":"definition","objective":"LO35.5","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"liquidity_trap","repairSkill":"liquidity_trap","commonError":"Thinking monetary policy is always equally powerful.","feedback":"In a liquidity trap, nominal interest rates are near zero, making traditional monetary stimulus weaker."},
{"id":57,"q":"An automatic stabilizer is best described as:","options":["A built-in response to the economy","A Fed bond sale","A permanent shift of LRAS","A fixed money multiplier"],"a":0,"tag":"automatic_stabilizers","type":"definition","objective":"LO35.5","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"automatic_stabilizers","repairSkill":"automatic_stabilizers","commonError":"Confusing automatic stabilizers with discretionary policy.","feedback":"Automatic stabilizers, such as taxes and transfer payments, respond automatically as conditions change."},
{"id":58,"q":"Policy lags matter because stabilization policy may:","options":["Arrive after conditions have already changed","Eliminate all inflation permanently","Stop all supply shocks","Make money neutral in the short run"],"a":0,"tag":"policy_lags","type":"definition","objective":"LO35.5","difficulty":"easy","conceptCluster":"policy_transmission","primarySkill":"policy_lags","repairSkill":"policy_lags","commonError":"Ignoring timing problems in stabilization policy.","feedback":"Policy can become destabilizing if it takes effect after the economy has already moved."},
{"id":59,"q":"The Phillips curve shows a short-run trade-off between:","options":["Inflation and unemployment","Taxes and spending","Money supply and money demand","Imports and exports"],"a":0,"tag":"phillips_curve","type":"definition","objective":"LO36.1","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"define_phillips_curve","repairSkill":"define_phillips_curve","commonError":"Confusing the Phillips curve with the money market.","feedback":"The short-run Phillips curve shows a trade-off between inflation and unemployment."},
{"id":60,"q":"On a standard Phillips curve graph, the vertical axis measures:","image":"srpc.webp","options":["Unemployment rate","Inflation rate","Real GDP","Money supply"],"a":1,"tag":"phillips_curve","type":"definition","objective":"LO36.1","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"read_pc_axes","repairSkill":"read_pc_axes","commonError":"Reversing the Phillips curve axes.","feedback":"The vertical axis measures the inflation rate."},
{"id":61,"q":"On a standard Phillips curve graph, the horizontal axis measures:","image":"srpc.webp","options":["Inflation rate","Price level","Unemployment rate","Money demand"],"a":2,"tag":"phillips_curve","type":"definition","objective":"LO36.1","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"read_pc_axes","repairSkill":"read_pc_axes","commonError":"Reversing the Phillips curve axes.","feedback":"The horizontal axis measures the unemployment rate."},
{"id":62,"q":"In the short run, expansionary policy usually moves the economy toward:","options":["Higher inflation and lower unemployment","Lower inflation and lower unemployment","Higher unemployment and lower inflation","No change in either variable"],"a":0,"tag":"policy_phillips","type":"interpretation","objective":"LO36.1","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"move_along_srpc","repairSkill":"move_along_srpc","commonError":"Missing the short-run tradeoff.","feedback":"Expansionary policy raises inflation pressure and lowers unemployment in the short run."},
{"id":63,"q":"In the short run, contractionary policy usually moves the economy toward:","options":["Higher inflation and lower unemployment","Lower inflation and higher unemployment","Higher inflation and higher unemployment","Lower unemployment and higher output"],"a":1,"tag":"policy_phillips","type":"interpretation","objective":"LO36.1","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"move_along_srpc","repairSkill":"move_along_srpc","commonError":"Reversing contractionary policy effects.","feedback":"Contractionary policy lowers inflation but raises unemployment in the short run."},
{"id":64,"q":"The long-run Phillips curve is vertical at:","options":["The natural rate of unemployment","Zero inflation","The money supply","The highest price level"],"a":0,"tag":"lrpc","type":"definition","objective":"LO36.2","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"identify_lrpc","repairSkill":"identify_lrpc","commonError":"Confusing SRPC with LRPC.","feedback":"The LRPC is vertical at the natural rate of unemployment."},
{"id":65,"q":"Refer to the graph. Which unemployment rate is the natural rate?","options":["U1","U2","U3","I1"],"a":1,"tag":"lrpc","type":"interpretation","objective":"LO36.2","difficulty":"easy","conceptCluster":"pc_graphs","primarySkill":"identify_natural_unemployment","repairSkill":"identify_natural_unemployment","commonError":"Ignoring the vertical LRPC.","feedback":"The LRPC is drawn at U2, so U2 is the natural rate of unemployment.","image":"lrpc.webp"},
{"id":66,"q":"Refer to the graph. Point a has:","options":["Lower unemployment and higher inflation than point c","Higher unemployment and lower inflation than point c","The same unemployment and lower inflation than point c","No inflation"],"a":0,"tag":"phillips_curve","type":"interpretation","objective":"LO36.1","difficulty":"easy","conceptCluster":"pc_graphs","primarySkill":"read_pc_points","repairSkill":"read_pc_points","commonError":"Reading the Phillips curve axes backward.","feedback":"Point a is at U1 and I2, while point c is at U2 and I1.","image":"lrpc.webp"},
{"id":67,"q":"Refer to the graph. Moving from point c to point a shows:","options":["Lower inflation and higher unemployment","Higher inflation and lower unemployment","Higher inflation and higher unemployment","Lower inflation and lower unemployment"],"a":1,"tag":"policy_phillips","type":"interpretation","objective":"LO36.1","difficulty":"easy","conceptCluster":"pc_graphs","primarySkill":"move_along_srpc","repairSkill":"move_along_srpc","commonError":"Reversing movement along SRPC.","feedback":"Moving from c to a raises inflation and lowers unemployment in the short run.","image":"lrpc.webp"},
{"id":68,"q":"Refer to the graph. Moving from point a to point b most likely shows:","options":["Expected inflation adjusting upward","Money demand disappearing","LRPC shifting left","Unemployment becoming zero"],"a":0,"tag":"expectations","type":"interpretation","objective":"LO36.3","difficulty":"easy","conceptCluster":"pc_graphs","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Thinking unemployment stays below natural permanently.","feedback":"After inflation expectations adjust upward, the SRPC shifts and unemployment returns to the natural rate at point b.","image":"lrpc.webp"},
{"id":69,"q":"If expected inflation rises, the short-run Phillips curve shifts:","options":["Down and left","Up and right","Into the AD curve","Into the money multiplier"],"a":1,"tag":"expectations","type":"definition","objective":"LO36.3","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Reversing expected inflation shifts.","feedback":"Higher expected inflation shifts the SRPC up and right."},
{"id":70,"q":"Refer to the graph. SRPC2 compared with SRPC1 represents:","options":["A higher expected inflation curve","A lower expected inflation curve","A lower natural rate only","A fall in money supply only"],"a":0,"tag":"expectations","type":"interpretation","objective":"LO36.3","difficulty":"easy","conceptCluster":"pc_graphs","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Missing that the higher SRPC reflects worse inflation expectations.","feedback":"SRPC2 is above SRPC1, meaning higher expected inflation or a worse tradeoff.","image":"srpc.webp"},
{"id":71,"q":"Refer to the graph. At U3, SRPC2 has inflation rate:","options":["I1","I2","I3","I4"],"a":3,"tag":"phillips_curve","type":"interpretation","objective":"LO36.2","difficulty":"easy","conceptCluster":"pc_graphs","primarySkill":"read_pc_points","repairSkill":"read_pc_points","commonError":"Reading the wrong curve at the same unemployment rate.","feedback":"At U3, the upper curve SRPC2 is at I4.","image":"srpc.webp"},
{"id":72,"q":"Refer to the graph. At U4 on SRPC1, inflation is:","options":["I1","I2","I3","I4"],"a":0,"tag":"phillips_curve","type":"interpretation","objective":"LO36.2","difficulty":"easy","conceptCluster":"pc_graphs","primarySkill":"read_pc_points","repairSkill":"read_pc_points","commonError":"Reading the upper curve instead of SRPC1.","feedback":"The lower point at U4 on SRPC1 is at I1.","image":"srpc.webp"},
{"id":73,"q":"An adverse supply shock shifts the short-run Phillips curve:","options":["Up and right","Down and left","Nowhere","Into LRAS"],"a":0,"tag":"supply_shock_pc","type":"interpretation","objective":"LO36.3","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Treating supply shocks as movement along the same SRPC.","feedback":"An adverse supply shock worsens the tradeoff by shifting the SRPC up and right."},
{"id":74,"q":"A surge in oil prices can cause inflation and unemployment to:","options":["Both rise","Both fall","Move in opposite directions only","Become zero"],"a":0,"tag":"supply_shock_pc","type":"interpretation","objective":"LO36.3","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Thinking inflation and unemployment always move opposite ways.","feedback":"A negative supply shock can raise inflation and unemployment together."},
{"id":75,"q":"If the Fed reduces money growth to fight inflation, unemployment usually:","options":["Falls immediately","Rises temporarily","Stays permanently at zero","Becomes the price level"],"a":1,"tag":"disinflation","type":"interpretation","objective":"LO36.4","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"disinflation_unemployment_cost","repairSkill":"disinflation_unemployment_cost","commonError":"Ignoring the short-run cost of disinflation.","feedback":"Disinflation usually raises unemployment temporarily as the economy moves along the SRPC."},
{"id":76,"q":"In the long run, unemployment returns to:","options":["The natural rate","Zero","The inflation rate","The money multiplier"],"a":0,"tag":"natural_rate_hypothesis","type":"definition","objective":"LO36.1","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"natural_rate_hypothesis","repairSkill":"natural_rate_hypothesis","commonError":"Thinking policymakers can permanently hold unemployment below natural.","feedback":"The natural-rate hypothesis says unemployment returns to its natural rate in the long run."},
{"id":77,"q":"The sacrifice ratio measures the output cost of reducing:","options":["Inflation","Unemployment","Money demand","Imports"],"a":0,"tag":"sacrifice_ratio","type":"definition","objective":"LO36.5","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"define_sacrifice_ratio","repairSkill":"define_sacrifice_ratio","commonError":"Confusing sacrifice ratio with unemployment rate.","feedback":"The sacrifice ratio measures how much output is lost when inflation is reduced."},
{"id":78,"q":"If the sacrifice ratio is 4 and inflation falls by 2 percentage points, the output cost is:","options":["2 percent of one year's output","4 percent of one year's output","8 percent of one year's output","16 percent of one year's output"],"a":2,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Adding instead of multiplying.","feedback":"The output cost is 4 x 2 = 8 percent of one year's output."},
{"id":79,"q":"Credible anti-inflation policy can reduce the sacrifice ratio by causing expected inflation to:","options":["Rise faster","Fall faster","Stay above actual inflation forever","Turn into unemployment"],"a":1,"tag":"sacrifice_ratio","type":"interpretation","objective":"LO36.5","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Ignoring expectations in disinflation.","feedback":"If expected inflation falls faster, the short-run cost of disinflation can be smaller."},
{"id":80,"q":"Which statement correctly connects AD-AS and the Phillips curve?","options":["Higher AD maps to lower unemployment and higher inflation on the SRPC","Higher AD always lowers inflation and unemployment","A supply shock only moves along AD","The LRPC slopes downward like SRPC"],"a":0,"tag":"ad_as_pc_integration","type":"interpretation","objective":"LO36.2","difficulty":"easy","conceptCluster":"phillips_curve","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Failing to connect output movements with unemployment movements.","feedback":"Expansionary AD pressure raises output and inflation in AD-AS and maps to lower unemployment with higher inflation on the short-run Phillips curve."}

medium: [
{"id":100,"q":"A student says credit card balances should be counted in M1 because people use cards to buy goods. What is the best correction?","options":["Credit cards are borrowing, not money balances","Credit cards are currency held by the public","Credit cards are checkable deposits","Credit cards are savings deposits"],"a":0,"tag":"m1_m2","type":"interpretation","objective":"LO30.1","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"distinguish_m1_m2","repairSkill":"distinguish_m1_m2","commonError":"Counting credit cards as money.","feedback":"Credit cards allow borrowing. They are not money balances like currency or checkable deposits."},
{"id":101,"q":"A household keeps cash because it wants to make purchases quickly, compare prices, and save some value for later. Which answer matches all three functions?","options":["Medium of exchange, unit of account, store of value","Store of value, reserve ratio, fiat money","Unit of account, leverage, discount rate","Medium of exchange, multiplier, bank capital"],"a":0,"tag":"money_functions","type":"interpretation","objective":"LO30.1","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"identify_money_functions","repairSkill":"identify_money_functions","commonError":"Mixing money functions with banking tools.","feedback":"Money buys goods, measures prices, and can transfer purchasing power into the future."},
{"id":102,"q":"A bank receives $2,000 in new deposits and faces a 10 percent reserve requirement. If it lends all excess reserves, its first new loan can be:","options":["$200","$1,800","$2,000","$20,000"],"a":1,"tag":"fractional_reserve","type":"calculation","objective":"LO30.3","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"calculate_excess_reserves","repairSkill":"calculate_excess_reserves","commonError":"Lending required reserves.","feedback":"Required reserves are $200, so excess reserves are $1,800."},
{"id":103,"q":"A bank has $50,000 in deposits and must hold 8 percent in reserves. Required reserves equal:","options":["$4,000","$6,250","$46,000","$54,000"],"a":0,"tag":"required_reserves","type":"calculation","objective":"LO30.3","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"calculate_required_reserves","repairSkill":"calculate_required_reserves","commonError":"Dividing deposits by the reserve requirement.","feedback":"Required reserves are $50,000 x 0.08 = $4,000."},
{"id":104,"q":"If the reserve requirement falls from 20 percent to 10 percent, the simple money multiplier:","options":["Falls from 10 to 5","Rises from 5 to 10","Stays fixed at 20","Falls from 20 to 10"],"a":1,"tag":"money_multiplier","type":"calculation","objective":"LO30.3","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"calculate_money_multiplier_effect","repairSkill":"calculate_money_multiplier_effect","commonError":"Thinking a lower reserve requirement lowers the multiplier.","feedback":"The multiplier is 1/rr. It rises from 5 to 10 when the reserve requirement falls from 0.20 to 0.10."},
{"id":105,"q":"If the Fed wants to reduce the money supply through open-market operations, it should:","options":["Buy bonds from banks","Sell bonds to the public","Lower reserve requirements","Lower the discount rate"],"a":1,"tag":"open_market_operations","type":"interpretation","objective":"LO30.4","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"choose_fed_tool_effect","repairSkill":"choose_fed_tool_effect","commonError":"Reversing open-market purchases and sales.","feedback":"Selling bonds pulls reserves out of the banking system and reduces the money supply."},
{"id":106,"q":"If banks decide to hold more excess reserves, the money creation process becomes:","options":["Stronger because lending rises","Weaker because lending falls","Unchanged because reserves do not matter","Infinite because deposits disappear"],"a":1,"tag":"limits_monetary_control","type":"interpretation","objective":"LO30.5","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"limits_of_monetary_control","repairSkill":"limits_of_monetary_control","commonError":"Ignoring bank behavior in monetary control.","feedback":"When banks hold more excess reserves, they lend less, so deposit creation weakens."},
{"id":107,"q":"A bank has assets of $1,000,000 and capital of $80,000. If assets fall by $40,000, bank capital becomes:","options":["$40,000","$80,000","$120,000","$960,000"],"a":0,"tag":"bank_capital","type":"calculation","objective":"LO30.5","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"bank_leverage_risk","repairSkill":"bank_leverage_risk","commonError":"Thinking losses reduce liabilities first.","feedback":"Losses reduce bank capital. $80,000 - $40,000 = $40,000."},
{"id":108,"q":"Which sequence correctly describes an open-market purchase?","options":["Fed buys bonds, reserves rise, money supply can expand","Fed sells bonds, reserves rise, lending expands","Fed buys bonds, reserves fall, money supply contracts","Fed sells bonds, reserves fall, money demand vanishes"],"a":0,"tag":"open_market_operations","type":"multi-step","objective":"LO30.4","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"choose_fed_tool_effect","repairSkill":"choose_fed_tool_effect","commonError":"Breaking the reserves-to-money-supply chain.","feedback":"A Fed bond purchase adds reserves and can support money supply expansion."},
{"id":109,"q":"A higher interest rate paid on reserves most directly encourages banks to:","options":["Hold more reserves","Hold fewer reserves","Ignore the Fed","Create commodity money"],"a":0,"tag":"interest_on_reserves","type":"interpretation","objective":"LO30.4","difficulty":"medium","conceptCluster":"money_banking","primarySkill":"interest_on_reserves_policy","repairSkill":"interest_on_reserves_policy","commonError":"Thinking interest on reserves always increases lending.","feedback":"Paying more on reserves makes holding reserves more attractive to banks."},
{"id":110,"q":"In the quantity equation, if M rises 5 percent, V is constant, and Y rises 2 percent, inflation is approximately:","options":["2 percent","3 percent","5 percent","7 percent"],"a":1,"tag":"quantity_theory","type":"calculation","objective":"LO31.1","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"quantity_equation","repairSkill":"quantity_equation","commonError":"Ignoring output growth.","feedback":"Inflation is approximately money growth plus velocity growth minus output growth: 5 + 0 - 2 = 3 percent."},
{"id":111,"q":"If velocity is stable and real output is fixed, a one-time doubling of the money supply should eventually:","options":["Double the price level","Cut the price level in half","Double real output","Eliminate inflation costs"],"a":0,"tag":"money_growth_inflation","type":"interpretation","objective":"LO31.1","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"money_growth_to_inflation","repairSkill":"money_growth_to_inflation","commonError":"Thinking money growth creates long-run real output growth.","feedback":"With velocity and output fixed, doubling money doubles the price level."},
{"id":112,"q":"If P rises from 2 to 4, the value of money changes from:","options":["1/2 to 1/4","1/4 to 1/2","2 to 4","4 to 8"],"a":0,"tag":"value_of_money","type":"calculation","objective":"LO31.1","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"value_of_money","repairSkill":"value_of_money","commonError":"Treating a higher price level as higher money value.","feedback":"The value of money is 1/P, so it falls from 1/2 to 1/4."},
{"id":113,"q":"If all nominal prices and wages double while relative prices stay unchanged, this illustrates:","options":["Monetary neutrality","Crowding out","A supply shock","A liquidity trap"],"a":0,"tag":"monetary_neutrality","type":"interpretation","objective":"LO31.2","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"monetary_neutrality","repairSkill":"monetary_neutrality","commonError":"Missing the real versus nominal distinction.","feedback":"Monetary neutrality says nominal variables can change while real variables remain unchanged in the long run."},
{"id":114,"q":"A worker earns $20 per hour and the price level is 5. The real wage is:","options":["4 units of output per hour","5 units of output per hour","20 units of output per hour","100 units of output per hour"],"a":0,"tag":"real_nominal_variables","type":"calculation","objective":"LO31.2","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"nominal_vs_real_variables","repairSkill":"nominal_vs_real_variables","commonError":"Multiplying instead of dividing by the price level.","feedback":"The real wage is W/P, so 20/5 = 4 units of output per hour."},
{"id":115,"q":"Expected inflation rises from 3 percent to 6 percent while the real interest rate stays at 2 percent. The nominal rate becomes:","options":["3 percent","5 percent","6 percent","8 percent"],"a":3,"tag":"fisher_effect","type":"calculation","objective":"LO31.3","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"fisher_effect","repairSkill":"fisher_effect","commonError":"Forgetting to add expected inflation to the real rate.","feedback":"Nominal interest rate equals real interest rate plus expected inflation, so 2 + 6 = 8 percent."},
{"id":116,"q":"Unexpected inflation helps borrowers and hurts lenders when:","options":["Loans were written before the inflation surprise","All contracts are indexed perfectly","Real wages rise automatically","Nominal prices cannot change"],"a":0,"tag":"inflation_redistribution","type":"interpretation","objective":"LO31.4","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"inflation_redistribution","repairSkill":"inflation_redistribution","commonError":"Missing redistribution from unexpected inflation.","feedback":"Borrowers repay with dollars that are worth less than lenders expected."},
{"id":117,"q":"Which example best fits menu costs?","options":["A firm pays to update price lists after inflation rises","A household visits the bank more often","A lender loses from unexpected inflation","A central bank buys bonds"],"a":0,"tag":"inflation_costs","type":"interpretation","objective":"LO31.4","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"menu_costs","repairSkill":"menu_costs","commonError":"Confusing menu costs with shoeleather costs.","feedback":"Menu costs are the costs of changing posted prices."},
{"id":118,"q":"Which example best fits shoeleather costs?","options":["A firm prints new menus","A worker compares nominal and real wages","A household makes extra bank transfers to hold less cash","A creditor gains from unexpected deflation"],"a":2,"tag":"inflation_costs","type":"interpretation","objective":"LO31.4","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"shoeleather_costs","repairSkill":"shoeleather_costs","commonError":"Confusing shoeleather costs with menu costs.","feedback":"Shoeleather costs come from actions people take to reduce money holdings during inflation."},
{"id":119,"q":"Why can heavy reliance on printing money become dangerous?","options":["It can create rapid inflation and reduce money's value","It guarantees higher real GDP forever","It eliminates all tax burdens","It makes nominal variables real"],"a":0,"tag":"inflation_tax","type":"interpretation","objective":"LO31.5","difficulty":"medium","conceptCluster":"inflation_money_growth","primarySkill":"inflation_tax","repairSkill":"inflation_tax","commonError":"Thinking printing money is costless financing.","feedback":"Printing money can finance spending, but it reduces the value of money and can create high inflation."},
{"id":120,"q":"A rise in the price level reduces consumption because money holdings buy less. This is the:","options":["Interest-rate effect","Wealth effect","Exchange-rate effect","Multiplier effect"],"a":1,"tag":"aggregate_demand","type":"interpretation","objective":"LO34.1","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"explain_ad_slope","repairSkill":"explain_ad_slope","commonError":"Confusing the three reasons AD slopes downward.","feedback":"The wealth effect works through reduced real purchasing power of money holdings."},
{"id":121,"q":"A rise in the price level raises money demand and interest rates, reducing investment. This is the:","options":["Wealth effect","Interest-rate effect","Exchange-rate effect","Sticky-wage theory"],"a":1,"tag":"aggregate_demand","type":"interpretation","objective":"LO34.1","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"explain_ad_slope","repairSkill":"explain_ad_slope","commonError":"Confusing AD slope effects with SRAS theories.","feedback":"The interest-rate effect explains how a higher price level reduces investment spending."},
{"id":122,"q":"If foreign incomes rise and foreigners buy more U.S. exports, U.S. aggregate demand should:","options":["Shift left","Shift right","Become vertical","Shift only SRAS"],"a":1,"tag":"aggregate_demand","type":"interpretation","objective":"LO34.1","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"identify_ad_shifters","repairSkill":"identify_ad_shifters","commonError":"Forgetting net exports are part of AD.","feedback":"Higher exports raise net exports and shift aggregate demand right."},
{"id":123,"q":"If firms become pessimistic and reduce investment spending, aggregate demand should:","options":["Shift right","Shift left","Shift SRAS right","Shift LRAS right"],"a":1,"tag":"aggregate_demand","type":"interpretation","objective":"LO34.1","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"identify_ad_shifters","repairSkill":"identify_ad_shifters","commonError":"Treating investment changes as supply changes.","feedback":"Lower investment reduces total spending and shifts AD left."},
{"id":124,"q":"Sticky-wage theory explains upward-sloping SRAS because unexpected price-level changes affect:","options":["Real labor costs and firm production decisions","Only the money multiplier","Only net exports","The vertical position of LRPC"],"a":0,"tag":"sras","type":"interpretation","objective":"LO34.3","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"explain_sras_upward","repairSkill":"explain_sras_upward","commonError":"Applying long-run neutrality to short-run wages.","feedback":"When nominal wages are sticky, price-level changes alter real labor costs and production."},
{"id":125,"q":"If expected prices rise, short-run aggregate supply usually shifts:","options":["Right because real wages fall","Left because production costs rise","Right because AD increases","Left because LRAS moves"],"a":1,"tag":"sras_shifts","type":"interpretation","objective":"LO34.3","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"expected_price_sras_shift","repairSkill":"expected_price_sras_shift","commonError":"Reversing expected price effects on SRAS.","feedback":"Higher expected prices push wages and costs upward, shifting SRAS left."},
{"id":126,"q":"A recession caused by falling consumer confidence is most directly a:","options":["Negative demand shock","Positive supply shock","Higher expected price shock","Long-run productivity shock"],"a":0,"tag":"demand_shocks","type":"interpretation","objective":"LO34.4","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"classify_demand_shock","repairSkill":"classify_demand_shock","commonError":"Calling lower spending a supply shock.","feedback":"Falling confidence reduces consumption and shifts AD left."},
{"id":127,"q":"An oil price spike causes output to fall and prices to rise. Which curve moved first?","options":["AD shifted right","AD shifted left","SRAS shifted left","LRAS shifted right"],"a":2,"tag":"supply_shocks","type":"interpretation","objective":"LO34.4","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"trace_supply_shock","repairSkill":"trace_supply_shock","commonError":"Treating stagflation as an AD shock.","feedback":"Higher oil prices raise production costs and shift SRAS left."},
{"id":128,"q":"Refer to the graph. If the economy moves from AD1-AS2 to AD2-AS2, what happens?","options":["Output rises and the price level rises","Output falls and the price level falls","Output rises and the price level falls","Output falls and the price level rises"],"a":0,"tag":"ad_as_graph_interpretation","type":"graph_interpretation","objective":"LO34.4","difficulty":"medium","conceptCluster":"ad_as_graphs","primarySkill":"read_ad_as_equilibrium","repairSkill":"read_ad_as_equilibrium","commonError":"Reading only one axis after an AD shift.","feedback":"The economy moves from Y1-P1 to Y2-P2, so both output and the price level rise.","image":"adas1.webp"},
{"id":129,"q":"Refer to the graph. If the economy moves from AD1-AS2 to AD1-AS1, what happens?","options":["Output rises and price level falls","Output falls and price level rises","Output rises and price level rises","Output falls and price level falls"],"a":1,"tag":"supply_shocks","type":"graph_interpretation","objective":"LO34.4","difficulty":"medium","conceptCluster":"ad_as_graphs","primarySkill":"trace_supply_shock","repairSkill":"trace_supply_shock","commonError":"Reading an SRAS left shift as lower prices.","feedback":"The economy moves from Y1-P1 to Y3-P2, so output falls and the price level rises.","image":"adas1.webp"},
{"id":130,"q":"Refer to the graph. If AD rises from AD1 to AD2 while SRAS rises from AS1 to AS2, the final point is:","options":["Y1 and P3","Y2 and P2","Y3 and P2","Y1 and P1"],"a":1,"tag":"ad_as_graph_interpretation","type":"graph_interpretation","objective":"LO34.4","difficulty":"medium","conceptCluster":"ad_as_graphs","primarySkill":"trace_combined_shocks","repairSkill":"trace_combined_shocks","commonError":"Tracking only one curve shift.","feedback":"AD2 and AS2 intersect at Y2 and P2.","image":"adas1.webp"},
{"id":131,"q":"Refer to the graph with LRAS. If the economy is at Y2, the main short-run concern is:","options":["Output is below potential","Output is above potential","There is no output gap","The price level is below zero"],"a":1,"tag":"output_gaps","type":"graph_interpretation","objective":"LO34.5","difficulty":"medium","conceptCluster":"ad_as_graphs","primarySkill":"classify_output_gap","repairSkill":"classify_output_gap","commonError":"Ignoring LRAS when judging gaps.","feedback":"Y2 is to the right of LRAS, so output is above potential." ,"image":"adaslras.webp"},
{"id":132,"q":"Refer to the graph with LRAS. If the economy is at Y3, unemployment is most likely:","options":["Below the natural rate","Above the natural rate","Equal to zero","Impossible to infer from output"],"a":1,"tag":"output_gaps","type":"graph_interpretation","objective":"LO34.5","difficulty":"medium","conceptCluster":"ad_as_graphs","primarySkill":"connect_output_unemployment","repairSkill":"connect_output_unemployment","commonError":"Missing the output-unemployment link.","feedback":"Y3 is below natural output, so unemployment is usually above the natural rate.","image":"adaslras.webp"},
{"id":133,"q":"Refer to the graph with LRAS. If the economy moves from AD1-AS2 to AD2-AS2, the short-run result is:","options":["An expansionary gap at Y2","A recessionary gap at Y3","Long-run equilibrium at Y1","A leftward SRAS shock"],"a":0,"tag":"output_gaps","type":"graph_interpretation","objective":"LO34.5","difficulty":"medium","conceptCluster":"ad_as_graphs","primarySkill":"classify_output_gap","repairSkill":"classify_output_gap","commonError":"Treating any AD increase as long-run equilibrium.","feedback":"The move ends at Y2, which is above natural output, creating an expansionary gap.","image":"adaslras.webp"},
{"id":134,"q":"Refer to the graph with LRAS. If the economy moves from AD1-AS2 to AD1-AS1, the short-run result is:","options":["Expansionary gap with lower prices","Recessionary gap with higher prices","Natural output with lower prices","Natural output with higher output"],"a":1,"tag":"supply_shocks","type":"graph_interpretation","objective":"LO34.4","difficulty":"medium","conceptCluster":"ad_as_graphs","primarySkill":"trace_supply_shock","repairSkill":"trace_supply_shock","commonError":"Missing stagflation from an adverse supply shock.","feedback":"The move ends at Y3 and P2: lower output, higher prices, and unemployment pressure.","image":"adaslras.webp"},
{"id":135,"q":"A boom in foreign economies raises net exports and pushes output above potential. In the long run, expected prices likely:","options":["Rise and shift SRAS left","Fall and shift SRAS right","Stay fixed forever","Shift AD farther right"],"a":0,"tag":"long_run_adjustment","type":"multi-step","objective":"LO34.5","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Thinking output stays above potential forever.","feedback":"When output is above potential, pressures raise expected prices and shift SRAS left over time."},
{"id":136,"q":"A negative demand shock pushes output below potential. If policymakers do nothing, long-run adjustment likely involves:","options":["Falling expected prices and SRAS shifting right","Rising expected prices and SRAS shifting left","LRAS shifting left permanently","AD becoming horizontal"],"a":0,"tag":"long_run_adjustment","type":"multi-step","objective":"LO34.5","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Missing self-correction through expectations.","feedback":"Below-potential output puts downward pressure on wages and expected prices, shifting SRAS right."},
{"id":137,"q":"Which policy would most directly offset a recessionary AD shock?","options":["Expansionary monetary or fiscal policy","Contractionary monetary policy","Lower labor productivity","Higher oil prices"],"a":0,"tag":"ad_as_policy","type":"interpretation","objective":"LO34.4","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Using contraction when AD is already weak.","feedback":"Expansionary policy can shift AD right to offset a recessionary demand shock."},
{"id":138,"q":"Which statement best describes an adverse supply shock policy problem?","options":["Policy faces a tradeoff between inflation and output losses","Policy can lower inflation and unemployment immediately","Fiscal expansion shifts SRAS right automatically","Monetary contraction raises output and lowers inflation"],"a":0,"tag":"supply_shocks","type":"trap","objective":"LO34.4","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Thinking supply shocks have an easy policy fix.","feedback":"A negative supply shock raises prices and lowers output, creating a nasty stabilization tradeoff."},
{"id":139,"q":"If a price-level increase raises money demand, the interest rate rises, and investment falls. This explains:","options":["Why AD slopes downward","Why LRAS slopes upward","Why SRPC shifts down","Why M2 excludes savings"],"a":0,"tag":"aggregate_demand","type":"multi-step","objective":"LO34.1","difficulty":"medium","conceptCluster":"ad_as","primarySkill":"explain_ad_slope","repairSkill":"explain_ad_slope","commonError":"Mixing the AD slope with policy shifts.","feedback":"This is the interest-rate effect behind the downward-sloping AD curve."},
{"id":140,"q":"Refer to the money-market graph. If the Fed moves from MS1 to MS2, the policy is:","options":["Expansionary monetary policy","Contractionary monetary policy","Expansionary fiscal policy","A positive supply shock"],"a":1,"tag":"monetary_policy","type":"graph_interpretation","objective":"LO35.2","difficulty":"medium","conceptCluster":"policy_graphs","primarySkill":"read_money_market_shift","repairSkill":"read_money_market_shift","commonError":"Reversing leftward money-supply shifts.","feedback":"MS2 is left of MS1, so the money supply falls and interest rates rise.","image":"ad_ms_md.webp"},
{"id":141,"q":"Refer to the money-market and AD graph. The move from MS1 to MS2 leads to:","options":["Lower r and higher AD","Higher r and lower AD","Higher r and higher AD","Lower r and lower AD"],"a":1,"tag":"policy_transmission","type":"graph_interpretation","objective":"LO35.2","difficulty":"medium","conceptCluster":"policy_graphs","primarySkill":"monetary_policy_transmission","repairSkill":"monetary_policy_transmission","commonError":"Breaking the interest-rate to AD chain.","feedback":"A lower money supply raises r, reducing investment and shifting AD left.","image":"ad_ms_md.webp"},
{"id":142,"q":"Refer to the money-market graph. Moving from MS1 to MS2 while staying on MD1 changes equilibrium from:","options":["e to g","g to e","a to d","c to f"],"a":1,"tag":"money_market_ad","type":"graph_interpretation","objective":"LO35.1","difficulty":"medium","conceptCluster":"policy_graphs","primarySkill":"read_money_market_shift","repairSkill":"read_money_market_shift","commonError":"Using the wrong money demand curve.","feedback":"On MD1, MS2 intersects at g and MS1 intersects at e, so a leftward money supply shift moves from g to e.","image":"moneyd2_moneys2.webp"},
