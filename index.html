{"id":9003,"q":"Refer to the graph with LRAS. Starting at AD2-AS2, expected prices adjust upward with no policy response. Which movement fits the model?","options":["SRAS shifts left toward AS1 and output returns toward Y1.","SRAS shifts right toward AS2 and output rises toward Y2.","AD shifts right toward AD2 and output remains above potential.","LRAS shifts right toward Y2 because actual output was high."],"a":0,"tag":"long_run_adjustment","type":"graph_integration","objective":"LO34.5","difficulty":"legendary","conceptCluster":"ad_as_graphs","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Confusing short-run output with long-run potential output.","feedback":"When output is above potential, rising expected prices shift SRAS left and return output toward LRAS.","image":"adaslras.webp"},
{"id":9004,"q":"Refer to the graph with LRAS. Starting at AD1-AS1, expected prices adjust downward with no policy response. Which movement fits the model?","options":["SRAS shifts right toward AS2 and output returns toward Y1.","SRAS shifts left toward AS1 and output falls toward Y3.","AD shifts left toward AD1 and prices rise toward P3.","LRAS shifts left toward Y3 because unemployment is high."],"a":0,"tag":"long_run_adjustment","type":"graph_integration","objective":"LO34.5","difficulty":"legendary","conceptCluster":"ad_as_graphs","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Moving LRAS instead of SRAS during self-correction.","feedback":"When output is below potential, falling expected prices shift SRAS right and restore output toward natural output.","image":"adaslras.webp"},
{"id":9005,"q":"The Custodian sees falling output, falling inflation, and rising unemployment. Which diagnosis and policy pairing is strongest?","options":["Negative AD shock; expansionary policy can shift AD back right.","Adverse supply shock; expansionary policy shifts SRAS right.","Positive AD shock; contractionary policy shifts AD farther right.","Favorable supply shock; contractionary policy raises output."],"a":0,"tag":"ad_as_pc_integration","type":"legendary_synthesis","objective":"LO36.2","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Confusing demand recessions with supply shocks.","feedback":"Falling output and falling inflation point to weak aggregate demand, which maps to higher unemployment and lower inflation."},
{"id":9006,"q":"The Custodian sees falling output, rising inflation, and rising unemployment. Which diagnosis should survive the first cut?","options":["Adverse supply shock or worsened SRPC tradeoff.","Positive demand shock with stable expected inflation.","Fiscal expansion with no supply-side pressure.","Favorable productivity shock with lower costs."],"a":0,"tag":"ad_as_pc_integration","type":"legendary_synthesis","objective":"LO36.3","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Treating all inflation as excess demand.","feedback":"Falling output with rising inflation and unemployment is supply-shock logic, not clean excess demand."},
{"id":9007,"q":"Refer to the LRPC graph. Starting at c, policymakers try to keep unemployment at U1 through repeated demand expansion. What eventually breaks the plan?","options":["Expected inflation rises and shifts the SRPC upward.","Actual inflation falls and shifts the SRPC downward.","The LRPC shifts left because inflation is higher.","The natural rate disappears because output rose once."],"a":0,"tag":"natural_rate_hypothesis","type":"graph_integration","objective":"LO36.1","difficulty":"legendary","conceptCluster":"pc_graphs","primarySkill":"natural_rate_hypothesis","repairSkill":"natural_rate_hypothesis","commonError":"Believing policymakers can permanently buy lower unemployment with inflation.","feedback":"Expansion can move unemployment below natural temporarily, but expected inflation adjusts and SRPC shifts upward.","image":"lrpc.webp"},
{"id":9008,"q":"Refer to the LRPC graph. Starting at b, the Fed credibly reduces money growth. Which path best shows disinflation with adjustment?","options":["b to d to c","b to a to c","b to c to a","b to d to b"],"a":0,"tag":"disinflation","type":"graph_integration","objective":"LO36.4","difficulty":"legendary","conceptCluster":"pc_graphs","primarySkill":"monetary_policy_pc_transition","repairSkill":"monetary_policy_pc_transition","commonError":"Skipping the short-run unemployment cost of disinflation.","feedback":"Disinflation moves from b to d first, then expected inflation falls and the economy returns to c.","image":"lrpc.webp"},
{"id":9009,"q":"Refer to the SRPC graph. The economy moves from SRPC1 to SRPC2. Which Custodian statement should be rejected?","options":["The tradeoff improved because higher inflation now buys lower unemployment at every point.","The tradeoff worsened because inflation is higher at a given unemployment rate.","Expected inflation may have increased and shifted the curve upward.","An adverse supply shock may have raised both inflation pressure and unemployment risk."],"a":0,"tag":"supply_shock_pc","type":"trap","objective":"LO36.3","difficulty":"legendary","conceptCluster":"pc_graphs","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Calling an upward SRPC shift an improvement.","feedback":"An upward SRPC shift worsens the tradeoff because inflation is higher at the same unemployment rate.","image":"srpc.webp"},
{"id":9010,"q":"The Fed wants lower inflation. Expected inflation is slow to adjust because the policy lacks credibility. Which assessment is strongest?","options":["Disinflation likely carries a higher sacrifice ratio.","Disinflation likely lowers unemployment immediately.","Expected inflation shifts SRPC downward instantly.","The long-run Phillips curve becomes downward sloping."],"a":0,"tag":"sacrifice_ratio","type":"legendary_synthesis","objective":"LO36.5","difficulty":"legendary","conceptCluster":"phillips_curve","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Ignoring credibility in disinflation costs.","feedback":"If expected inflation adjusts slowly, reducing inflation requires more output and employment pain."},
{"id":9011,"q":"The Fed announces disinflation, wage contracts adjust quickly, and expected inflation falls before output drops much. Which assessment is strongest?","options":["The sacrifice ratio is likely lower than with slow expectations adjustment.","The sacrifice ratio is likely higher because credibility raises unemployment.","The LRPC shifts right because inflation expectations fall quickly.","The SRPC shifts upward because disinflation reduces actual inflation."],"a":0,"tag":"sacrifice_ratio","type":"legendary_synthesis","objective":"LO36.5","difficulty":"legendary","conceptCluster":"phillips_curve","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Missing how credibility lowers disinflation costs.","feedback":"Credibility can lower the cost of disinflation by moving expected inflation down faster."},
{"id":9012,"q":"A student says a tax cut always creates the full multiplier effect. Which Custodian correction is best?","options":["The final AD shift depends on MPC, saving, expectations, and crowding out.","The final AD shift ignores MPC because taxes only affect SRAS.","The final AD shift must equal zero because fiscal policy cannot shift AD.","The final AD shift becomes infinite when interest rates rise."],"a":0,"tag":"fiscal_policy","type":"legendary_synthesis","objective":"LO35.4","difficulty":"legendary","conceptCluster":"policy_transmission","primarySkill":"fiscal_policy_magnitude","repairSkill":"fiscal_policy_magnitude","commonError":"Treating the simple multiplier as the guaranteed final effect.","feedback":"The simple multiplier can be weakened by saving behavior, expectations, and crowding out."},
{"id":9013,"q":"Congress expands spending during a recession, but the Fed tightens to fight inflation expectations. Which assessment is strongest?","options":["Fiscal stimulus may be offset because higher rates weaken investment and AD.","Fiscal stimulus must fully work because monetary policy cannot affect AD.","Fiscal stimulus shifts SRAS right because higher rates lower production costs.","Fiscal stimulus lowers expected inflation because government spending always reduces prices."],"a":0,"tag":"stabilization_policy","type":"legendary_synthesis","objective":"LO35.5","difficulty":"legendary","conceptCluster":"policy_transmission","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Ignoring fiscal-monetary policy interaction.","feedback":"Monetary tightening can offset fiscal expansion by raising interest rates and reducing investment."},
{"id":9014,"q":"Refer to the money-market and AD graph. The Fed shifts MS left while the economy is already below potential. What is the likely policy risk?","options":["Interest rates rise, AD falls, and the recessionary gap worsens.","Interest rates fall, AD rises, and inflation disappears cleanly.","Interest rates rise, SRAS shifts right, and output returns to potential.","Interest rates fall, LRAS shifts left, and unemployment returns to natural."],"a":0,"tag":"monetary_policy","type":"graph_integration","objective":"LO35.2","difficulty":"legendary","conceptCluster":"policy_graphs","primarySkill":"monetary_policy_transmission","repairSkill":"monetary_policy_transmission","commonError":"Missing the danger of tightening into weak demand.","feedback":"A lower money supply raises interest rates and shifts AD left, which can worsen a recessionary gap.","image":"ad_ms_md.webp"},
{"id":9015,"q":"Refer to the money-market graph. Income rises, money demand shifts right, and the Fed holds money supply fixed. What memo is strongest?","options":["Interest rates rise unless the Fed increases money supply.","Interest rates fall because higher income lowers money demand.","Interest rates stay fixed because money demand cannot shift.","Interest rates fall because fixed money supply means more lending."],"a":0,"tag":"liquidity_preference","type":"graph_integration","objective":"LO35.1","difficulty":"legendary","conceptCluster":"policy_graphs","primarySkill":"money_demand_interest_rate","repairSkill":"money_demand_interest_rate","commonError":"Reversing income effects on money demand.","feedback":"Higher income raises money demand; with fixed money supply, interest rates rise.","image":"moneyd2_moneys2.webp"},
{"id":9016,"q":"Refer to the money-market graph. Money demand rises while the Fed increases money supply. Which conclusion is safest?","options":["The interest-rate effect is ambiguous without knowing relative shift sizes.","Interest rates must rise because money demand always dominates.","Interest rates must fall because money supply always dominates.","Interest rates must stay fixed because both curves shifted."],"a":0,"tag":"liquidity_preference","type":"graph_integration","objective":"LO35.1","difficulty":"legendary","conceptCluster":"policy_graphs","primarySkill":"read_money_market_equilibrium","repairSkill":"read_money_market_equilibrium","commonError":"Assuming one shift always dominates.","feedback":"When money demand and money supply both increase, the interest-rate effect depends on which shift is larger.","image":"moneyd2_moneys2.webp"},
{"id":9017,"q":"The economy is below potential, but inflation expectations are rising. Which policy judgment is strongest?","options":["Stimulus may support output but could validate inflation expectations.","Tightening always raises output because expectations matter more than AD.","Stimulus shifts LRAS right and lowers expected inflation automatically.","Doing nothing guarantees lower unemployment and lower inflation immediately."],"a":0,"tag":"stabilization_policy","type":"legendary_synthesis","objective":"LO35.5","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Ignoring the conflict between output stabilization and expectations.","feedback":"When output is weak but expectations are rising, policy faces a tradeoff between demand support and inflation credibility."},
{"id":9018,"q":"A policymaker says, 'Inflation is high, so unemployment must be low.' What is the best correction?","options":["That only fits demand pressure; supply shocks can raise inflation and unemployment together.","That is always true because the Phillips curve never shifts.","That is false only when M1 is larger than M2.","That is true in the long run because LRPC slopes downward."],"a":0,"tag":"supply_shock_pc","type":"trap","objective":"LO36.3","difficulty":"legendary","conceptCluster":"phillips_curve","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Treating the Phillips curve as fixed under every shock.","feedback":"The short-run tradeoff can worsen when SRPC shifts up, so inflation and unemployment can rise together."},
{"id":9019,"q":"The economy has high inflation and unemployment above natural. The Fed expands AD to lower unemployment. What danger follows?","options":["Unemployment may improve temporarily, but inflation and expectations can worsen.","Inflation must fall because higher AD lowers production costs.","Unemployment must stay below natural because expectations cannot change.","The LRPC shifts left because actual inflation is higher."],"a":0,"tag":"ad_as_pc_integration","type":"legendary_synthesis","objective":"LO36.4","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Ignoring expectations after accommodation.","feedback":"AD expansion can reduce unemployment temporarily but may worsen inflation and expected inflation."},
{"id":9020,"q":"Inflation falls from 10 percent to 6 percent. Output loss is 18 percent of one year's GDP. What does the sacrifice ratio imply?","options":["The sacrifice ratio is 4.5, showing a costly disinflation.","The sacrifice ratio is 2.5, showing a mild disinflation.","The sacrifice ratio is 16, showing no output cost.","The sacrifice ratio is 24, showing inflation rose."],"a":0,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"legendary","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Dividing by the wrong inflation change.","feedback":"Inflation falls by 4 points, and 18/4 = 4.5."},
{"id":9021,"q":"A disinflation reduces inflation by 5 points. The sacrifice ratio is 2.8. Which output cost should the Custodian expect?","options":["14 percent of one year's output","7.8 percent of one year's output","2.2 percent of one year's output","28 percent of one year's output"],"a":0,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"legendary","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Adding instead of multiplying.","feedback":"Output loss equals sacrifice ratio times inflation reduction, so 2.8 x 5 = 14 percent."},
{"id":9022,"q":"A student says expansionary monetary policy raises AD by directly increasing government purchases. What is the best correction?","options":["Monetary policy works mainly through money supply, interest rates, and investment.","Monetary policy works by changing G before interest rates can move.","Monetary policy works only by shifting LRAS through technology.","Monetary policy works by raising taxes and lowering consumption."],"a":0,"tag":"monetary_policy","type":"trap","objective":"LO35.2","difficulty":"legendary","conceptCluster":"policy_transmission","primarySkill":"monetary_policy_transmission","repairSkill":"monetary_policy_transmission","commonError":"Confusing monetary and fiscal policy channels.","feedback":"Monetary policy affects AD primarily through money supply, interest rates, and investment spending."},
{"id":9023,"q":"A student says fiscal expansion raises AD and therefore can never crowd out investment. What is the best correction?","options":["Fiscal expansion can raise AD while higher rates reduce private investment.","Fiscal expansion lowers rates because government borrowing reduces money demand.","Fiscal expansion shifts SRAS right because firms face lower costs.","Fiscal expansion eliminates the multiplier because taxes disappear."],"a":0,"tag":"crowding_out","type":"trap","objective":"LO35.4","difficulty":"legendary","conceptCluster":"policy_transmission","primarySkill":"crowding_out_effect","repairSkill":"crowding_out_effect","commonError":"Thinking multiplier effects rule out crowding out.","feedback":"Fiscal expansion can increase AD, but rising interest rates can reduce investment and offset part of the effect."},
{"id":9024,"q":"Refer to the AD multiplier graph. The Custodian sees AD1 to AD2, then AD2 to AD3, then a partial move back. Which interpretation fits?","options":["Initial fiscal shift, multiplier expansion, then crowding out offset.","Initial monetary contraction, SRAS expansion, then LRPC adjustment.","Initial supply shock, expected price decline, then AD collapse.","Initial inflation tax, M1 expansion, then velocity collapse."],"a":0,"tag":"crowding_out","type":"graph_integration","objective":"LO35.4","difficulty":"legendary","conceptCluster":"policy_graphs","primarySkill":"crowding_out_effect","repairSkill":"crowding_out_effect","commonError":"Confusing multiplier and crowding-out stages.","feedback":"Fiscal policy can shift AD right, the multiplier can push it farther, and crowding out can pull the final effect back.","image":"moneymultiplier.webp"},
{"id":9025,"q":"A country doubles money growth, but output growth also rises sharply and velocity falls. Which warning is strongest?","options":["Do not infer inflation from money growth alone when V and Y change.","Inflation must double because money growth always maps one-for-one.","Inflation must be zero because output growth always dominates.","Inflation must equal velocity growth because money is neutral."],"a":0,"tag":"quantity_theory","type":"legendary_synthesis","objective":"LO31.1","difficulty":"legendary","conceptCluster":"inflation_money_growth","primarySkill":"quantity_equation","repairSkill":"quantity_equation","commonError":"Using money growth alone without velocity and output.","feedback":"The quantity equation requires considering money growth, velocity growth, and real output growth together."},
{"id":9026,"q":"A government finances deficits by printing money. Inflation rises, nominal rates rise, and real balances lose value. Which memo is strongest?","options":["The inflation tax reduces money value and expected inflation raises nominal rates.","The policy raises real output permanently because money growth lowers real wages forever.","The policy lowers nominal rates because inflation makes borrowing cheaper for all lenders.","The policy leaves money value unchanged because fiat money has no intrinsic value."],"a":0,"tag":"inflation_policy","type":"legendary_synthesis","objective":"LO31.5","difficulty":"legendary","conceptCluster":"inflation_money_growth","primarySkill":"inflation_tax","repairSkill":"inflation_tax","commonError":"Treating money creation as painless finance.","feedback":"Printing money can impose an inflation tax, and higher expected inflation raises nominal rates through the Fisher effect."},
{"id":9027,"q":"A student says nominal wages rose 8 percent, so workers are better off. Inflation was 11 percent. What correction survives?","options":["Real wages fell because prices rose faster than nominal wages.","Real wages rose because nominal wages increased above zero.","Real wages were unchanged because all inflation is neutral immediately.","Real wages doubled because nominal wages are measured in dollars."],"a":0,"tag":"real_nominal_variables","type":"trap","objective":"LO31.2","difficulty":"legendary","conceptCluster":"inflation_money_growth","primarySkill":"nominal_vs_real_variables","repairSkill":"nominal_vs_real_variables","commonError":"Confusing nominal wage growth with real wage growth.","feedback":"Real wage growth is approximately nominal wage growth minus inflation, so workers lost purchasing power."},
{"id":9028,"q":"A bank's assets fall slightly, but its capital is thin. Why can the damage be large?","options":["Leverage means asset losses hit capital disproportionately.","Liquidity means deposits cannot affect balance sheets.","Fiat money means losses become nominal only.","M2 means capital includes savings deposits."],"a":0,"tag":"bank_capital","type":"legendary_synthesis","objective":"LO30.5","difficulty":"legendary","conceptCluster":"money_banking","primarySkill":"bank_leverage_risk","repairSkill":"bank_leverage_risk","commonError":"Missing how leverage magnifies capital losses.","feedback":"With high leverage, even small asset losses can wipe out a large share of bank capital."},
{"id":9029,"q":"The Fed lowers reserve requirements, but borrowers are weak and banks are cautious. Which warning is strongest?","options":["The potential multiplier rises, but actual money creation may remain weak.","The actual multiplier must rise fully because reserve rules changed.","The money supply must fall because lower reserves reduce deposits.","The natural rate must fall because banks can lend more."],"a":0,"tag":"limits_monetary_control","type":"legendary_synthesis","objective":"LO30.5","difficulty":"legendary","conceptCluster":"money_banking","primarySkill":"limits_of_monetary_control","repairSkill":"limits_of_monetary_control","commonError":"Treating the simple multiplier as automatic.","feedback":"A lower reserve requirement increases lending potential, but actual lending depends on banks and borrowers."},
{"id":9030,"q":"The economy is below potential. Fiscal expansion begins, but interest rates rise and inflation expectations increase. Which memo should the Custodian accept?","options":["The policy may close part of the gap, but crowding out and expectations weaken the case.","The policy permanently lowers unemployment because the SRPC becomes the LRPC.","The policy shifts SRAS right because higher AD lowers production costs.","The policy has no effect because fiscal policy cannot move AD."],"a":0,"tag":"stabilization_policy","type":"chancellor_memo","objective":"LO35.4","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Ignoring crowding out and expectations.","feedback":"Fiscal expansion can support AD, but crowding out and rising inflation expectations can reduce or complicate the effect."},
{"id":9031,"q":"The economy is above potential. Inflation is rising, but unemployment is low. Which Custodian memo is strongest?","options":["Tighten demand or allow SRAS adjustment; output above potential is not a stable long-run position.","Expand demand further because low unemployment proves the natural rate has fallen.","Hold policy fixed because high inflation guarantees permanently low unemployment.","Shift money demand right because higher rates raise investment."],"a":0,"tag":"ad_as_pc_integration","type":"chancellor_memo","objective":"LO36.4","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Treating short-run low unemployment as permanent.","feedback":"Above-potential output creates inflation pressure and eventually triggers expectation adjustment."},
{"id":9032,"q":"The economy is below potential after an adverse supply shock. Inflation is still high. Which Custodian memo is strongest?","options":["There is no clean fix; AD stimulus helps output but risks inflation, while tightening fights inflation but worsens output.","Expansionary fiscal policy is riskless because any recession means inflation must fall immediately.","Contractionary monetary policy is riskless because lower AD shifts SRAS right automatically.","Doing nothing instantly returns output to potential because supply shocks cannot affect employment."],"a":0,"tag":"supply_shocks","type":"chancellor_memo","objective":"LO34.4","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Thinking supply shocks behave like demand recessions.","feedback":"Adverse supply shocks create a policy bind: supporting output can worsen inflation, while fighting inflation can worsen unemployment."},
{"id":9033,"q":"Inflation has been high for several years. The Fed wants lower inflation but private agents doubt the policy will last. Which memo is strongest?","options":["The SRPC may not shift down quickly, so disinflation likely requires more output loss.","The LRPC shifts left immediately because credibility is low and inflation is high.","The SRPC shifts up less because doubt makes expected inflation fall faster.","The sacrifice ratio becomes zero because policy announcements replace output adjustment."],"a":0,"tag":"sacrifice_ratio","type":"chancellor_memo","objective":"LO36.5","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"interpret_sacrifice_ratio","repairSkill":"interpret_sacrifice_ratio","commonError":"Assuming announced disinflation is automatically credible.","feedback":"If expected inflation remains high, disinflation is more costly."},
{"id":9034,"q":"The Custodian asks whether a high-inflation economy can choose permanently lower unemployment by accepting higher inflation. Which answer survives?","options":["No; the short-run tradeoff disappears once expected inflation adjusts.","Yes; the SRPC becomes permanent when inflation exceeds expected inflation.","Yes; the LRPC slopes downward when inflation is stable.","No; monetary policy cannot affect unemployment even temporarily."],"a":0,"tag":"natural_rate_hypothesis","type":"chancellor_memo","objective":"LO36.1","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"natural_rate_hypothesis","repairSkill":"natural_rate_hypothesis","commonError":"Confusing temporary and permanent Phillips curve effects.","feedback":"The short-run tradeoff is temporary; expected inflation adjusts and unemployment returns to natural."},
{"id":9035,"q":"The Custodian sees AD rising, output above potential, unemployment below natural, and expected inflation beginning to rise. Which final warning is strongest?","options":["The short-run gain is becoming a long-run inflation problem.","The economy has permanently increased natural output.","The SRPC is shifting downward because inflation rose.","The money multiplier has eliminated unemployment."],"a":0,"tag":"ad_as_pc_integration","type":"chancellor_memo","objective":"LO36.3","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Missing the expectation adjustment after demand expansion.","feedback":"A demand-driven boom can reduce unemployment temporarily, but rising expected inflation shifts the SRPC upward and erodes the gain."},
{"id":9036,"q":"The economy begins at natural output. A stock market boom raises consumption and investment, while expected prices have not yet adjusted. Which memo should the Custodian accept?","options":["AD shifts right, output rises above potential, and inflation rises in the short run.","SRAS shifts right, output rises above potential, and inflation falls in the short run.","LRAS shifts right, unemployment falls permanently, and inflation stays fixed.","AD shifts left, output falls below potential, and inflation rises in the short run."],"a":0,"tag":"aggregate_demand","type":"chancellor_memo","objective":"LO34.4","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"trace_demand_shock","repairSkill":"trace_demand_shock","commonError":"Confusing a demand boom with a supply improvement.","feedback":"A stock market boom can raise spending and shift AD right, raising output and prices in the short run."},
{"id":9037,"q":"The economy begins at natural output. A major input shortage raises production costs. The Custodian wants to know why this is not a normal recession. Which memo is strongest?","options":["Output falls, but the price level rises, so the shock is supply-side stagflation.","Output falls and the price level falls, so the shock is weak aggregate demand.","Output rises and inflation rises, so the shock is expansionary demand pressure.","Output rises and inflation falls, so the shock is favorable supply growth."],"a":0,"tag":"supply_shocks","type":"chancellor_memo","objective":"LO34.4","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"trace_supply_shock","repairSkill":"trace_supply_shock","commonError":"Treating every recession as weak demand.","feedback":"A negative supply shock lowers output while raising prices, which creates stagflation."},
{"id":9038,"q":"Refer to the graph. Starting at AD1-AS2, AD shifts to AD2 and SRAS shifts to AS1. Which Custodian note is correct?","options":["Output stays at Y1, but the price level rises from P1 to P3.","Output rises to Y2, and the price level stays fixed at P2.","Output falls to Y3, and the price level falls from P2 to P1.","Output stays at Y1, and the price level falls from P3 to P1."],"a":0,"tag":"ad_as_graph_interpretation","type":"graph_integration","objective":"LO34.4","difficulty":"legendary","conceptCluster":"ad_as_graphs","primarySkill":"trace_combined_shocks","repairSkill":"trace_combined_shocks","commonError":"Following only one curve shift.","feedback":"AD2 and AS1 intersect at Y1 and P3, so output returns to Y1 while the price level rises.","image":"adas1.webp"},
{"id":9039,"q":"Refer to the graph. Starting at AD2-AS1, AD shifts to AD1 and SRAS shifts to AS2. Which Custodian note is correct?","options":["Output stays at Y1, but the price level falls from P3 to P1.","Output falls to Y3, while the price level stays at P2.","Output rises to Y2, while the price level rises to P3.","Output stays at Y1, and the price level rises from P1 to P3."],"a":0,"tag":"ad_as_graph_interpretation","type":"graph_integration","objective":"LO34.4","difficulty":"legendary","conceptCluster":"ad_as_graphs","primarySkill":"trace_combined_shocks","repairSkill":"trace_combined_shocks","commonError":"Missing offsetting output effects from two shifts.","feedback":"AD1 and AS2 intersect at Y1 and P1, so output returns to Y1 and prices fall from P3 to P1.","image":"adas1.webp"},
{"id":9040,"q":"A recessionary gap appears after AD falls. The Custodian asks whether waiting can restore output. Which answer survives?","options":["Yes, if wages and expected prices fall enough to shift SRAS right.","Yes, if expected prices rise enough to shift SRAS left.","No, because output gaps cannot close without fiscal expansion.","No, because LRAS must shift left to meet actual output."],"a":0,"tag":"long_run_adjustment","type":"chancellor_memo","objective":"LO34.5","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Missing long-run self-correction after weak demand.","feedback":"A recessionary gap can close over time if lower wages and expected prices shift SRAS right."},
{"id":9041,"q":"An expansionary gap appears after AD rises. The Custodian asks why unemployment cannot stay below natural forever. Which answer survives?","options":["Rising wages and expected prices shift SRAS left and return output to potential.","Falling wages and expected prices shift SRAS right and increase output further.","The LRPC shifts right because unemployment was temporarily low.","The money multiplier rises and permanently lowers the natural rate."],"a":0,"tag":"long_run_adjustment","type":"chancellor_memo","objective":"LO34.5","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Treating expansionary gaps as permanent growth.","feedback":"When output is above potential, wages and expected prices rise, shifting SRAS left and restoring natural output."},
{"id":9042,"q":"Refer to the money-market graph. Money demand rises because income rises, while the Fed cuts the money supply. Which memo is strongest?","options":["Both forces push interest rates upward and pressure AD downward.","Both forces push interest rates downward and pressure AD upward.","Money demand raises rates, but lower money supply lowers rates.","Money demand lowers rates, but lower money supply raises rates."],"a":0,"tag":"money_market_ad","type":"graph_integration","objective":"LO35.1","difficulty":"legendary","conceptCluster":"policy_graphs","primarySkill":"money_demand_interest_rate","repairSkill":"money_demand_interest_rate","commonError":"Missing that both shifts raise interest rates.","feedback":"Higher money demand and lower money supply both raise interest rates, weakening investment and AD.","image":"moneyd2_moneys2.webp"},
{"id":9043,"q":"Refer to the money-market graph. Money demand falls while the Fed expands money supply. Which memo is strongest?","options":["Both forces push interest rates downward and support AD.","Both forces push interest rates upward and weaken AD.","Money demand lowers rates, but higher money supply raises rates.","Money demand raises rates, but higher money supply lowers rates."],"a":0,"tag":"money_market_ad","type":"graph_integration","objective":"LO35.1","difficulty":"legendary","conceptCluster":"policy_graphs","primarySkill":"money_demand_interest_rate","repairSkill":"money_demand_interest_rate","commonError":"Missing that both shifts lower interest rates.","feedback":"Lower money demand and higher money supply both push interest rates down, supporting investment and AD.","image":"moneyd2_moneys2.webp"},
{"id":9044,"q":"A fiscal expansion is launched when the economy is already above potential. The central bank does nothing. Which risk should the Custodian flag?","options":["The policy may worsen inflation pressure and force later SRAS adjustment.","The policy must lower inflation because government spending reduces prices.","The policy shifts LRAS right because output is already high.","The policy lowers expected inflation because unemployment is below natural."],"a":0,"tag":"stabilization_policy","type":"chancellor_memo","objective":"LO35.5","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Ignoring the starting output gap.","feedback":"Stimulus when output is already above potential can worsen inflation pressure."},
{"id":9045,"q":"The economy is below potential, but the main cause is an oil shock rather than weak spending. Which mistake should the Custodian avoid?","options":["Treating the problem as a simple AD shortfall with no inflation tradeoff.","Recognizing that output is weak while prices are under upward pressure.","Seeing that fiscal stimulus may help output but worsen inflation.","Noting that the Phillips curve tradeoff has likely worsened."],"a":0,"tag":"supply_shocks","type":"trap","objective":"LO34.4","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Misdiagnosing a supply shock as ordinary weak demand.","feedback":"An oil shock is not a clean demand recession; policy must account for inflation pressure."},
{"id":9046,"q":"Refer to the LRPC graph. The economy moves from c to a, then policymakers mistake a as sustainable. What is the likely correction?","options":["Expected inflation rises, SRPC shifts up, and the economy moves toward b.","Expected inflation falls, SRPC shifts down, and the economy moves toward d.","The natural rate falls, LRPC shifts left, and the economy stays at a.","The price level falls, AD shifts left, and unemployment stays at U1."],"a":0,"tag":"natural_rate_hypothesis","type":"graph_integration","objective":"LO36.1","difficulty":"legendary","conceptCluster":"pc_graphs","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Treating a short-run Phillips curve point as permanent.","feedback":"Point a is temporary. Expected inflation adjusts upward and the economy returns to the natural rate at higher inflation.","image":"lrpc.webp"},
{"id":9047,"q":"Refer to the LRPC graph. The economy moves from b to d during disinflation. What must happen for it to reach c?","options":["Expected inflation must fall enough to shift SRPC downward.","Expected inflation must rise enough to shift SRPC upward.","The natural rate must rise enough to shift LRPC right.","Actual inflation must rise above expected inflation again."],"a":0,"tag":"disinflation","type":"graph_integration","objective":"LO36.4","difficulty":"legendary","conceptCluster":"pc_graphs","primarySkill":"monetary_policy_pc_transition","repairSkill":"monetary_policy_pc_transition","commonError":"Missing the expectation adjustment needed after disinflation.","feedback":"After contractionary policy, expected inflation must fall for the SRPC to shift downward and return unemployment to natural.","image":"lrpc.webp"},
{"id":9048,"q":"Refer to the SRPC graph. The Custodian sees the economy on SRPC2 instead of SRPC1. Which conclusion is most careful?","options":["The tradeoff worsened, but the cause could be expected inflation or a supply shock.","The tradeoff improved, and policymakers can now lower unemployment without cost.","The LRPC shifted left, so natural unemployment must have fallen.","AD must have shifted right, so SRPC cannot have moved."],"a":0,"tag":"expectations","type":"graph_integration","objective":"LO36.3","difficulty":"legendary","conceptCluster":"pc_graphs","primarySkill":"expected_inflation_shift","repairSkill":"expected_inflation_shift","commonError":"Assuming every SRPC shift has only one cause.","feedback":"An upward SRPC shift can come from higher expected inflation or an adverse supply shock, and both worsen the tradeoff.","image":"srpc.webp"},
{"id":9049,"q":"The Fed reduces inflation from 9 percent to 5 percent. Output loss equals 10 percent of one year's GDP. Which memo is strongest?","options":["The sacrifice ratio is 2.5, so disinflation was costly but not extreme.","The sacrifice ratio is 4, so output loss was smaller than inflation reduction.","The sacrifice ratio is 14, so inflation increased during disinflation.","The sacrifice ratio is 0.4, so the policy had no output cost."],"a":0,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"legendary","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Using the ending inflation rate instead of the inflation reduction.","feedback":"Inflation fell by 4 points, and 10/4 = 2.5."},
{"id":9050,"q":"The Fed reduces inflation by 6 percentage points. The sacrifice ratio is 1.75. Which output loss should the Custodian expect?","options":["10.5 percent of one year's output","7.75 percent of one year's output","4.25 percent of one year's output","1.75 percent of one year's output"],"a":0,"tag":"sacrifice_ratio","type":"calculation","objective":"LO36.5","difficulty":"legendary","conceptCluster":"phillips_curve","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Adding the inflation reduction and sacrifice ratio.","feedback":"Output loss equals 1.75 x 6 = 10.5 percent of one year's output."},
{"id":9051,"q":"A student says, 'Since money is neutral, monetary policy cannot affect output during recessions.' Which correction is strongest?","options":["Neutrality is a long-run claim; short-run sticky prices allow AD effects on output.","Neutrality means money changes output permanently but not prices.","Neutrality applies only to fiscal policy and never to money.","Neutrality means the Phillips curve slopes downward in the long run."],"a":0,"tag":"monetary_neutrality","type":"trap","objective":"LO31.2","difficulty":"legendary","conceptCluster":"inflation_money_growth","primarySkill":"monetary_neutrality","repairSkill":"monetary_neutrality","commonError":"Applying long-run neutrality to every short-run case.","feedback":"Money is neutral in the long run, but monetary policy can affect output in the short run through aggregate demand."},
{"id":9052,"q":"A student says, 'If the Fed buys bonds, inflation must rise immediately and real output cannot move.' Which correction is strongest?","options":["In the short run, lower rates can raise AD and output before long-run price adjustment dominates.","Bond purchases only change fiscal spending, so inflation and output are unaffected.","Bond purchases lower AD because reserves rise and lending must fall.","In the long run, bond purchases permanently reduce unemployment."],"a":0,"tag":"monetary_policy","type":"trap","objective":"LO35.2","difficulty":"legendary","conceptCluster":"policy_transmission","primarySkill":"monetary_policy_transmission","repairSkill":"monetary_policy_transmission","commonError":"Skipping the short-run transmission channel.","feedback":"Open-market purchases lower interest rates and can raise AD and output in the short run."},
{"id":9053,"q":"The Custodian sees high inflation caused by demand growth, not a supply shock. Which response is most defensible?","options":["Contractionary policy can reduce AD, lower inflation pressure, and cool output.","Expansionary policy can reduce AD, lower inflation pressure, and cool output.","Contractionary policy shifts SRAS right and raises output above potential.","Expansionary policy shifts LRPC left and lowers natural unemployment."],"a":0,"tag":"stabilization_policy","type":"chancellor_memo","objective":"LO35.5","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Confusing demand inflation with supply shock inflation.","feedback":"If inflation is demand-driven, contractionary policy can cool AD and reduce inflation pressure."},
{"id":9054,"q":"The Custodian sees high inflation caused by an adverse supply shock, not demand growth. Which response is most defensible?","options":["Contraction may reduce inflation pressure but risks deeper output losses.","Expansion must lower inflation because it raises aggregate demand.","Contraction must raise output because lower AD reduces firm costs.","Expansion shifts SRAS right because government spending increases productivity."],"a":0,"tag":"supply_shocks","type":"chancellor_memo","objective":"LO34.4","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Using demand-inflation logic on supply-shock inflation.","feedback":"With supply-shock inflation, contraction can fight prices but may worsen unemployment and output losses."},
{"id":9055,"q":"A final memo says, 'Use policy to stabilize output, but do not ignore expectations.' Why is that good advice?","options":["Expectations shift SRAS and SRPC, changing the long-run cost of short-run policy choices.","Expectations only affect M1, so they matter for banking but not inflation or output.","Expectations shift LRAS every time inflation changes, making recessions permanent.","Expectations remove policy lags because people adjust before shocks occur."],"a":0,"tag":"ad_as_pc_integration","type":"chancellor_memo","objective":"LO36.3","difficulty":"legendary","conceptCluster":"chancellor_policy","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Ignoring expectations in stabilization policy.","feedback":"Expectations affect wage-setting, SRAS, SRPC, inflation persistence, and the cost of disinflation. That is where the bodies are buried."}	 
],
	
legendaryBoss: [
{"id":9100,"q":"The economy is below potential after AD falls. Inflation is also falling. Which Custodian ruling is strongest?","options":["Use expansionary policy or allow SRAS to adjust right; this is a demand-side recession.","Tighten policy because falling inflation proves output is above potential.","Accommodate a supply shock because falling inflation means SRAS shifted left.","Ignore the gap because unemployment cannot move in the short run."],"a":0,"tag":"ad_as_pc_integration","type":"legendary_boss","objective":"LO34.4","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Confusing demand recessions with supply shocks.","feedback":"Falling output and falling inflation point to a negative AD shock, not stagflation."},
{"id":9101,"q":"The economy is below potential after an oil shock. Inflation is rising. Which Custodian ruling is strongest?","options":["Recognize stagflation; stimulus supports output but risks inflation, while tightening fights inflation but worsens output.","Use standard expansionary policy because all below-potential output means inflation must fall.","Use standard contractionary policy because all high inflation means output must be above potential.","Wait for AD to shift right automatically because oil shocks cannot affect employment."],"a":0,"tag":"supply_shocks","type":"legendary_boss","objective":"LO34.4","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Treating supply shocks like ordinary AD shocks.","feedback":"An adverse supply shock raises inflation and unemployment together, making policy ugly. Good. That is the point."},
{"id":9102,"q":"Refer to the graph with LRAS. The economy starts at AD1-AS2. A supply shock shifts AS2 to AS1, then policymakers shift AD1 to AD2. What should the Custodian conclude?","options":["Output returns to Y1, but the price level rises to P3.","Output rises to Y2, while the price level stays at P2.","Output falls to Y3, while the price level falls to P1.","Output returns to Y1, and the price level falls to P1."],"a":0,"tag":"ad_as_policy","type":"legendary_boss_graph","objective":"LO34.4","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Missing the inflation cost of accommodation.","feedback":"AD stimulus can restore output after a supply shock, but it pushes the price level higher.","image":"adaslras.webp"},
{"id":9103,"q":"Refer to the graph with LRAS. The economy starts at AD2-AS2. No policy responds, and expected prices rise. Which ruling is correct?","options":["SRAS shifts left, output returns toward Y1, and the price level rises.","SRAS shifts right, output moves toward Y3, and prices fall.","AD shifts right, output stays at Y2, and inflation stops.","LRAS shifts right, making Y2 the new natural output."],"a":0,"tag":"long_run_adjustment","type":"legendary_boss_graph","objective":"LO34.5","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Treating short-run booms as permanent natural output.","feedback":"Above-potential output raises wages and expected prices, shifting SRAS left until output returns toward LRAS.","image":"adaslras.webp"},
{"id":9104,"q":"Refer to the graph with LRAS. The economy starts at AD1-AS1. No policy responds, and expected prices fall. Which ruling is correct?","options":["SRAS shifts right, output returns toward Y1, and the price level falls.","SRAS shifts left, output moves toward Y3, and prices rise.","AD shifts left, output stays at Y3, and inflation rises.","LRAS shifts left, making Y3 the new natural output."],"a":0,"tag":"long_run_adjustment","type":"legendary_boss_graph","objective":"LO34.5","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"explain_long_run_adjustment","repairSkill":"explain_long_run_adjustment","commonError":"Forgetting recessionary gaps can self-correct through SRAS.","feedback":"Below-potential output puts downward pressure on wages and expected prices, shifting SRAS right." ,"image":"adaslras.webp"},
{"id":9105,"q":"The Custodian sees high inflation, output above potential, and unemployment below natural. Which ruling is strongest?","options":["This looks like excess AD; tightening can cool inflation and move output back toward potential.","This looks like adverse supply shock; expansion is riskless because output is high.","This looks like weak AD; stimulus is needed because unemployment is below natural.","This looks like LRAS growth; inflation should disappear without any adjustment."],"a":0,"tag":"ad_as_pc_integration","type":"legendary_boss","objective":"LO36.2","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"map_ad_as_to_pc","repairSkill":"map_ad_as_to_pc","commonError":"Confusing demand-driven inflation with supply-shock inflation.","feedback":"High output, low unemployment, and high inflation fit a positive AD shock."},
{"id":9106,"q":"The Custodian sees high inflation, output below potential, and unemployment above natural. Which ruling is strongest?","options":["This looks like adverse supply pressure; simple demand tightening risks making unemployment worse.","This looks like excess AD; tightening lowers inflation and raises output immediately.","This looks like favorable supply growth; expansion is needed to lower prices.","This looks like money neutrality; policy cannot affect unemployment even briefly."],"a":0,"tag":"ad_as_pc_integration","type":"legendary_boss","objective":"LO36.3","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"evaluate_supply_shock_policy","repairSkill":"evaluate_supply_shock_policy","commonError":"Treating all inflation as excess demand.","feedback":"High inflation with above-natural unemployment screams worsened tradeoff, not clean demand overheating."},
{"id":9107,"q":"Refer to the LRPC graph. The economy starts at c. Policymakers push inflation above expectations and move to a. What makes this position temporary?","options":["Expected inflation rises, SRPC shifts up, and unemployment returns toward U2.","Expected inflation falls, SRPC shifts down, and unemployment stays at U1.","The LRPC shifts left, making U1 the new natural rate.","The price level falls, making point a a long-run equilibrium."],"a":0,"tag":"natural_rate_hypothesis","type":"legendary_boss_graph","objective":"LO36.1","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"natural_rate_hypothesis","repairSkill":"natural_rate_hypothesis","commonError":"Treating the short-run Phillips curve as permanent.","feedback":"Point a is temporary because expectations adjust. The economy returns to natural unemployment at higher inflation.","image":"lrpc.webp"},
{"id":9108,"q":"Refer to the LRPC graph. The economy starts at b. The Fed reduces inflation below expectations and moves to d. What completes the long-run adjustment?","options":["Expected inflation falls, SRPC shifts down, and unemployment returns to U2 at c.","Expected inflation rises, SRPC shifts up, and unemployment returns to U2 at b.","The LRPC shifts right, making U3 the new natural rate.","Actual inflation rises again, making d permanent."],"a":0,"tag":"disinflation","type":"legendary_boss_graph","objective":"LO36.4","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"monetary_policy_pc_transition","repairSkill":"monetary_policy_pc_transition","commonError":"Missing the expectations adjustment after disinflation.","feedback":"Disinflation temporarily raises unemployment, then expected inflation falls and the SRPC shifts downward.","image":"lrpc.webp"},
{"id":9109,"q":"Refer to the SRPC graph. The economy moves from SRPC1 to SRPC2. The Custodian must reject which claim?","options":["The Phillips curve tradeoff improved because inflation is now lower at each unemployment rate.","Expected inflation may have risen, worsening the inflation-unemployment tradeoff.","An adverse supply shock may have shifted the SRPC upward.","At the same unemployment rate, inflation is higher on SRPC2."],"a":0,"tag":"supply_shock_pc","type":"legendary_boss_graph","objective":"LO36.3","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"supply_shock_pc_shift","repairSkill":"supply_shock_pc_shift","commonError":"Calling an upward SRPC shift an improvement.","feedback":"SRPC2 is worse, not better. Inflation is higher at the same unemployment rate.","image":"srpc.webp"},
{"id":9110,"q":"The Fed wants to reduce inflation from 11 percent to 6 percent. Expected inflation is sticky, and the sacrifice ratio is 3. What output loss should the Custodian expect?","options":["15 percent of one year's output","5 percent of one year's output","8 percent of one year's output","33 percent of one year's output"],"a":0,"tag":"sacrifice_ratio","type":"legendary_boss_calculation","objective":"LO36.5","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Adding the sacrifice ratio instead of multiplying by inflation reduction.","feedback":"Inflation falls by 5 points. Output loss is 3 x 5 = 15 percent of one year's output."},
{"id":9111,"q":"Disinflation reduces inflation by 4 percentage points and output loss is 18 percent of one year's GDP. What should the Custodian report?","options":["Sacrifice ratio is 4.5; the disinflation was costly.","Sacrifice ratio is 14; the disinflation was costless.","Sacrifice ratio is 22; inflation must have increased.","Sacrifice ratio is 0.22; output loss was negligible."],"a":0,"tag":"sacrifice_ratio","type":"legendary_boss_calculation","objective":"LO36.5","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"calculate_sacrifice_ratio","repairSkill":"calculate_sacrifice_ratio","commonError":"Dividing by the wrong value.","feedback":"Sacrifice ratio equals output loss divided by inflation reduction, so 18/4 = 4.5."},
{"id":9112,"q":"The economy is below potential. Congress expands spending, but interest rates rise and private investment weakens. Which Custodian ruling is strongest?","options":["Fiscal policy shifts AD right, but crowding out reduces the final effect.","Fiscal policy shifts SRAS right, so crowding out cannot occur.","Fiscal policy has no AD effect because only the Fed moves spending.","Fiscal policy lowers interest rates, so private investment must rise."],"a":0,"tag":"crowding_out","type":"legendary_boss","objective":"LO35.4","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"crowding_out_effect","repairSkill":"crowding_out_effect","commonError":"Ignoring crowding out after fiscal expansion.","feedback":"Fiscal expansion can raise AD, but higher interest rates can crowd out investment."},
{"id":9113,"q":"The economy is below potential, but inflation expectations are rising. Which Custodian ruling is strongest?","options":["Stimulus may support output, but it risks validating inflation expectations.","Stimulus always lowers expected inflation because unemployment is high.","Tightening always raises output because expectations matter more than spending.","Doing nothing guarantees lower inflation and lower unemployment together."],"a":0,"tag":"stabilization_policy","type":"legendary_boss","objective":"LO35.5","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Ignoring the conflict between output support and inflation credibility.","feedback":"When the economy is weak but expectations are rising, policy must balance output support against inflation credibility."},
{"id":9114,"q":"Refer to the money-market and AD graph. The Fed shifts money supply left while the economy is already weak. What is the danger?","options":["Rates rise, AD falls, and the recessionary gap can deepen.","Rates fall, AD rises, and inflation disappears instantly.","Rates rise, SRAS shifts right, and unemployment falls.","Rates fall, LRAS shifts right, and output becomes permanent."],"a":0,"tag":"monetary_policy","type":"legendary_boss_graph","objective":"LO35.2","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"monetary_policy_transmission","repairSkill":"monetary_policy_transmission","commonError":"Missing the danger of tightening into weak demand.","feedback":"A leftward money-supply shift raises interest rates, lowers investment, and shifts AD left.","image":"ad_ms_md.webp"},
{"id":9115,"q":"Refer to the money-market graph. Money demand rises while money supply falls. Which Custodian conclusion is strongest?","options":["Both shifts raise interest rates and weaken AD pressure.","Both shifts lower interest rates and strengthen AD pressure.","Money demand raises rates, but lower money supply lowers rates.","Money demand lowers rates, but lower money supply raises rates."],"a":0,"tag":"money_market_ad","type":"legendary_boss_graph","objective":"LO35.1","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"money_demand_interest_rate","repairSkill":"money_demand_interest_rate","commonError":"Missing that both forces raise interest rates.","feedback":"Higher money demand and lower money supply both push interest rates upward.","image":"moneyd2_moneys2.webp"},
{"id":9116,"q":"A government prints money to finance spending. Inflation rises, expected inflation rises, and nominal rates rise. Which ruling is strongest?","options":["The inflation tax reduces money value, and the Fisher effect raises nominal rates.","The money multiplier lowers inflation, and the Fisher effect lowers nominal rates.","The inflation tax raises real wages, and monetary neutrality fails permanently.","Commodity money loses value because fiat money must be backed by gold."],"a":0,"tag":"inflation_policy","type":"legendary_boss","objective":"LO31.5","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"inflation_tax","repairSkill":"inflation_tax","commonError":"Treating money-financed spending as painless.","feedback":"Printing money can finance spending through an inflation tax, while higher expected inflation raises nominal interest rates."},
{"id":9117,"q":"Money growth rises sharply, velocity falls, and real output rises. Which ruling should the Custodian issue?","options":["Inflation cannot be judged from money growth alone because V and Y also changed.","Inflation must equal money growth because V and Y never affect prices.","Inflation must be zero because output growth cancels every monetary change.","Inflation must equal velocity growth because money growth is neutral."],"a":0,"tag":"quantity_theory","type":"legendary_boss","objective":"LO31.1","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"quantity_equation","repairSkill":"quantity_equation","commonError":"Using money growth alone without the quantity equation.","feedback":"MV = PY, so inflation depends on money growth, velocity growth, and real output growth."},
{"id":9118,"q":"A student says monetary neutrality means the Fed cannot affect unemployment during a recession. Which ruling is strongest?","options":["Wrong; neutrality is a long-run claim, while short-run sticky prices allow AD effects.","Wrong; neutrality means money permanently lowers unemployment whenever inflation rises.","Correct; monetary policy cannot move AD because interest rates do not affect investment.","Correct; neutrality means SRPC and LRPC are both vertical in every period."],"a":0,"tag":"monetary_neutrality","type":"legendary_boss_trap","objective":"LO31.2","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"monetary_neutrality","repairSkill":"monetary_neutrality","commonError":"Applying long-run neutrality to short-run fluctuations.","feedback":"Money is neutral in the long run, not necessarily in the short run."},
{"id":9119, bossStage: "final","q":"The Custodian asks for the final synthesis: why can stabilization policy fail even when the model points in the right direction?","options":["Lags, expectations, crowding out, and supply shocks can change the final effect.","Policy always fails because AD cannot shift in the short run.","Policy always succeeds because expectations never adjust.","Policy only affects M1, so output and inflation never respond."],"a":0,"tag":"stabilization_policy","type":"legendary_boss_synthesis","objective":"LO35.5","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"choose_stabilization_response","repairSkill":"choose_stabilization_response","commonError":"Thinking correct curve direction guarantees clean policy success.","feedback":"Correct policy direction is not enough. Timing, expectations, crowding out, and supply shocks can all wreck the clean textbook story."},
{"id":9120, bossStage: "final","q":"The Custodian delivers the final trial: AD rises, output moves above potential, unemployment falls below natural, and expected inflation begins rising. What is the final warning?","options":["The short-run gain becomes a long-run inflation problem once expectations adjust.","The natural rate permanently falls because unemployment was low for one period.","The SRPC shifts downward because actual inflation increased above expected inflation.","The price level falls because higher AD lowers production costs."],"a":0,"tag":"ad_as_pc_integration","type":"legendary_boss_synthesis","objective":"LO36.3","difficulty":"legendaryBoss","conceptCluster":"final_chancellor","primarySkill":"trace_expectations_adjustment","repairSkill":"trace_expectations_adjustment","commonError":"Missing the transition from short-run policy gain to long-run expectation cost.","feedback":"Demand expansion can lower unemployment temporarily, but rising expected inflation shifts the SRPC upward and erodes the gain."}
],

{ id: 2001, q: "A person uses dollars to buy groceries, compare prices, and save for next month. Which functions of money are being used?", options: ["Medium of exchange, unit of account, and store of value", "Store of value only", "Unit of account only", "Reserve requirement and money multiplier"], a: 0, tag: "money_functions", type: "boss_scaffold_application", objective: "30.1", difficulty: "easyboss", conceptCluster: "money_basics", primarySkill: "match_money_functions_to_context", secondarySkills: ["medium_of_exchange", "unit_of_account", "store_of_value"], repairSkill: "functions_of_money", commonError: "thinking money only has one function at a time", feedback: "Buying, comparing prices, and saving line up with the three core functions of money." },
{ id: 2002, q: "Currency held by the public is $900, checkable deposits are $1,100, savings deposits are $1,500, and small time deposits are $500. What are M1 and M2?", options: ["M1 = $2,000; M2 = $4,000", "M1 = $900; M2 = $2,900", "M1 = $1,100; M2 = $3,100", "M1 = $2,000; M2 = $2,000"], a: 0, tag: "money_measures", type: "boss_scaffold_synthesis", objective: "30.1", difficulty: "easyboss", conceptCluster: "money_supply_measures", primarySkill: "calculate_m1_m2", secondarySkills: ["currency", "checkable_deposits", "near_money"], repairSkill: "m1_m2_components", commonError: "forgetting M2 includes M1 plus near monies", feedback: "M1 is $900 + $1,100 = $2,000. M2 adds savings and small time deposits, so M2 = $4,000." },
